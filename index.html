}

/* ---------- 녹음 ---------- */
let recState = { recorder: null, chunks: [], startTime: 0, timerId: null };
const REC_MAX_SEC = 300;
async function startRecording() {
  if (recState.recorder) { toast('이미 녹음 중'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    recState.recorder = recorder;
    recState.chunks = [];
    recState.startTime = Date.now();
    recorder.ondataavailable = e => { if (e.data.size > 0) recState.chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recState.chunks, { type: mime || 'audio/webm' });
      clearInterval(recState.timerId);
      resetRecUI();
      recState.recorder = null;
      const file = new File([blob], 'recording.webm', { type: blob.type });
      await handleKoreanAudioUpload(file);
    };
    recorder.start();
    const startBtn = $('#recStartBtn'), stopBtn = $('#recStopBtn');
    if (startBtn) startBtn.style.display = 'none';
    if (stopBtn) stopBtn.style.display = 'inline-block';
    recState.timerId = setInterval(() => {
      const elapsed = (Date.now() - recState.startTime) / 1000;
      const timer = $('#recTimer'), bar = $('#recBar');
      if (timer) timer.textContent = `${formatTime(elapsed)} / ${formatTime(REC_MAX_SEC)}`;
      if (bar) bar.style.width = `${(elapsed / REC_MAX_SEC) * 100}%`;
      if (elapsed >= REC_MAX_SEC) stopRecording();
    }, 200);
  } catch (err) { toast('마이크 권한 필요: ' + err.message); }
}
function stopRecording() {
  if (recState.recorder && recState.recorder.state !== 'inactive') recState.recorder.stop();
}
function resetRecUI() {
  const startBtn = $('#recStartBtn'), stopBtn = $('#recStopBtn');
  const timer = $('#recTimer'), bar = $('#recBar');
  if (startBtn) startBtn.style.display = 'inline-block';
  if (stopBtn) stopBtn.style.display = 'none';
  if (timer) timer.textContent = '00:00 / 05:00';
  if (bar) bar.style.width = '0%';
}
function formatTime(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

/* ============================================================
   문서 목록 / 정렬 / 검색 / 선택삭제 / 원본보기
   ============================================================ */
async function refreshDocList() {
  const list = $('#docList');
  if (!list) return;
  list.innerHTML = '';
  try {
    let docs = await dbAll('documents');
    if (STATE.docSearch) {
      const q = STATE.docSearch.toLowerCase();
      docs = docs.filter(d =>
        (d.title || '').toLowerCase().includes(q) ||
        (d.fullText || '').toLowerCase().includes(q)
      );
    }
    docs.sort((a, b) => {
      if (STATE.docSort === 'name') {
        return String(a.title || '').localeCompare(String(b.title || ''));
      }
      return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
    });
    if (docs.length === 0) {
      list.innerHTML = '<div class="loading-mini">저장된 문서가 없습니다</div>';
      return;
    }
    docs.forEach(doc => list.appendChild(renderDocItem(doc)));
  } catch (err) { console.error('doc list', err); }
}

function renderDocItem(doc) {
  const item = document.createElement('div');
  item.className = 'doc-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = STATE.docSelected.has(doc.id);
  cb.onchange = () => { if (cb.checked) STATE.docSelected.add(doc.id); else STATE.docSelected.delete(doc.id); };
  item.appendChild(cb);
  
  const body = document.createElement('div');
  body.className = 'doc-item-body';
  const isPartial = !doc.sentences || doc.sentences.length === 0;
  const wordCount = doc.wordData ? Object.keys(doc.wordData).length : 0;
  const hardCount = (doc.sentences || []).filter(s => s.hardListening?.ready).length;
  const warmReady = wordCount > 0 && hardCount === (doc.sentences || []).length && hardCount > 0;
  body.innerHTML = `
    <div class="doc-title">${escapeHtml(doc.title || '제목 없음')}${isPartial ? ' <span class="doc-badge">부분</span>' : ''}${warmReady ? ' <span class="doc-badge warm">준비완료</span>' : ''}</div>
    <div class="doc-meta">${escapeHtml(doc.sourceType || '')} · ${(doc.sentences || []).length}문장 · ${new Date(doc.createdAt || 0).toLocaleDateString('ko-KR')}</div>`;
  body.onclick = () => openDocument(doc.id);
  item.appendChild(body);
  
  const actions = document.createElement('div');
  actions.className = 'doc-actions';
  const playAllBtn = document.createElement('button');
  playAllBtn.textContent = '전체재생';
  playAllBtn.onclick = (e) => { e.stopPropagation(); playAllSentences(doc); };
  actions.appendChild(playAllBtn);
  if (doc.fileName) {
    const fileBtn = document.createElement('button');
    fileBtn.textContent = '원본보기';
    fileBtn.onclick = (e) => { e.stopPropagation(); viewOriginalFile(doc.id); };
    actions.appendChild(fileBtn);
  }
  const delBtn = document.createElement('button');
  delBtn.textContent = '삭제';
  delBtn.onclick = (e) => { e.stopPropagation(); deleteDocument(doc.id); };
  actions.appendChild(delBtn);
  item.appendChild(actions);
  return item;
}

let playAllState = { active: false };
async function playAllSentences(doc) {
  if (playAllState.active) { playAllState.active = false; stopSpeaking(); toast('재생 중지'); return; }
  const sentences = doc.sentences || [];
  if (sentences.length === 0) { toast('재생할 문장이 없습니다'); return; }
  playAllState.active = true;
  const useOriginal = doc.videoId && doc.segments?.length > 0;
  if (useOriginal) initYouTubePlayer(doc.videoId);
  for (const s of sentences) {
    if (!playAllState.active) break;
    await new Promise(resolve => {
      let seg = null;
      if (useOriginal && doc.segments) {
        const target = s.text.toLowerCase().slice(0, 15);
        seg = doc.segments.find(sg => sg.text.toLowerCase().includes(target));
      }
      if (seg && STATE.ytPlayer) playOriginal(seg.start, seg.end, resolve);
      else speak(s.text, { onEnd: resolve });
    });
  }
  playAllState.active = false;
}

async function viewOriginalFile(docId) {
  try {
    const fileRec = await dbGet('files', docId);
    if (!fileRec || !fileRec.blob) { toast('원본 파일이 저장되어 있지 않습니다'); return; }
    const url = URL.createObjectURL(fileRec.blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (err) { toast('파일 열기 실패: ' + err.message); }
}

async function openDocument(docId) {
  stopWarmup();
  const doc = await dbGet('documents', docId);
  if (!doc) return;
  STATE.analyzing = false;
  stopSpeaking();
  resetActivePlayBtn();
  const progressCard = $('#progressCard'); if (progressCard) progressCard.style.display = 'none';
  const container = $('#sentenceList'); if (container) container.innerHTML = '';
  STATE.sentences = doc.sentences || [];
  STATE.currentDocId = doc.id;
  STATE.currentDoc = doc;
  STATE.currentVideoId = doc.videoId || null;
  STATE.ytSegments = doc.segments || [];
  STATE.sourceType = doc.sourceType || 'text';
  STATE.currentFullText = doc.fullText || '';
  if (!doc.wordData) doc.wordData = {};
  if (doc.videoId && doc.segments?.length) initYouTubePlayer(doc.videoId);
  STATE.sentences.forEach(s => {
    if (!s.number) s.number = s.index + 1;
    renderSentenceBlock(s);
  });
  const side = $('#sidePanel'); if (side) side.classList.remove('open');
  updateOriginalModeAvailability();
  const saveBtn = $('#saveBtn'); if (saveBtn) saveBtn.style.display = 'inline-block';
  setStatus(`문서 열기 완료 (${STATE.sentences.length}문장)`);
  // 워밍 재개
  startWarmupForDoc(doc);
}

async function deleteDocument(docId) {
  if (!confirm('이 문서를 삭제하시겠습니까?')) return;
  await dbDelete('documents', docId);
  try { await dbDelete('files', docId); } catch {}
  STATE.docSelected.delete(docId);
  if (STATE.currentDocId === docId) {
    stopWarmup();
    const container = $('#sentenceList'); if (container) container.innerHTML = '';
    STATE.sentences = []; STATE.currentDocId = null; STATE.currentDoc = null;
  }
  refreshDocList();
  updateStorageInfo();
}
async function deleteSelectedDocs() {
  if (STATE.docSelected.size === 0) { toast('선택된 문서가 없습니다'); return; }
  if (!confirm(`선택된 ${STATE.docSelected.size}개 문서를 삭제하시겠습니까?`)) return;
  for (const id of Array.from(STATE.docSelected)) {
    await dbDelete('documents', id);
    try { await dbDelete('files', id); } catch {}
  }
  STATE.docSelected.clear();
  refreshDocList();
  updateStorageInfo();
}
async function deleteAllDocs() {
  if (!confirm('모든 문서를 삭제하시겠습니까?')) return;
  const all = await dbAll('documents');
  for (const d of all) {
    await dbDelete('documents', d.id);
    try { await dbDelete('files', d.id); } catch {}
  }
  STATE.docSelected.clear();
  if (STATE.currentDocId) {
    stopWarmup();
    const container = $('#sentenceList'); if (container) container.innerHTML = '';
    STATE.sentences = []; STATE.currentDocId = null; STATE.currentDoc = null;
  }
  refreshDocList();
  updateStorageInfo();
}
async function selectAllVisible() {
  const docs = await dbAll('documents');
  let filtered = docs;
  if (STATE.docSearch) {
    const q = STATE.docSearch.toLowerCase();
    filtered = filtered.filter(d => (d.title || '').toLowerCase().includes(q));
  }
  filtered.forEach(d => STATE.docSelected.add(d.id));
  refreshDocList();
}

async function manualSave() {
  if (!STATE.currentDocId) { toast('저장할 문서가 없습니다'); return; }
  const doc = await dbGet('documents', STATE.currentDocId);
  if (!doc) { toast('문서를 찾을 수 없습니다'); return; }
  const newTitle = prompt('저장할 제목', doc.title || '');
  if (newTitle === null) return;
  doc.title = newTitle.trim() || doc.title;
  doc.sentences = STATE.sentences;
  doc.wordData = STATE.currentDoc?.wordData || doc.wordData || {};
  doc.updatedAt = new Date().toISOString();
  await dbPut('documents', doc);
  toast('저장되었습니다');
  refreshDocList();
}

/* ============================================================
   문장 생성 모달
   ============================================================ */
const GRADES = ['K', '1st', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th', '11th', '12th'];
const WORD_COUNTS = [200, 400, 600, 800, 1000, 1200, 1400, 1600, 1800, 2000];

const genState = {
  grade: '5th',
  topic: '',
  wcIdx: 4,   // 1000 default
  style: 'Casual',
  format: 'Essay',
  recognizing: false,
  recognition: null
};

function openGenModal() {
  $('#genModal').classList.add('show');
  renderGradeChips();
  renderWordCount();
  applyChipActive('#styleRow', genState.style);
  applyChipActive('#formatRow', genState.format);
  $('#topicInput').value = genState.topic;
  $('#genStatus').textContent = '';
}
function closeGenModal() {
  $('#genModal').classList.remove('show');
  stopTopicRec();
}
function renderGradeChips() {
  const row = $('#gradeRow');
  row.innerHTML = '';
  GRADES.forEach(g => {
    const b = document.createElement('button');
    b.className = 'grade-chip' + (g === genState.grade ? ' active' : '');
    b.textContent = g;
    b.onclick = () => {
      genState.grade = g;
      renderGradeChips();
    };
    row.appendChild(b);
  });
  // 활성 칩으로 스크롤
  setTimeout(() => {
    const active = row.querySelector('.grade-chip.active');
    if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  }, 50);
}
function renderWordCount() {
  const track = $('#wcTrack');
  track.innerHTML = '';
  const positions = [-1, 0, 1];
  positions.forEach(off => {
    const idx = genState.wcIdx + off;
    const el = document.createElement('div');
    el.className = 'wc-item' + (off === 0 ? ' center' : '');
    if (idx < 0 || idx >= WORD_COUNTS.length) {
      el.textContent = '';
      el.style.visibility = 'hidden';
    } else {
      el.textContent = WORD_COUNTS[idx];
    }
    track.appendChild(el);
  });
  $('#wcLeft').disabled = genState.wcIdx <= 0;
  $('#wcRight').disabled = genState.wcIdx >= WORD_COUNTS.length - 1;
}
function moveWc(dir) {
  const next = genState.wcIdx + dir;
  if (next < 0 || next >= WORD_COUNTS.length) return;
  genState.wcIdx = next;
  renderWordCount();
  if ('vibrate' in navigator) try { navigator.vibrate(10); } catch {}
}
function applyChipActive(rowSelector, val) {

  $$(`${rowSelector} button`).forEach(b => b.classList.toggle('active', b.dataset.val === val));
}
function setupChipRow(rowSelector, onSelect) {

  $$(`${rowSelector} button`).forEach(b => {
    b.onclick = () => {

      $$(`${rowSelector} button`).forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      onSelect(b.dataset.val);
    };
  });
}

function startTopicRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('음성 입력 미지원 브라우저'); return; }
  if (genState.recognizing) { stopTopicRec(); return; }
  const rec = new SR();
  rec.lang = 'ko-KR';
  rec.interimResults = true;
  rec.continuous = true;
  let finalText = $('#topicInput').value || '';
  rec.onresult = (e) => {
    let interim = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const t = e.results[i][0].transcript;
      if (e.results[i].isFinal) finalText += t;
      else interim += t;
    }
    $('#topicInput').value = (finalText + ' ' + interim).trim();
  };
  rec.onerror = (e) => {
    toast('음성 인식 오류: ' + e.error);
    stopTopicRec();
  };
  rec.onend = () => {
    genState.recognizing = false;
    $('#topicMic').classList.remove('recording');
  };
  try {
    rec.start();
    genState.recognition = rec;
    genState.recognizing = true;
    $('#topicMic').classList.add('recording');
  } catch (err) { toast('인식 시작 실패: ' + err.message); }
}
function stopTopicRec() {
  if (genState.recognition) try { genState.recognition.stop(); } catch {}
  genState.recognition = null;
  genState.recognizing = false;
  $('#topicMic')?.classList.remove('recording');
}

async function generateSentences() {
  const topic = $('#topicInput').value.trim();
  if (!topic) { toast('주제를 입력하세요'); return; }
  
  const grade = genState.grade;
  const wc = WORD_COUNTS[genState.wcIdx];
  const style = genState.style;
  const format = genState.format;
  
  $('#genStatus').textContent = '생성 중...';
  $('#genStart').disabled = true;
  
  try {
    const prompt = `Write an English ${format.toLowerCase()} about "${topic}" suitable for a US Grade ${grade} student.

Requirements:
- Target word count: ${wc} words (within ±10%)
- Difficulty: vocabulary and sentence complexity appropriate for US Grade ${grade}
- Style: ${style}
- Use only natural American English as actually spoken/written in the US
- Do NOT use slang, profanity, or regional non-standard expressions
- Use clear punctuation and well-formed sentences

Output: ONLY the ${format.toLowerCase()} text in plain English. No title, no preface, no commentary, no JSON. Just the body text.`;
    const body = {
      contents: [{ role: 'user', parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.7, maxOutputTokens: 8192 }
    };
    const result = await callGeminiDirect(body);
    const text = result.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
    if (!text) throw new Error('빈 응답');
    
    closeGenModal();
    STATE.currentRawFile = null;
    await analyzeText(text, {
      sourceType: 'generated',
      title: titleFromText(topic)
    });
  } catch (err) {
    $('#genStatus').textContent = '실패: ' + err.message;
    toast('생성 실패: ' + err.message);
  } finally {
    $('#genStart').disabled = false;
  }
}

/* ============================================================
   저장 데이터 사용량
   ============================================================ */
async function updateStorageInfo() {
  const el = $('#storageInfo');
  if (!el) return;
  try {
    if (navigator.storage?.estimate) {
      const est = await navigator.storage.estimate();
      const usedMB = (est.usage / (1024 * 1024)).toFixed(2);
      const quotaMB = (est.quota / (1024 * 1024)).toFixed(0);
      const docs = await dbAll('documents');
      const words = await dbAll('words');
      el.textContent = `사용 ${usedMB} MB / ${quotaMB} MB · 문서 ${docs.length}개 · 단어 ${words.length}개`;
    } else {
      const docs = await dbAll('documents');
      const words = await dbAll('words');
      el.textContent = `문서 ${docs.length}개 · 단어 ${words.length}개`;
    }
  } catch (err) {
    el.textContent = '계산 실패';
  }
}

/* ============================================================
   맨위로 / 폰트 / 속도 / 성별
   ============================================================ */
function setupScrollTop() {
  let btn = $('#scrollTopBtn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'scrollTopBtn';
    btn.className = 'scroll-top-btn';
    btn.setAttribute('aria-label', '맨 위로');
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 12 L10 6 L16 12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    btn.style.display = 'none';
    btn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    document.body.appendChild(btn);
  }
  window.addEventListener('scroll', () => {
    btn.style.display = window.scrollY > 50 ? 'flex' : 'none';
  });
}
function setFontSize(n) {
  const size = Math.min(28, Math.max(12, n));
  STATE.fontSize = size;
  document.documentElement.style.setProperty('--base', `${size}px`);
  try { localStorage.setItem('fontSize', String(size)); } catch {}
  const label = $('#fontSizeLabel'); if (label) label.textContent = String(size);
}
const SPEED_OPTIONS = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2];
function renderSpeedGrid() {
  const grid = $('#speedGrid'); if (!grid) return;
  grid.innerHTML = '';
  SPEED_OPTIONS.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'speed-btn' + (Math.abs(v - STATE.speed) < 0.01 ? ' active' : '');
    btn.textContent = `${v.toFixed(1)}x`;
    btn.onclick = () => {
      STATE.speed = v;
      try { localStorage.setItem('speed', String(v)); } catch {}
      const t = $('#speedTitle'); if (t) t.textContent = `재생 속도: ${v.toFixed(1)}x`;
      renderSpeedGrid();
      applyPlaybackChange();
    };
    grid.appendChild(btn);
  });
}
function setGender(g) {
  STATE.voiceGender = g;
  try { localStorage.setItem('voiceGender', g); } catch {}

  $$('#genderToggle button').forEach(b => b.classList.toggle('active', b.dataset.gender === g));
  loadVoices();
  speak('Hello, this is your selected voice.', { lang: 'en-US' });
}

/* ============================================================
   UI 바인딩
   ============================================================ */
function bindUI() {
  $('#analyzeBtn')?.addEventListener('click', handleAnalyze);
  $('#openGenBtn')?.addEventListener('click', openGenModal);
  $('#fileInput')?.addEventListener('change', e => handleFile(e.target.files[0]));
  $('#hamburgerBtn')?.addEventListener('click', () => {
    $('#sidePanel')?.classList.toggle('open');
    updateStorageInfo();
  });
  $('#sidePanelClose')?.addEventListener('click', () => $('#sidePanel')?.classList.remove('open'));
  $('#cancelBtn')?.addEventListener('click', () => {
    STATE.analyzing = false;
    hideProgress();
    setStatus('분석 취소됨');
  });
  $('#saveBtn')?.addEventListener('click', manualSave);
  $('#fontPlus')?.addEventListener('click', () => setFontSize(STATE.fontSize + 2));
  $('#fontMinus')?.addEventListener('click', () => setFontSize(STATE.fontSize - 2));
  $('#voiceModeSelect')?.addEventListener('change', e => {
    STATE.voiceMode = e.target.value;
    updateOriginalModeAvailability();
  });

  $$('#genderToggle button').forEach(b => b.addEventListener('click', () => setGender(b.dataset.gender)));
  $('#koreanModeToggle')?.addEventListener('change', e => toggleKoreanMode(e.target.checked));
  $('#koreanAudioInput')?.addEventListener('change', e => handleKoreanAudioUpload(e.target.files[0]));
  $('#recStartBtn')?.addEventListener('click', startRecording);
  $('#recStopBtn')?.addEventListener('click', stopRecording);
  
  $('#docSearch')?.addEventListener('input', e => { STATE.docSearch = e.target.value; refreshDocList(); });
  $('#docSort')?.addEventListener('change', e => { STATE.docSort = e.target.value; refreshDocList(); });
  $('#docSelectAll')?.addEventListener('click', selectAllVisible);
  $('#docDeleteSelected')?.addEventListener('click', deleteSelectedDocs);
  $('#docDeleteAll')?.addEventListener('click', deleteAllDocs);
  
  // 문장 생성 모달
  $('#genClose')?.addEventListener('click', closeGenModal);
  $('#genCancel')?.addEventListener('click', closeGenModal);
  $('#genModal .gen-modal-backdrop')?.addEventListener('click', closeGenModal);
  $('#genStart')?.addEventListener('click', generateSentences);
  $('#wcLeft')?.addEventListener('click', () => moveWc(-1));
  $('#wcRight')?.addEventListener('click', () => moveWc(1));
  $('#topicMic')?.addEventListener('click', startTopicRec);
  $('#topicClear')?.addEventListener('click', () => { $('#topicInput').value = ''; });
  $('#topicInput')?.addEventListener('input', e => { genState.topic = e.target.value; });
  setupChipRow('#styleRow', v => genState.style = v);
  setupChipRow('#formatRow', v => genState.format = v);
  
  // 단어 수 캐러셀 swipe 지원
  const wcTrack = $('#wcTrack');
  if (wcTrack) {
    let startX = null;
    wcTrack.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
    wcTrack.addEventListener('touchend', e => {
      if (startX === null) return;
      const dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 30) moveWc(dx < 0 ? 1 : -1);
      startX = null;
    });
  }
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const wm = $('#wordModal');
      const gm = $('#genModal');
      if (wm && wm.style.display !== 'none') closeWordModal();
      else if (gm && gm.classList.contains('show')) closeGenModal();
      else $('#sidePanel')?.classList.remove('open');
    }
  });
}

/* ============================================================
   초기화
   ============================================================ */
async function init() {
  try {
    const saved = parseInt(localStorage.getItem('fontSize') || '16', 10);
    setFontSize(saved);
  } catch { setFontSize(16); }
  try {
    const sp = parseFloat(localStorage.getItem('speed') || '1.0');
    if (SPEED_OPTIONS.some(v => Math.abs(v - sp) < 0.01)) STATE.speed = sp;
  } catch {}
  try { STATE.voiceGender = localStorage.getItem('voiceGender') || 'female'; } catch {}
  
  bindUI();
  setupScrollTop();
  ensureModalRoot();
  renderSpeedGrid();
  $('#speedTitle').textContent = `재생 속도: ${STATE.speed.toFixed(1)}x`;

  $$('#genderToggle button').forEach(b => b.classList.toggle('active', b.dataset.gender === STATE.voiceGender));
  
  try { await dbOpen(); } catch (err) { console.error('DB open:', err); }
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    setStatus(`서버 연결됨 (키 ${data.keyCount}개)`);
  } catch {
    setStatus('서버 연결 실패');
  }
  try { warmupTTS(); loadVoices(); } catch {}
  setTimeout(() => loadVoices(), 500);
  setTimeout(() => loadVoices(), 1500);
  
  refreshDocList();
  updateStorageInfo();
  updateOriginalModeAvailability();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
