<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Thinking Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
  --base: 16px;
  --bg: #f7f8fa;
  --card: #ffffff;
  --border: #e3e6eb;
  --text: #1a1d22;
  --muted: #6b7280;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --accent: #10b981;
  --danger: #ef4444;
  --warn: #f59e0b;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: var(--base);
  line-height: 1.6;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 1rem; }

/* Header */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-title { font-size: 1.1rem; font-weight: 700; margin: 0; }
.hamburger-btn {
  background: none; border: 1px solid var(--border);
  padding: 6px 12px; border-radius: 6px;
  font-size: 0.9rem;
}

/* Container */
.app-container {
  max-width: 800px; margin: 0 auto;
  padding: 16px;
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 16px;
}

/* Input Card */
.input-card .url-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 10px;
}
.input-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-primary {
  background: var(--primary); color: white;
  border: none; padding: 10px 18px;
  border-radius: 6px; font-weight: 500;
}
.btn-primary:hover { background: var(--primary-hover); }
.btn-secondary {
  background: white; color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 14px; border-radius: 6px;
}
.btn-secondary:hover { background: var(--bg); }
.file-label {
  display: inline-block;
  background: white; color: var(--text);
  border: 1px solid var(--border);
  padding: 10px 14px; border-radius: 6px;
  cursor: pointer;
}
.file-label input { display: none; }

/* Korean Input Card */
.kr-input-card { display: none; }
.kr-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.rec-bar-wrap {
  width: 100%; height: 6px;
  background: var(--border); border-radius: 3px;
  overflow: hidden; margin: 8px 0;
}
.rec-bar { height: 100%; width: 0%; background: var(--danger); transition: width 0.2s; }
.rec-timer { font-family: monospace; color: var(--muted); }
.kr-result-block {
  background: var(--bg);
  border-radius: 8px;
  padding: 12px;
  margin-top: 10px;
}
.kr-label {
  font-size: 0.85rem; color: var(--muted);
  font-weight: 600; margin-bottom: 4px;
}
.kr-text { word-break: keep-all; }

/* Progress */
.progress-card { display: none; }
.progress-bar-wrap {
  width: 100%; height: 8px;
  background: var(--border); border-radius: 4px;
  overflow: hidden;
}
.progress-bar {
  height: 100%; width: 0%;
  background: var(--primary);
  transition: width 0.3s;
}
.progress-text { margin-top: 8px; font-size: 0.9rem; color: var(--muted); }

/* Sentence Card */
.sentence-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 12px;
}
.sentence-text {
  font-size: 1.05rem;
  line-height: 1.7;
  word-break: keep-all;
  margin-bottom: 10px;
}
.sentence-controls {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.btn-ctrl {
  background: white;
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 5px;
  font-size: 0.85rem;
}
.btn-ctrl:hover { background: var(--bg); }
.btn-ctrl[data-state="stop"] { background: var(--danger); color: white; border-color: var(--danger); }
.sentence-slot { margin-top: 10px; }

.translation-box, .hard-box, .follow-box {
  background: var(--bg);
  border-radius: 6px;
  padding: 10px;
  margin-top: 8px;
}
.trans-row { margin: 6px 0; word-break: keep-all; }
.trans-label {
  display: inline-block;
  font-size: 0.75rem; font-weight: 600;
  color: var(--muted);
  background: white;
  padding: 2px 8px; border-radius: 10px;
  margin-right: 6px;
}
.hard-item { padding: 6px 0; border-bottom: 1px solid var(--border); }
.hard-item:last-child { border-bottom: none; }
.hard-type {
  font-weight: 600; color: var(--primary);
  margin-right: 6px;
}
.fr-score { font-weight: 700; color: var(--primary); margin-bottom: 6px; }
.fr-spoken { color: var(--muted); font-size: 0.9rem; margin-bottom: 6px; }
.fr-ok { color: var(--accent); font-weight: 500; }
.fr-no { color: var(--danger); text-decoration: line-through; }
.follow-err { color: var(--danger); }

/* Words */
.word-token {
  cursor: pointer;
  border-bottom: 1px dotted transparent;
  transition: all 0.15s;
}
.word-token:hover {
  background: #fef3c7;
  border-bottom-color: var(--warn);
}

/* Buttons mini */
.btn-mini {
  background: white;
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.75rem;
  margin-left: 4px;
  color: var(--muted);
}
.btn-mini:hover { background: var(--primary); color: white; border-color: var(--primary); }

.loading-mini { color: var(--muted); font-size: 0.9rem; }

/* Side Panel */
.side-panel {
  position: fixed; top: 0; right: -320px;
  width: 320px; max-width: 85vw;
  height: 100vh;
  background: var(--card);
  border-left: 1px solid var(--border);
  transition: right 0.3s;
  z-index: 200;
  overflow-y: auto;
  padding: 16px;
}
.side-panel.open { right: 0; }
.side-panel h3 { margin: 16px 0 8px; font-size: 1rem; }
.side-close {
  position: absolute; top: 12px; right: 12px;
  background: none; border: none; font-size: 1.2rem;
}
.setting-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0; border-bottom: 1px solid var(--border);
}
.setting-row label { flex: 1; }
.setting-row select, .setting-row input[type="checkbox"] { margin-left: 8px; }
.font-controls { display: flex; gap: 6px; align-items: center; }
.font-controls button {
  width: 32px; height: 32px;
  border: 1px solid var(--border); background: white;
  border-radius: 4px; font-size: 1rem;
}

.doc-item {
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 6px;
  cursor: pointer;
  position: relative;
}
.doc-item:hover { background: var(--bg); }
.doc-title { font-weight: 500; word-break: keep-all; }
.doc-meta { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }
.doc-badge {
  font-size: 0.7rem; background: var(--warn); color: white;
  padding: 1px 6px; border-radius: 3px; margin-left: 4px;
}
.doc-del {
  position: absolute; top: 8px; right: 8px;
}

/* Word Modal */
.word-modal-root {
  position: fixed; inset: 0;
  z-index: 500;
}
.word-modal-backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.5);
}
.word-modal-panel {
  position: absolute;
  top: 5%; left: 50%;
  transform: translateX(-50%);
  width: 92%; max-width: 600px;
  max-height: 90vh;
  background: var(--card);
  border-radius: 12px;
  padding: 24px 20px 20px;
  overflow-y: auto;
}
.word-modal-close {
  position: sticky; top: 0; float: right;
  background: rgba(0,0,0,0.4); color: white;
  border: none; width: 32px; height: 32px;
  border-radius: 50%; font-weight: 700;
  z-index: 10;
}
.word-modal-back {
  background: white;
  border: 1px solid var(--border);
  padding: 4px 10px; border-radius: 5px;
  font-size: 0.85rem;
  margin-bottom: 10px;
}
.word-modal-body { clear: both; }
.wm-header {
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.wm-word { font-size: 1.6rem; font-weight: 700; }
.wm-ipa { color: var(--muted); font-style: italic; }
.wm-row {
  padding: 6px 0;
  display: flex; gap: 8px; align-items: center;
  flex-wrap: wrap;
}
.wm-en-row { word-break: keep-all; }
.wm-label {
  font-size: 0.8rem; font-weight: 600; color: var(--muted);
  background: var(--bg);
  padding: 2px 8px; border-radius: 4px;
  flex-shrink: 0;
}
.wm-val { flex: 1; }
.wm-section {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.wm-title {
  font-weight: 600; font-size: 0.95rem;
  margin-bottom: 8px; color: var(--primary);
}
.wm-morpheme { padding: 4px 0; word-break: keep-all; }
.wm-mtype {
  display: inline-block; min-width: 60px;
  font-size: 0.8rem; color: var(--muted);
}
.wm-mtext { font-weight: 600; margin-right: 8px; }
.wm-mkr { color: var(--text); }
.wm-vform {
  display: flex; align-items: center; gap: 6px;
  padding: 4px 0;
}
.wm-vlabel {
  display: inline-block; min-width: 70px;
  font-size: 0.85rem; color: var(--muted);
}
.wm-vval { font-weight: 500; }
.wm-related {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.wm-related:last-child { border-bottom: none; }
.wm-related-head {
  display: flex; align-items: center; gap: 4px;
  margin-bottom: 4px;
}
.wm-related-word {
  font-weight: 600; color: var(--primary);
  font-size: 1.05rem;
}
.wm-related-mean, .wm-related-ex {
  margin: 4px 0 4px 8px;
  font-size: 0.92rem;
  word-break: keep-all;
  color: var(--text);
}
.wm-related-ex { color: var(--muted); font-style: italic; }
.wm-example {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}
.wm-example:last-child { border-bottom: none; }
.wm-ex-head {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 4px;
}
.wm-ex-label {
  font-size: 0.75rem; font-weight: 600; color: var(--muted);
  background: var(--bg);
  padding: 1px 6px; border-radius: 3px;
}
.wm-ex-en, .wm-ex-kr {
  margin: 4px 0; word-break: keep-all;
}
.wm-ex-kr { color: var(--muted); }
.word-err { color: var(--danger); padding: 12px; }

/* Toast */
.toast {
  position: fixed; bottom: 80px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.85); color: white;
  padding: 10px 18px;
  border-radius: 20px;
  z-index: 1000;
  display: none;
  font-size: 0.9rem;
  max-width: 90%;
}
.toast.show { display: block; }

/* Status */
.status-text {
  font-size: 0.85rem; color: var(--muted);
  padding: 4px 0;
}

/* Scroll Top Button */
.scroll-top-btn {
  position: fixed;
  bottom: 24px; right: 24px;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(37, 99, 235, 0.7);
  color: white;
  border: none;
  display: flex; align-items: center; justify-content: center;
  z-index: 90;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  backdrop-filter: blur(4px);
}
.scroll-top-btn:hover { background: rgba(37, 99, 235, 0.95); }

/* Hidden YouTube Player */
#ytPlayerContainer {
  position: fixed;
  bottom: -200px; left: -200px;
  width: 1px; height: 1px;
  opacity: 0; pointer-events: none;
}

/* Responsive */
@media (max-width: 600px) {
  .app-container { padding: 12px; }
  .card { padding: 12px; }
  .wm-word { font-size: 1.4rem; }
}
</style>
</head>
<body>

<header class="app-header">
  <h1 class="app-title">Thinking Skills</h1>
  <button id="hamburgerBtn" class="hamburger-btn">설정</button>
</header>

<main class="app-container">
  <!-- 영문 입력 카드 -->
  <div id="inputCard" class="card input-card">
    <input id="urlInput" type="text" class="url-input" placeholder="YouTube URL 또는 텍스트 입력">
    <div class="input-row">
      <button id="analyzeBtn" class="btn-primary">분석 시작</button>
      <label class="file-label">
        파일 선택
        <input id="fileInput" type="file" accept=".txt,.pdf,.docx,.doc,image/*">
      </label>
    </div>
    <div id="statusText" class="status-text"></div>
  </div>
  
  <!-- 한국어 입력 카드 -->
  <div id="koreanInputCard" class="card kr-input-card">
    <h3 style="margin-top:0">한국어 → 영어</h3>
    <div class="kr-row">
      <label class="file-label">
        음성 파일 업로드
        <input id="koreanAudioInput" type="file" accept="audio/*">
      </label>
    </div>
    <div class="kr-row">
      <button id="recStartBtn" class="btn-primary">녹음 시작</button>
      <button id="recStopBtn" class="btn-secondary" style="display:none; background:var(--danger); color:white; border-color:var(--danger);">녹음 정지</button>
      <span id="recTimer" class="rec-timer">00:00 / 05:00</span>
    </div>
    <div class="rec-bar-wrap"><div id="recBar" class="rec-bar"></div></div>
    <div id="koreanResultBox" style="display:none"></div>
  </div>
  
  <!-- 진행상황 -->
  <div id="progressCard" class="card progress-card">
    <div class="progress-bar-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <div id="progressText" class="progress-text"></div>
    <button id="cancelBtn" class="btn-secondary" style="margin-top:8px;">취소</button>
  </div>
  
  <!-- 문장 목록 -->
  <div id="sentenceList"></div>
</main>

<!-- 사이드 패널 -->
<aside id="sidePanel" class="side-panel">
  <button id="sidePanelClose" class="side-close" aria-label="닫기">X</button>
  <h3>표시</h3>
  <div class="setting-row">
    <label>글자 크기</label>
    <div class="font-controls">
      <button id="fontMinus">−</button>
      <span id="fontSizeLabel">16px</span>
      <button id="fontPlus">+</button>
    </div>
  </div>
  
  <h3>음성</h3>
  <div class="setting-row">
    <label for="voiceModeSelect">재생 모드</label>
    <select id="voiceModeSelect">
      <option value="tts">TTS</option>
      <option value="original">원음</option>
    </select>
  </div>
  <div class="setting-row">
    <label for="voiceGenderSelect">목소리</label>
    <select id="voiceGenderSelect">
      <option value="female">여성</option>
      <option value="male">남성</option>
    </select>
  </div>
  <div class="setting-row">
    <label for="speedSelect">속도</label>
    <select id="speedSelect">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
    </select>
  </div>
  
  <h3>모드</h3>
  <div class="setting-row">
    <label for="koreanModeToggle">한국어 → 영어</label>
    <input id="koreanModeToggle" type="checkbox">
  </div>
  
  <h3>저장된 문서</h3>
  <div id="docList"></div>
</aside>

<!-- 토스트 -->
<div id="toast" class="toast"></div>

<!-- YouTube IFrame Player -->
<div id="ytPlayerContainer"><div id="ytPlayer"></div></div>

<script>
/* ============================================================
   Part 1/3 : STATE / DB / Gemini Queue / TTS / YouTube
   ============================================================ */

const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

const STATE = {
  fontSize: 16,
  speed: 1,
  voiceMode: 'tts',      // 'tts' | 'original'
  voiceGender: 'female',
  voices: { female: null, male: null },
  db: null,
  geminiQueue: [],
  geminiBusy: false,
  geminiLast: 0,
  sentences: [],
  analyzing: false,
  chunkQueue: [],
  currentDocId: null,
  currentVideoId: null,
  ytSegments: [],
  ytPlayer: null,
  sourceType: null,
  wordCache: {},
  wordStack: [],
  koreanMode: false,
  koreanSource: '',
  englishLiteral: '',
  englishNatural: ''
};

/* ---------- 토스트 / 상태 ---------- */
function toast(msg, ms = 2500) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}
function setStatus(msg) {
  const el = $('#statusText');
  if (el) el.textContent = msg || '';
}

/* ---------- IndexedDB ---------- */
const DB_NAME = 'thinking_skills_db';
const DB_VERSION = 2;

function dbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('documents')) {
        db.createObjectStore('documents', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('words')) {
        db.createObjectStore('words', { keyPath: 'id' });
      }
    };
    req.onsuccess = () => { STATE.db = req.result; resolve(req.result); };
    req.onerror = () => reject(req.error);
  });
}

function dbPut(store, value) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(value);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbAll(store) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ---------- Gemini 큐 (10초 간격, 429 시 15초 대기) ---------- */
const GEMINI_MIN_INTERVAL = 10000;

function callGemini(body) {
  return new Promise((resolve, reject) => {
    STATE.geminiQueue.push({ body, resolve, reject });
    processGeminiQueue();
  });
}

async function processGeminiQueue() {
  if (STATE.geminiBusy) return;
  if (STATE.geminiQueue.length === 0) return;
  STATE.geminiBusy = true;
  
  while (STATE.geminiQueue.length > 0) {
    const wait = Math.max(0, GEMINI_MIN_INTERVAL - (Date.now() - STATE.geminiLast));
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    
    const job = STATE.geminiQueue.shift();
    STATE.geminiLast = Date.now();
    
    try {
      const res = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(job.body)
      });
      
      if (res.status === 429 || res.status === 503) {
        STATE.geminiQueue.unshift(job);
        await new Promise(r => setTimeout(r, 15000));
        continue;
      }
      
      if (!res.ok) {
        const errTxt = await res.text();
        job.reject(new Error(`서버 ${res.status}: ${errTxt.slice(0, 150)}`));
        continue;
      }
      
      const data = await res.json();
      job.resolve(data);
    } catch (err) {
      job.reject(err);
    }
  }
  
  STATE.geminiBusy = false;
}

/* ---------- TTS ---------- */
function loadVoices() {
  const voices = speechSynthesis.getVoices().filter(v =>
    v.lang.startsWith('en') || /english/i.test(v.name)
  );
  
  const female = voices.find(v => /female|samantha|victoria|karen|moira|tessa|google us english/i.test(v.name)) ||
                 voices.find(v => v.lang === 'en-US') ||
                 voices[0];
  const male = voices.find(v => /male|daniel|alex|fred|tom|aaron/i.test(v.name)) ||
               voices.find(v => v.lang === 'en-US' && v !== female) ||
               female;
  
  STATE.voices.female = female || null;
  STATE.voices.male = male || null;
}

  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;

function warmupTTS() {

    u.volume = 0;

function speak(text, opts = {}) {
  if (!('speechSynthesis' in window)) { toast('TTS를 지원하지 않는 브라우저입니다'); return; }
  if (!text) return;
  speechSynthesis.cancel();
  
  const utter = new SpeechSynthesisUtterance(text);
  const lang = opts.lang || 'en-US';
  utter.lang = lang;
  utter.rate = lang.startsWith('en') ? STATE.speed : 1;
  
  if (lang.startsWith('en')) {
    const v = STATE.voiceGender === 'male' ? STATE.voices.male : STATE.voices.female;
    if (v) utter.voice = v;
  }
  
  if (opts.onEnd) utter.onend = opts.onEnd;
  speechSynthesis.speak(utter);
}

function stopSpeaking() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

function applyPlaybackChange() {

/* ---------- YouTube IFrame Player ---------- */
let ytApiReady = false;
let ytApiQueue = [];

function loadYouTubeApi() {
  if (ytApiReady || window.YT?.Player) { ytApiReady = true; return; }
  if (window._ytApiLoading) return;
  window._ytApiLoading = true;
  
  window.onYouTubeIframeAPIReady = () => {
    ytApiReady = true;
    ytApiQueue.forEach(fn => fn());
    ytApiQueue = [];
  };
  
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}

function whenYtReady(fn) {
  if (ytApiReady && window.YT?.Player) fn();
  else { ytApiQueue.push(fn); loadYouTubeApi(); }
}

function initYouTubePlayer(videoId) {
  whenYtReady(() => {
    if (STATE.ytPlayer && typeof STATE.ytPlayer.cueVideoById === 'function') {
      try { STATE.ytPlayer.cueVideoById(videoId); return; } catch {}
    }
    STATE.ytPlayer = new YT.Player('ytPlayer', {
      videoId,
      playerVars: { controls: 0, disablekb: 1, fs: 0 },
      events: {
        onReady: () => updateOriginalModeAvailability()
      }
    });
  });
}

function nearestYtRate(rate) {
  const allowed = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
  let best = 1;
  let diff = Infinity;
  for (const r of allowed) {
    const d = Math.abs(r - rate);
    if (d < diff) { diff = d; best = r; }
  }
  return best;
}

function playOriginal(start, end, onEnd) {
  if (!STATE.ytPlayer) return;
  try {
    STATE.ytPlayer.setPlaybackRate(nearestYtRate(STATE.speed));
    STATE.ytPlayer.seekTo(start, true);
    STATE.ytPlayer.playVideo();
    const dur = (end - start) * 1000 / STATE.speed;
    setTimeout(() => {
      try { STATE.ytPlayer.pauseVideo(); } catch {}
      if (onEnd) onEnd();
    }, dur);
  } catch (err) {
    console.error('original play error', err);
    if (onEnd) onEnd();
  }
}

function updateOriginalModeAvailability() {
  const select = $('#voiceModeSelect');
  if (!select) return;
  const opt = select.querySelector('option[value="original"]');
  if (!opt) return;
  const available = !!(STATE.ytPlayer && STATE.ytSegments?.length > 0);
  opt.disabled = !available;
  if (!available && STATE.voiceMode === 'original') {
    STATE.voiceMode = 'tts';
    select.value = 'tts';
  }
}

async function handleAnalyze() {
  const input = $('#urlInput')?.value?.trim();
  if (!input) { toast('URL 또는 텍스트를 입력하세요'); return; }
  
  if (/youtube\.com|youtu\.be/.test(input)) {
    await handleYouTube(input);
  } else if (/^https?:\/\//.test(input)) {
    toast('YouTube URL 또는 텍스트를 입력하세요');

async function handleYouTube(url) {
  setStatus('YouTube 자막 가져오는 중...');
  showProgress(0, '자막 추출 중');
  try {
    const res = await fetch(`/api/youtube?url=${encodeURIComponent(url)}`);
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`서버 오류 ${res.status}: ${errText.slice(0, 200)}`);
    }
    const data = await res.json();
    if (!data.fullText) throw new Error('자막/전사 결과가 비어있습니다');
    
    STATE.currentVideoId = data.videoId;
    STATE.ytSegments = data.segments || [];
    STATE.sourceType = 'youtube';
    
    if (data.segments && data.segments.length > 0) {
      initYouTubePlayer(data.videoId);
    }
    
    const title = (data.title && titleFromText(data.title)) || titleFromText(data.fullText);
    await analyzeText(data.fullText, {
      sourceType: 'youtube',
      videoId: data.videoId,
      segments: data.segments || [],
      title
    });
  } catch (err) {
    hideProgress();
    setStatus('');
    toast('YouTube 처리 실패: ' + err.message);
  }
}

async function handleFile(file) {
  if (!file) return;
  const name = file.name.toLowerCase();
  setStatus(`${file.name} 처리 중...`);
  showProgress(0, '파일 분석 중');
  
  try {
    let text = '';
    if (name.endsWith('.txt')) {
      text = await file.text();
    } else if (name.endsWith('.pdf')) {
      text = await extractPdfText(file);
    } else if (name.endsWith('.docx') || name.endsWith('.doc')) {
      const buf = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: buf });
      text = result.value;
    } else if (file.type.startsWith('image/')) {
      const result = await Tesseract.recognize(file, 'eng+kor', {
        logger: m => {
          if (m.status === 'recognizing text') {
            updateProgress(m.progress * 100, 'OCR 인식 중');
          }
        }
      });
      text = result.data.text;
    } else {
      throw new Error('지원하지 않는 파일 형식');
    }
    
    if (!text.trim()) throw new Error('텍스트를 추출하지 못했습니다');
    STATE.sourceType = 'file';
    await analyzeText(text, { sourceType: 'file', title: titleFromText(text) });
  } catch (err) {
    hideProgress();
    setStatus('');
    toast('파일 처리 실패: ' + err.message);
  }
}

async function extractPdfText(file) {
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    updateProgress((i / pdf.numPages) * 50, `PDF ${i}/${pdf.numPages} 페이지`);
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

function titleFromText(text) {
  if (!text) return '제목 없음';
  const words = text.trim().replace(/\s+/g, ' ').split(' ').slice(0, 3);
  return words.join(' ') || '제목 없음';
}

function splitSentences(text) {
  const cleaned = text.replace(/\s+/g, ' ').trim();
  const raw = cleaned.match(/[^.!?]+[.!?]+|\S+$/g) || [];
  return raw.map(s => s.trim()).filter(s => s.length > 2);
}

async function analyzeText(text, meta = {}) {
  STATE.sentences = [];
  STATE.analyzing = true;
  STATE.chunkQueue = [];
  
  const container = $('#sentenceList');
  if (container) container.innerHTML = '';
  
  const sentences = splitSentences(text);
  if (sentences.length === 0) {
    hideProgress();
    toast('분석할 문장이 없습니다');
    return;
  }
  
  const docId = Date.now();
  STATE.currentDocId = docId;
  const docRecord = {
    id: docId,
    title: meta.title || titleFromText(text),
    sourceType: meta.sourceType || 'text',
    videoId: meta.videoId || null,
    segments: meta.segments || [],
    fullText: text,
    sentences: [],
    createdAt: new Date().toISOString()
  };
  await dbPut('documents', docRecord);
  
  const CHUNK = 10;
  const total = sentences.length;
  let done = 0;
  
  for (let i = 0; i < sentences.length; i += CHUNK) {
    if (!STATE.analyzing) break;
    const chunk = sentences.slice(i, i + CHUNK);
    updateProgress((done / total) * 100, `${done}/${total} 문장 분석 중`);
    
    try {
      const analyzed = await analyzeChunk(chunk);
      analyzed.forEach((s, idx) => {
        const sentenceObj = {
          id: `${docId}_${i + idx}`,
          index: i + idx,
          ...s
        };
        STATE.sentences.push(sentenceObj);
        renderSentenceBlock(sentenceObj);
      });
      done += chunk.length;
      
      docRecord.sentences = STATE.sentences;
      await dbPut('documents', docRecord);
    } catch (err) {
      console.error('chunk 분석 실패:', err);
      toast(`청크 분석 실패 (${i}~${i + CHUNK})`);
    }
  }
  
  STATE.analyzing = false;
  hideProgress();
  updateOriginalModeAvailability();
  setStatus(`분석 완료 (${STATE.sentences.length}문장)`);
  refreshDocList();
}

async function analyzeChunk(sentences) {
  const prompt = `다음 영어 문장들을 분석해서 JSON 배열로 반환하세요. 각 객체는 정확히 다음 형식이어야 합니다:
[
  {
    "text": "원문 그대로",
    "translationLiteral": "직역(한국어)",
    "translationNatural": "의역(한국어)",
    "words": ["clickable", "word", "tokens"]
  }
]
- words는 의미있는 단어만 (관사/전치사 제외)
- 문장 수: ${sentences.length}개
- 입력 순서를 반드시 유지

문장 목록:
${sentences.map((s, i) => `${i + 1}. ${s}`).join('\n')}`;
  
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: {
      temperature: 0.5,
      maxOutputTokens: 4096,
      responseMimeType: 'application/json'
    }
  };
  
  const result = await callGemini(body);
  const textOut = result.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
  let parsed;
  try { parsed = JSON.parse(textOut); } catch { parsed = []; }
  if (!Array.isArray(parsed)) parsed = [];
  
  while (parsed.length < sentences.length) {
    parsed.push({
      text: sentences[parsed.length],
      translationLiteral: '',
      translationNatural: '',
      words: sentences[parsed.length].split(/\s+/).filter(w => w.length > 1)
    });
  }
  return parsed.slice(0, sentences.length);
}

async function handleKoreanAudioUpload(file) {
  if (!file) return;
  setStatus('한국어 음성 분석 중...');
  showProgress(10, '음성 → 텍스트 변환 중');
  try {
    const base64 = await fileToBase64(file);
    const mimeType = file.type || 'audio/mp4';
    const koreanText = await transcribeKoreanAudio(base64, mimeType);
    if (!koreanText) throw new Error('음성에서 텍스트를 추출하지 못했습니다');
    updateProgress(40, '영어로 번역 중');
    await translateAndAnalyzeKorean(koreanText);
  } catch (err) {
    hideProgress();
    setStatus('');
    toast('음성 처리 실패: ' + err.message);
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const result = reader.result;
      const base64 = result.split(',')[1];
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function transcribeKoreanAudio(base64Data, mimeType) {
  const body = {
    contents: [{
      role: 'user',
      parts: [
        { text: '이 오디오를 한국어로 정확히 받아쓰기 해주세요. 문장부호를 포함하고, 다른 설명 없이 받아쓴 텍스트만 출력하세요.' },
        { inline_data: { mime_type: mimeType, data: base64Data } }
      ]
    }],
    generationConfig: { temperature: 0.2, maxOutputTokens: 4096 }
  };
  const result = await callGemini(body);
  return result.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
}

한국어 원문:
${koreanText}`;
  
  const body = {

    }

/* ---------- 직접 녹음 ---------- */
let recState = { recorder: null, chunks: [], startTime: 0, timerId: null };
const REC_MAX_SEC = 300;

async function startRecording() {
  if (recState.recorder) { toast('이미 녹음 중입니다'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    recState.recorder = recorder;
    recState.chunks = [];
    recState.startTime = Date.now();
    
    recorder.ondataavailable = e => { if (e.data.size > 0) recState.chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recState.chunks, { type: mime || 'audio/webm' });
      clearInterval(recState.timerId);
      resetRecUI();
      recState.recorder = null;
      
      const file = new File([blob], 'recording.webm', { type: blob.type });
      await handleKoreanAudioUpload(file);
    };
    recorder.start();
    
    const startBtn = $('#recStartBtn');
    const stopBtn = $('#recStopBtn');
    const timer = $('#recTimer');
    const bar = $('#recBar');
    if (startBtn) startBtn.style.display = 'none';
    if (stopBtn) stopBtn.style.display = 'inline-block';
    
    recState.timerId = setInterval(() => {
      const elapsed = (Date.now() - recState.startTime) / 1000;
      if (timer) timer.textContent = `${formatTime(elapsed)} / ${formatTime(REC_MAX_SEC)}`;
      if (bar) bar.style.width = `${(elapsed / REC_MAX_SEC) * 100}%`;
      if (elapsed >= REC_MAX_SEC) stopRecording();
    }, 200);
  } catch (err) {
    toast('마이크 권한 필요: ' + err.message);
  }
}

function stopRecording() {
  if (recState.recorder && recState.recorder.state !== 'inactive') {
    recState.recorder.stop();
  }
}

function resetRecUI() {
  const startBtn = $('#recStartBtn');
  const stopBtn = $('#recStopBtn');
  const timer = $('#recTimer');
  const bar = $('#recBar');
  if (startBtn) startBtn.style.display = 'inline-block';
  if (stopBtn) stopBtn.style.display = 'none';
  if (timer) timer.textContent = '00:00 / 05:00';
  if (bar) bar.style.width = '0%';
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

function toggleSentencePlay(s, btn) {
  if (btn.dataset.state === 'play') {
    btn.textContent = '정지';
    btn.dataset.state = 'stop';
    playSentence(s, () => {
      btn.textContent = '재생';
      btn.dataset.state = 'play';
    });
  } else {
    stopSpeaking();
    if (STATE.ytPlayer && typeof STATE.ytPlayer.pauseVideo === 'function') {
      try { STATE.ytPlayer.pauseVideo(); } catch {}
    }
    btn.textContent = '재생';
    btn.dataset.state = 'play';
  }
}

function playSentence(s, onEnd) {
  if (STATE.voiceMode === 'original' && STATE.ytSegments?.length > 0 && STATE.ytPlayer) {
    const seg = findSegmentForSentence(s);
    if (seg) { playOriginal(seg.start, seg.end, onEnd); return; }
  }
  speak(s.text, { onEnd });
}

function findSegmentForSentence(s) {
  if (!STATE.ytSegments) return null;
  const target = s.text.toLowerCase().slice(0, 30);
  for (const seg of STATE.ytSegments) {
    if (seg.text.toLowerCase().includes(target.slice(0, 15))) return seg;
  }
  return null;
}

function toggleTranslation(s, card) {
  const slot = card.querySelector('.sentence-slot');
  if (!slot) return;
  const existing = slot.querySelector('.translation-box');
  if (existing) { existing.remove(); return; }
  
  const box = document.createElement('div');
  box.className = 'translation-box';
  
  if (s.translationLiteral) {
    const lit = document.createElement('div');
    lit.className = 'trans-row';
    lit.innerHTML = `<span class="trans-label">직역</span>`;
    lit.appendChild(renderClickableWords(s.translationLiteral));
    lit.appendChild(makePlayBtn(s.translationLiteral, 'ko-KR'));
    box.appendChild(lit);
  }
  if (s.translationNatural) {
    const nat = document.createElement('div');

async function explainHardListening(s, card) {

  slot.appendChild(box);
  
  try {
    const prompt = `다음 영어 문장이 한국인에게 잘 들리지 않는 이유를 한국어로 설명해주세요. 연음, 약화, 강세, 발화속도 측면에서 구체적으로 2~4개 항목으로 설명하세요. JSON 형식: {"reasons":[{"type":"연음","detail":"설명"}]}
문장: ${s.text}`;
    const body = {

    };

    const txt = result.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
    const data = JSON.parse(txt);

      item.className = 'hard-item';

function renderClickableWords(text) {
  const wrap = document.createElement('span');
  wrap.className = 'words-wrap';
  const tokens = (text || '').split(/(\s+)/);
  tokens.forEach(tok => {
    if (/^\s+$/.test(tok)) {
      wrap.appendChild(document.createTextNode(tok));
    } else {
      const clean = tok.replace(/[.,!?;:"'()\[\]]/g, '');
      if (/[a-zA-Z]/.test(clean) && clean.length > 0) {
        const span = document.createElement('span');
        span.className = 'word-token';
        span.textContent = tok;
        span.onclick = (e) => { e.stopPropagation(); openWordModal(clean); };
        wrap.appendChild(span);
      } else {
        wrap.appendChild(document.createTextNode(tok));
      }
    }
  });
  return wrap;
}

function makePlayBtn(text, lang = 'en-US') {
  const btn = document.createElement('button');
  btn.className = 'btn-mini';
  btn.textContent = '듣기';
  btn.onclick = (e) => {
    e.stopPropagation();
    speak(text, { lang });
  };
  return btn;
}

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

const POS_KR = {
  'noun': '명사', 'verb': '동사', 'adjective': '형용사', 'adverb': '부사',
  'pronoun': '대명사', 'preposition': '전치사', 'conjunction': '접속사',
  'interjection': '감탄사', 'determiner': '한정사', 'article': '관사',
  'auxiliary verb': '조동사', 'modal verb': '조동사', 'phrasal verb': '구동사',
  'idiom': '관용구'
};
function posLabel(en) {
  if (!en) return '';
  const lower = en.toLowerCase().trim();
  const kr = POS_KR[lower] || POS_KR[lower.split(/[\s,/]/)[0]] || '';
  return kr ? `${en} (${kr})` : en;
}

const MODAL_MAX = 10;
function ensureModalRoot() {
  let root = $('#wordModal');
  if (!root) {
    root = document.createElement('div');
    root.id = 'wordModal';
    root.className = 'word-modal-root';
    root.style.display = 'none';
    root.innerHTML = `
      <div class="word-modal-backdrop"></div>
      <div class="word-modal-panel">
        <button class="word-modal-close" type="button" aria-label="닫기">X</button>
        <button class="word-modal-back" type="button" style="display:none">← 이전</button>
        <div class="word-modal-body"></div>
      </div>`;
    document.body.appendChild(root);
    root.querySelector('.word-modal-backdrop').onclick = closeWordModal;
    root.querySelector('.word-modal-close').onclick = closeWordModal;
    root.querySelector('.word-modal-back').onclick = popWordModal;
  }
  return root;
}

async function openWordModal(word) {
  if (!word) return;
  const root = ensureModalRoot();
  root.style.display = 'block';
  
  if (STATE.wordStack.length >= MODAL_MAX) STATE.wordStack.shift();
  STATE.wordStack.push(word.toLowerCase());
  
  const backBtn = root.querySelector('.word-modal-back');
  backBtn.style.display = STATE.wordStack.length > 1 ? 'inline-block' : 'none';
  
  await renderWordModalContent(word.toLowerCase());
}

function popWordModal() {
  if (STATE.wordStack.length <= 1) { closeWordModal(); return; }
  STATE.wordStack.pop();
  const prev = STATE.wordStack[STATE.wordStack.length - 1];
  const root = ensureModalRoot();
  const backBtn = root.querySelector('.word-modal-back');
  backBtn.style.display = STATE.wordStack.length > 1 ? 'inline-block' : 'none';
  renderWordModalContent(prev);
}

function closeWordModal() {
  const root = $('#wordModal');
  if (root) root.style.display = 'none';
  STATE.wordStack = [];
  stopSpeaking();
}

async function renderWordModalContent(word) {
  const root = ensureModalRoot();
  const body = root.querySelector('.word-modal-body');
  body.innerHTML = '<div class="loading-mini">불러오는 중...</div>';
  
  try {
    const data = await getWordInfo(word);
    renderWordData(body, data);
  } catch (err) {
    body.innerHTML = `<div class="word-err">조회 실패: ${escapeHtml(err.message)}</div>`;
  }
}

async function getWordInfo(word) {
  const key = word.toLowerCase();
  if (STATE.wordCache[key]) return STATE.wordCache[key];
  
  try {
    const cached = await dbGet('words', key);
    if (cached?.data) {
      STATE.wordCache[key] = cached.data;
      return cached.data;
    }
  } catch {}
  
  const prompt = `다음 영어 단어를 분석해서 JSON으로 반환하세요. 정확히 이 구조여야 합니다:
{
  "word": "원형",
  "lemma": "기본형",
  "pronunciationUS": "/IPA/",
  "partOfSpeech": "noun",
  "meaningKR": "한국어 의미",
  "meaningEN": "English definition sentence",
  "morphemes": [
    {"type":"prefix","text":"un-","meaningKR":"부정"},
    {"type":"root","text":"believ","meaningKR":"믿다"},
    {"type":"suffix","text":"-able","meaningKR":"~할 수 있는"}
  ],
  "verbForms": {"base":"","past":"","pastParticiple":"","presentParticiple":"","thirdPerson":""},
  "synonyms": [{"word":"","meaningEN":"","example":""}],
  "antonyms": [{"word":"","meaningEN":"","example":""}],
  "examples": [
    {"simple":"easy sentence","simpleKR":"한국어 번역","complex":"advanced sentence","complexKR":"한국어 번역"}
  ]
}
- 동사가 아니면 verbForms 모든 필드를 빈 문자열로
- 형태소가 단순하면 root 하나만
- synonyms/antonyms는 각 3개씩
- examples는 1개

단어: ${word}`;
  
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: {
      temperature: 0.4,
      maxOutputTokens: 1800,
      responseMimeType: 'application/json'
    }
  };
  
  const res = await fetch('/api/gemini', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`서버 ${res.status}`);
  const result = await res.json();
  const txt = result.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  const data = JSON.parse(txt);
  
  STATE.wordCache[key] = data;
  try { await dbPut('words', { id: key, data, savedAt: Date.now() }); } catch {}
  return data;
}

    const ipa = document.createElement('span');
    ipa.className = 'wm-ipa';
    ipa.textContent = d.pronunciationUS;
    header.appendChild(ipa);
  }
  body.appendChild(header);
  
  if (d.lemma && d.lemma.toLowerCase() !== (d.word || '').toLowerCase()) {
    const lemmaRow = document.createElement('div');
    lemmaRow.className = 'wm-row';
    lemmaRow.innerHTML = `<span class="wm-label">기본형</span> <span class="wm-val">${escapeHtml(d.lemma)}</span>`;
    lemmaRow.appendChild(makePlayBtn(d.lemma, 'en-US'));
    body.appendChild(lemmaRow);
  }
  
  if (d.partOfSpeech) {

    body.appendChild(posRow);
  }
  
  if (d.meaningKR) {
    const krRow = document.createElement('div');
    krRow.className = 'wm-row';
    krRow.innerHTML = `<span class="wm-label">의미</span> <span class="wm-val">${escapeHtml(d.meaningKR)}</span>`;
    body.appendChild(krRow);
  }
  
  if (d.meaningEN) {
    const enRow = document.createElement('div');
    enRow.className = 'wm-row wm-en-row';
    enRow.innerHTML = `<span class="wm-label">English</span>`;
    const txtWrap = document.createElement('span');
    txtWrap.className = 'wm-val';
    txtWrap.appendChild(renderClickableWords(d.meaningEN));
    enRow.appendChild(txtWrap);
    enRow.appendChild(makePlayBtn(d.meaningEN, 'en-US'));
    body.appendChild(enRow);
  }
  
  if (Array.isArray(d.morphemes) && d.morphemes.length) {
    const sec = document.createElement('div');

      const row = document.createElement('div');
      row.className = 'wm-morpheme';
      row.innerHTML = `<span class="wm-mtype">${escapeHtml(m.type || '')}</span> <span class="wm-mtext">${escapeHtml(m.text || '')}</span> <span class="wm-mkr">${escapeHtml(m.meaningKR || '')}</span>`;
      sec.appendChild(row);
    });
    body.appendChild(sec);
  }
  
  if (d.verbForms && Object.values(d.verbForms).some(v => v)) {
    const sec = document.createElement('div');
    sec.className = 'wm-section';
    sec.innerHTML = '<div class="wm-title">동사 변화</div>';
    const labels = {
      base: '원형', past: '과거', pastParticiple: '과거분사',
      presentParticiple: '현재분사', thirdPerson: '3인칭단수'
    };
    Object.entries(labels).forEach(([k, label]) => {
      const v = d.verbForms[k];
      if (!v) return;
      const row = document.createElement('div');
      row.className = 'wm-vform';
      row.innerHTML = `<span class="wm-vlabel">${label}</span> <span class="wm-vval">${escapeHtml(v)}</span>`;
      row.appendChild(makePlayBtn(v, 'en-US'));
      sec.appendChild(row);
    });
    body.appendChild(sec);
  }
  
  if (Array.isArray(d.synonyms) && d.synonyms.length) {
    body.appendChild(renderRelatedSection('유의어', d.synonyms));
  }
  if (Array.isArray(d.antonyms) && d.antonyms.length) {
    body.appendChild(renderRelatedSection('반의어', d.antonyms));
  }
  
  if (Array.isArray(d.examples) && d.examples.length) {
    const sec = document.createElement('div');
    sec.className = 'wm-section';
    sec.innerHTML = '<div class="wm-title">예문</div>';
    d.examples.forEach(ex => {
      if (ex.simple) sec.appendChild(renderExampleBlock('일반', ex.simple, ex.simpleKR));
      if (ex.complex) sec.appendChild(renderExampleBlock('심화', ex.complex, ex.complexKR));
    });
    body.appendChild(sec);
  }
}

function renderRelatedSection(title, items) {
  const sec = document.createElement('div');
  sec.className = 'wm-section';
  sec.innerHTML = `<div class="wm-title">${title}</div>`;
  items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'wm-related';
    
    const head = document.createElement('div');
    head.className = 'wm-related-head';
    const wSpan = document.createElement('span');
    wSpan.className = 'word-token wm-related-word';
    wSpan.textContent = it.word || '';
    wSpan.onclick = () => openWordModal(it.word);
    head.appendChild(wSpan);
    head.appendChild(makePlayBtn(it.word || '', 'en-US'));
    row.appendChild(head);
    
    if (it.meaningEN) {
      const meanLine = document.createElement('div');
      meanLine.className = 'wm-related-mean';
      meanLine.appendChild(renderClickableWords(it.meaningEN));
      meanLine.appendChild(makePlayBtn(it.meaningEN, 'en-US'));
      row.appendChild(meanLine);
    }
    if (it.example) {
      const exLine = document.createElement('div');
      exLine.className = 'wm-related-ex';

      exLine.appendChild(makePlayBtn(it.example, 'en-US'));
      row.appendChild(exLine);

    sec.appendChild(row);
  });

  const block = document.createElement('div');

  transBtn.className = 'btn-mini';

async function quickTranslate(en) {
  const body = {
    contents: [{ role: 'user', parts: [{ text: `다음 영어 문장을 자연스러운 한국어로 번역만 출력하세요 (다른 설명 없이):\n${en}` }] }],
    generationConfig: { temperature: 0.3, maxOutputTokens: 512 }
  };
  const res = await fetch('/api/gemini', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`${res.status}`);
  const r = await res.json();
  return r.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
}

/* ---------- 따라읽기 ---------- */
function startFollowRead(s, card) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('이 브라우저는 음성 인식을 지원하지 않습니다'); return; }
  
  const slot = card.querySelector('.sentence-slot');
  let resultBox = slot.querySelector('.follow-box');
  if (resultBox) resultBox.remove();
  resultBox = document.createElement('div');
  resultBox.className = 'follow-box';
  resultBox.innerHTML = '<div class="loading-mini">듣는 중... 문장을 읽으세요</div>';
  slot.appendChild(resultBox);
  
  const rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  
  rec.onresult = (e) => {
    const spoken = e.results[0][0].transcript;
    showFollowReadResult(resultBox, s.text, spoken);
  };
  rec.onerror = (e) => {
    resultBox.innerHTML = `<div class="follow-err">인식 오류: ${e.error}</div>`;
  };
  
  try { rec.start(); }
  catch (err) { resultBox.innerHTML = `<div class="follow-err">${err.message}</div>`; }
}

function showFollowReadResult(box, original, spoken) {
  const origTokens = original.toLowerCase().replace(/[.,!?;:"'()]/g, '').split(/\s+/).filter(Boolean);
  const spokenTokens = spoken.toLowerCase().replace(/[.,!?;:"'()]/g, '').split(/\s+/).filter(Boolean);
  const spokenSet = new Set(spokenTokens);
  let correct = 0;
  
  const html = origTokens.map(t => {
    const ok = spokenSet.has(t);
    if (ok) correct++;
    return `<span class="${ok ? 'fr-ok' : 'fr-no'}">${escapeHtml(t)}</span>`;
  }).join(' ');
  
  const pct = origTokens.length > 0 ? Math.round((correct / origTokens.length) * 100) : 0;
  box.innerHTML = `
    <div class="fr-score">정확도 ${pct}%</div>
    <div class="fr-spoken">인식: ${escapeHtml(spoken)}</div>
    <div class="fr-compare">${html}</div>`;
}

async function refreshDocList() {
  const list = $('#docList');
  if (!list) return;
  list.innerHTML = '';
  try {
    const docs = await dbAll('documents');
    docs.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    docs.forEach(doc => {
      const item = document.createElement('div');
      item.className = 'doc-item';
      const isPartial = !doc.sentences || doc.sentences.length === 0;
      item.innerHTML = `
        <div class="doc-title">${escapeHtml(doc.title || '제목 없음')}${isPartial ? ' <span class="doc-badge">부분</span>' : ''}</div>
        <div class="doc-meta">${escapeHtml(doc.sourceType || '')} · ${(doc.sentences || []).length}문장</div>`;
      item.onclick = () => openDocument(doc.id);
      const del = document.createElement('button');
      del.className = 'btn-mini doc-del';
      del.textContent = '삭제';
      del.onclick = (e) => { e.stopPropagation(); deleteDocument(doc.id); };
      item.appendChild(del);
      list.appendChild(item);
    });
  } catch (err) {
    console.error('doc list', err);
  }
}

async function openDocument(docId) {
  const doc = await dbGet('documents', docId);
  if (!doc) return;
  
  STATE.analyzing = false;
  STATE.chunkQueue = [];
  stopSpeaking();
  
  const progressCard = $('#progressCard'); if (progressCard) progressCard.style.display = 'none';
  const progressBar = $('#progressBar'); if (progressBar) progressBar.style.width = '0%';
  const progressText = $('#progressText'); if (progressText) progressText.textContent = '';
  const container = $('#sentenceList'); if (container) container.innerHTML = '';
  
  STATE.sentences = doc.sentences || [];
  STATE.currentDocId = doc.id;
  STATE.currentVideoId = doc.videoId || null;
  STATE.ytSegments = doc.segments || [];
  STATE.sourceType = doc.sourceType || 'text';
  
  if (doc.videoId && doc.segments?.length) {
    initYouTubePlayer(doc.videoId);
  }
  
  STATE.sentences.forEach(s => renderSentenceBlock(s));
  
  const side = $('#sidePanel'); if (side) side.classList.remove('open');
  updateOriginalModeAvailability();
  setStatus(`문서 열기 완료 (${STATE.sentences.length}문장)`);
}

async function deleteDocument(docId) {
  if (!confirm('문서를 삭제하시겠습니까?')) return;
  await dbDelete('documents', docId);
  if (STATE.currentDocId === docId) {
    const container = $('#sentenceList'); if (container) container.innerHTML = '';
    STATE.sentences = [];
    STATE.currentDocId = null;
  }
  refreshDocList();
}

  if (gender) gender.onchange = e => { STATE.voiceGender = e.target.value; };
  
  const speed = $('#speedSelect');
  if (speed) speed.onchange = e => {
    STATE.speed = parseFloat(e.target.value);
    applyPlaybackChange();
  };
  
  const krToggle = $('#koreanModeToggle');
  if (krToggle) krToggle.onchange = e => toggleKoreanMode(e.target.checked);
  
  const krFile = $('#koreanAudioInput');
  if (krFile) krFile.onchange = e => handleKoreanAudioUpload(e.target.files[0]);
  
  const recStart = $('#recStartBtn');
  const recStop = $('#recStopBtn');
  if (recStart) recStart.onclick = startRecording;
  if (recStop) recStop.onclick = stopRecording;
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const modal = $('#wordModal');
      if (modal && modal.style.display !== 'none') closeWordModal();
      else $('#sidePanel')?.classList.remove('open');
    }
  });
}

/* ---------- 초기화 ---------- */
async function init() {
  try {
    const saved = parseInt(localStorage.getItem('fontSize') || '16', 10);
    setFontSize(saved);
  } catch { setFontSize(16); }
  
  bindUI();
  setupScrollTop();
  ensureModalRoot();
  
  try { await dbOpen(); } catch (err) { console.error('DB open:', err); }
  
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    setStatus(`준비됨 (키 ${data.keyCount}개, ${data.model})`);
  } catch {
    setStatus('서버 연결 실패');
  }
  
  try { warmupTTS(); } catch {}
  
  refreshDocList();
  updateOriginalModeAvailability();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
