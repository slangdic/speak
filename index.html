<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Thinking Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{
  --sage:#A8C9A1; --sage-dark:#86B07D; --beige:#EDE7DE; --beige-dark:#D9D0BF;
  --bg:#FFFFFF; --text:#222; --sub:#777; --border:#E5E0D5; --danger:#D97A7A;
  --base:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:'Noto Sans KR',sans-serif;font-size:var(--base);color:var(--text);background:var(--bg);line-height:1.5}
button{font-family:inherit;cursor:pointer;border:none;background:none;font-size:inherit;color:inherit}
input,textarea{font-family:inherit;font-size:inherit}
.app{max-width:900px;margin:0 auto;padding:16px;padding-bottom:60px}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 0 16px;border-bottom:1px solid var(--border);margin-bottom:16px}
.title{font-size:1.25em;font-weight:700;color:var(--text)}
.status{font-size:0.8em;color:var(--sage-dark);margin-top:2px}
.hamburger{width:36px;height:36px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;background:var(--beige);border-radius:8px}
.hamburger span{display:block;width:18px;height:2px;background:var(--text);border-radius:2px}
.card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:16px}
.input-card .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.input-card input[type="text"]{flex:1;min-width:0;padding:12px;border:1px solid var(--border);border-radius:12px;font-size:1em;background:#fff}
.btn{padding:10px 16px;background:var(--sage);color:#fff;border-radius:12px;font-weight:500;transition:background 0.15s}
.btn:hover{background:var(--sage-dark)}
.btn:active{transform:scale(0.97)}
.btn-secondary{background:var(--beige);color:var(--text)}
.btn-secondary:hover{background:var(--beige-dark)}
.btn-danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.file-buttons{display:flex;gap:8px;flex-wrap:wrap}
.progress-card{display:none}
.progress-card.active{display:block}
.progress-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.progress-text{font-size:0.95em;color:var(--text)}
.progress-controls{display:flex;gap:8px}
.progress-controls button{font-size:0.85em;padding:4px 10px;background:var(--beige);color:var(--text);border-radius:8px}
.progress-bar-wrap{display:flex;align-items:center;gap:8px}
.progress-bar{flex:1;height:8px;background:var(--beige);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--sage);width:0%;transition:width 0.3s}
.progress-percent{font-size:0.85em;color:var(--sub);min-width:36px;text-align:right}
.sentence-block{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px}
.sentence-text{font-size:1.05em;line-height:1.7;margin-bottom:10px;word-break:break-word}
.word-token{cursor:pointer;border-bottom:1px dotted transparent;transition:background 0.1s}
.word-token:hover{background:var(--beige);border-bottom-color:var(--sage-dark)}
.sentence-controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sentence-controls button{padding:6px 10px;background:var(--beige);border-radius:8px;font-size:0.85em}
.sentence-controls button.active{background:var(--sage);color:#fff}
.paraphrases{margin-top:10px;padding:10px;background:var(--beige);border-radius:12px;display:none}
.paraphrases.open{display:block}
.paraphrase-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--border)}
.paraphrase-item:last-child{border-bottom:none}
.paraphrase-item .text{flex:1;font-size:0.95em}
.paraphrase-item button{padding:4px 8px;background:#fff;border-radius:6px;font-size:0.8em}
.followread-result{margin-top:10px;padding:10px;background:#FAF6EF;border-radius:12px;font-size:0.9em;display:none}
.followread-result.show{display:block}
.followread-result .label{color:var(--sub);font-size:0.8em;margin-bottom:4px}
.followread-result .correct{color:var(--sage-dark);font-weight:500}
.followread-result .wrong{color:var(--danger);text-decoration:underline;text-decoration-style:wavy}
.side-panel{position:fixed;top:0;right:-340px;width:320px;height:100vh;background:#fff;border-left:1px solid var(--border);padding:20px;overflow-y:auto;transition:right 0.25s ease;z-index:100;box-shadow:-4px 0 12px rgba(0,0,0,0.04)}
.side-panel.open{right:0}
.side-panel h3{font-size:1em;font-weight:700;margin-bottom:8px;margin-top:16px}
.side-panel h3:first-child{margin-top:0}
.side-panel .close-x{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;background:var(--beige);display:flex;align-items:center;justify-content:center;font-size:1.2em}
.font-size-control{display:flex;align-items:center;gap:8px;background:var(--beige);border-radius:12px;padding:4px}
.font-size-control button{width:36px;height:32px;background:#fff;border-radius:8px;font-size:1em;font-weight:500}
.font-size-control .value{flex:1;text-align:center;font-size:0.95em}
.pill-group{display:flex;flex-wrap:wrap;gap:6px}
.pill{padding:6px 12px;background:var(--beige);border-radius:999px;font-size:0.85em;color:var(--text)}
.pill.active{background:var(--sage);color:#fff}
.pill:disabled{opacity:0.4;cursor:not-allowed}
.pill[data-disabled="1"]{opacity:0.4;cursor:not-allowed;pointer-events:auto}
.doc-list{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.doc-item{padding:10px;background:var(--beige);border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
.doc-item:hover{background:var(--beige-dark)}
.doc-item .title{flex:1;font-size:0.9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-item .del{padding:4px 8px;background:#fff;border-radius:6px;font-size:0.75em;color:var(--danger)}
.doc-item .badge{font-size:0.7em;background:var(--sage);color:#fff;padding:2px 6px;border-radius:4px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.open{display:flex}
.modal-body{background:#fff;border-radius:16px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto;padding:20px;position:relative}
.modal-body h2{font-size:1.2em;margin-bottom:4px}
.modal-body .word-meta{color:var(--sub);font-size:0.9em;margin-bottom:12px}
.modal-body section{margin-bottom:14px}
.modal-body section h4{font-size:0.85em;color:var(--sub);font-weight:500;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.modal-body .row-item{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:0.95em}
.modal-body .row-item .mini-play{width:24px;height:24px;background:var(--beige);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:0.85em}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:8px;background:var(--beige);font-size:1.2em}
.modal-spinner{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--sub)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:999px;font-size:0.9em;z-index:300;opacity:0;transition:opacity 0.2s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;color:var(--sub);padding:40px 16px;font-size:0.95em}
#ytPlayerWrap{position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;overflow:hidden}
@media (max-width:480px){
  .app{padding:12px;padding-bottom:60px}
  .side-panel{width:88%;right:-88%}
}
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <div class="title">Thinking Skills</div>
      <div class="status" id="status">초기화 중...</div>
    </div>
    <button class="hamburger" id="hamburger" aria-label="menu">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="card input-card">
    <div class="row">
      <input type="text" id="urlInput" placeholder="YouTube URL 또는 텍스트 붙여넣기">
      <button class="btn" id="analyzeBtn">분석</button>
    </div>
    <div class="file-buttons">
      <button class="btn btn-secondary" id="fileBtn">파일</button>
      <button class="btn btn-secondary" id="cameraBtn">카메라</button>
      <input type="file" id="fileInput" accept=".pdf,.txt,.doc,.docx,.hwp,image/*" hidden>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    </div>
  </div>

  <div class="card progress-card" id="progressCard">
    <div class="progress-row">
      <div class="progress-text" id="progressText">대기 중</div>
      <div class="progress-controls">
        <button id="pauseBtn">일시정지</button>
        <button id="cancelBtn">취소</button>
      </div>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-percent" id="progressPercent">0%</div>
    </div>
  </div>

  <div id="sentenceList"></div>
  <div class="empty" id="emptyHint">URL이나 파일을 입력하면 문장 카드가 여기에 표시됩니다.</div>
</div>

<aside class="side-panel" id="sidePanel">
  <button class="close-x" id="closePanel" aria-label="close">×</button>
  <h3>글자 크기</h3>
  <div class="font-size-control">
    <button id="fontMinus">−</button>
    <div class="value" id="fontValue">16</div>
    <button id="fontPlus">+</button>
  </div>
  <h3>음성 재생 모드</h3>
  <div class="pill-group" id="voiceModeGroup">
    <button class="pill active" data-voice-mode="tts">TTS</button>
    <button class="pill" data-voice-mode="original" data-disabled="1">원음</button>
  </div>
  <h3>목소리 설정</h3>
  <div class="pill-group" id="genderGroup">
    <button class="pill active" data-gender="female">여성</button>
    <button class="pill" data-gender="male">남성</button>
  </div>
  <h3>속도</h3>
  <div class="pill-group" id="speedGroup">
    <button class="pill" data-speed="0.5">0.5</button>
    <button class="pill" data-speed="0.6">0.6</button>
    <button class="pill" data-speed="0.7">0.7</button>
    <button class="pill" data-speed="0.8">0.8</button>
    <button class="pill" data-speed="0.9">0.9</button>
    <button class="pill active" data-speed="1.0">1.0</button>
    <button class="pill" data-speed="1.1">1.1</button>
    <button class="pill" data-speed="1.2">1.2</button>
  </div>
  <h3>저장된 문서</h3>
  <div class="doc-list" id="docList"></div>
</aside>

<div class="modal" id="wordModal">
  <div class="modal-body" id="wordModalBody">
    <button class="modal-close" id="closeWordModal">×</button>
    <div class="modal-spinner">불러오는 중...</div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="ytPlayerWrap"><div id="ytPlayer"></div></div>

<script>
/* ============================================================
   전역 상태
   ============================================================ */
const STATE = {
  fontSize: 16,
  speed: 1.0,
  voiceMode: 'tts',
  voiceGender: 'female',
  voices: { female: null, male: null, loaded: false },
  ttsPreloadQueue: new Map(),
  sentences: [],
  currentDoc: null,
  currentVideoId: null,
  ytSegments: [],
  ytPlayer: null,
  ytReady: false,
  analyzing: false,
  paused: false,
  cancelled: false,
  chunkQueue: [],
  wordCache: new Map(),
  recognizer: null,
  activeRecognition: null,
};

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

function setStatus(msg) { const el = $('#status'); if (el) el.textContent = msg; }
function toast(msg, ms = 2200) {
  const t = $('#toast'); if (!t) return;
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

/* ============================================================
   IndexedDB
   ============================================================ */
const DB_NAME = 'thinking_skills_db';
const DB_VER = 1;
let dbPromise = null;
function openDB() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('documents')) {
        const s = db.createObjectStore('documents', { keyPath: 'id' });
        s.createIndex('createdAt', 'createdAt');
        s.createIndex('title', 'title');
      }
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
  return dbPromise;
}
async function dbPut(store, value) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(value);
    tx.oncomplete = () => res(value);
    tx.onerror = () => rej(tx.error);
  });
}
async function dbGet(store, key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function dbAll(store) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result || []);
    req.onerror = () => rej(req.error);
  });
}
async function dbDelete(store, key) {
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

/* ============================================================
   Gemini 호출 큐 (전역, 10초 간격)
   ============================================================ */
const GEMINI_QUEUE = { queue: [], busy: false, minIntervalMs: 10000, lastCallAt: 0 };
function callGemini(body, priority = false) {
  return new Promise((res, rej) => {
    const task = { body, res, rej };
    if (priority) GEMINI_QUEUE.queue.unshift(task);
    else GEMINI_QUEUE.queue.push(task);
    processGeminiQueue();
  });
}
async function processGeminiQueue() {
  if (GEMINI_QUEUE.busy) return;
  GEMINI_QUEUE.busy = true;
  while (GEMINI_QUEUE.queue.length) {
    if (STATE.paused) { await sleep(500); continue; }
    const { body, res, rej } = GEMINI_QUEUE.queue.shift();
    const since = Date.now() - GEMINI_QUEUE.lastCallAt;
    if (GEMINI_QUEUE.lastCallAt && since < GEMINI_QUEUE.minIntervalMs) {
      await sleep(GEMINI_QUEUE.minIntervalMs - since);
    }
    GEMINI_QUEUE.lastCallAt = Date.now();
    try {
      const r = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (r.status === 429 || r.status === 503) {
        GEMINI_QUEUE.queue.unshift({ body, res, rej });
        await sleep(15000);
        continue;
      }
      if (!r.ok) {
        const e = await r.json().catch(() => ({}));
        rej(new Error(e.error || 'Gemini error ' + r.status));
        continue;
      }
      const d = await r.json();
      res(d);
    } catch (e) { rej(e); }
  }
  GEMINI_QUEUE.busy = false;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/* ============================================================
   TTS 음성 로딩 (US 영어 로컬 우선)
   ============================================================ */
function loadVoices() {
  return new Promise(resolve => {
    const tryLoad = () => {
      const list = speechSynthesis.getVoices();
      if (list && list.length) {
        const usVoices = list.filter(v => /^en[-_]US$/i.test(v.lang));
        const usLocal = usVoices.filter(v => v.localService === true);
        const usNetwork = usVoices.filter(v => v.localService !== true);
        const enAny = list.filter(v => /^en/i.test(v.lang));
        const pool = usLocal.length ? usLocal : usNetwork.length ? usNetwork : enAny.length ? enAny : list;
        const femaleHints = /female|woman|samantha|allison|ava|susan|zira|google.*us.*female|en-us.*female/i;
        const maleHints = /male|man|alex|aaron|fred|tom|david|mark|google.*us.*male|en-us.*male/i;
        const femaleExclude = /karen|moira|tessa|daniel|fiona|kate|serena/i;
        STATE.voices.female = pool.find(v => femaleHints.test(v.name) && !femaleExclude.test(v.name))
          || pool.find(v => !femaleExclude.test(v.name)) || pool[0];
        STATE.voices.male = pool.find(v => maleHints.test(v.name))
          || pool.find(v => v !== STATE.voices.female) || pool[0];
        STATE.voices.loaded = true;
        resolve();
      } else setTimeout(tryLoad, 200);
    };
    tryLoad();
    if ('speechSynthesis' in window) {
      speechSynthesis.onvoiceschanged = tryLoad;
    }
  });
}

async function warmupTTS() {
  if (!('speechSynthesis' in window)) return;
  await loadVoices();
  const voices = [STATE.voices.female, STATE.voices.male].filter(Boolean);
  for (const v of voices) {
    const u = new SpeechSynthesisUtterance('hello');
    u.voice = v; u.lang = 'en-US'; u.volume = 0; u.rate = 2.0;
    speechSynthesis.speak(u);
    await new Promise(r => { u.onend = r; u.onerror = r; setTimeout(r, 2000); });
  }
}

function speak(text, opts = {}) {
  if (!('speechSynthesis' in window)) return Promise.resolve();
  speechSynthesis.cancel();
  let u;
  if (opts.sentenceId && STATE.ttsPreloadQueue.has(opts.sentenceId)) {
    u = STATE.ttsPreloadQueue.get(opts.sentenceId);
    STATE.ttsPreloadQueue.delete(opts.sentenceId);
    u.rate = opts.speed || STATE.speed;
  } else {
    u = new SpeechSynthesisUtterance(text);
    const voice = (opts.gender || STATE.voiceGender) === 'male' ? STATE.voices.male : STATE.voices.female;
    if (voice) u.voice = voice;
    u.rate = opts.speed || STATE.speed;
    u.pitch = (opts.gender || STATE.voiceGender) === 'male' ? 0.95 : 1.05;
    u.lang = 'en-US';
  }
  return new Promise(res => {
    u.onend = () => { if (opts.sentenceId) preloadNextSentences(opts.sentenceId, 2); res(); };
    u.onerror = res;
    speechSynthesis.speak(u);
  });
}

function preloadNextSentences(currentId, count = 2) {
  const idx = STATE.sentences.findIndex(s => s.id === currentId);
  if (idx < 0) return;
  for (let i = idx + 1; i <= idx + count && i < STATE.sentences.length; i++) {
    const s = STATE.sentences[i];
    if (STATE.ttsPreloadQueue.has(s.id)) continue;
    const u = new SpeechSynthesisUtterance(s.text);
    const voice = STATE.voiceGender === 'male' ? STATE.voices.male : STATE.voices.female;
    if (voice) u.voice = voice;
    u.lang = 'en-US'; u.rate = STATE.speed;
    u.pitch = STATE.voiceGender === 'male' ? 0.95 : 1.05;
    STATE.ttsPreloadQueue.set(s.id, u);
  }
  if (STATE.ttsPreloadQueue.size > 30) {
    const keys = [...STATE.ttsPreloadQueue.keys()];
    for (let k = 0; k < keys.length - 30; k++) STATE.ttsPreloadQueue.delete(keys[k]);
  }
}

function applyPlaybackChange() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  if (STATE.ytPlayer && STATE.ytPlayer.pauseVideo) {
    try { STATE.ytPlayer.pauseVideo(); } catch (e) {}
  }
  STATE.ttsPreloadQueue.clear();
}

/* ============================================================
   YouTube IFrame (원음 모드)
   ============================================================ */
function loadYouTubeAPI() {
  return new Promise(resolve => {
    if (window.YT && window.YT.Player) return resolve();
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
    window.onYouTubeIframeAPIReady = () => resolve();
  });
}

async function initYouTubePlayer(videoId) {
  await loadYouTubeAPI();
  return new Promise(resolve => {
    if (STATE.ytPlayer && STATE.ytPlayer.loadVideoById) {
      try { STATE.ytPlayer.loadVideoById(videoId); STATE.ytPlayer.pauseVideo(); } catch (e) {}
      resolve(STATE.ytPlayer);
      return;
    }
    STATE.ytPlayer = new YT.Player('ytPlayer', {
      height: '1', width: '1', videoId,
      playerVars: { autoplay: 0, controls: 0 },
      events: {
        onReady: (e) => { STATE.ytReady = true; try { e.target.pauseVideo(); } catch (_) {} resolve(STATE.ytPlayer); }
      }
    });
  });
}

function nearestYtRate(speed) {
  const allowed = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
  return allowed.reduce((a, b) => Math.abs(b - speed) < Math.abs(a - speed) ? b : a, 1);
}

async function playOriginal(segmentIndex) {
  const seg = STATE.ytSegments[segmentIndex];
  if (!seg || !STATE.ytPlayer) return;
  try {
    STATE.ytPlayer.setPlaybackRate(nearestYtRate(STATE.speed));
    STATE.ytPlayer.seekTo(seg.start, true);
    STATE.ytPlayer.playVideo();
    await sleep((seg.end - seg.start) * 1000 / nearestYtRate(STATE.speed));
    STATE.ytPlayer.pauseVideo();
  } catch (e) { console.error('original play error', e); }
}

function updateOriginalModeAvailability() {
  const btn = document.querySelector('[data-voice-mode="original"]');
  if (!btn) return;
  const available = STATE.ytSegments && STATE.ytSegments.length > 0 && STATE.currentVideoId;
  btn.dataset.disabled = available ? '0' : '1';
  if (!available && STATE.voiceMode === 'original') {
    STATE.voiceMode = 'tts';

    $$('[data-voice-mode]').forEach(b => b.classList.toggle('active', b.dataset.voiceMode === 'tts'));
  }
}
</script>
<script>
/* ============================================================
   입력 처리 — YouTube / 파일 / 카메라
   ============================================================ */
async function handleAnalyze() {
  const input = $('#urlInput').value.trim();
  if (!input) { toast('URL 또는 텍스트를 입력하세요'); return; }
  if (/youtube\.com|youtu\.be/i.test(input)) {
    await handleYouTube(input);
  } else {
    await analyzeText(input, { title: '직접 입력 텍스트', sourceType: 'text' });
  }
}

async function handleYouTube(url) {
  setStatus('YouTube 처리 중...');
  try {
    const r = await fetch('/api/youtube?url=' + encodeURIComponent(url));
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.error || 'YouTube 처리 실패 (' + r.status + ')');
    }
    const data = await r.json();
    STATE.currentVideoId = data.videoId;
    STATE.ytSegments = data.segments || [];
    if (data.source === 'captions' && STATE.ytSegments.length > 0) {
      await initYouTubePlayer(data.videoId);
    } else {
      STATE.ytSegments = [];
      STATE.ytPlayer = null;
    }
    updateOriginalModeAvailability();
    await analyzeText(data.fullText, {
      title: 'YouTube: ' + data.videoId,
      sourceType: 'youtube',
      videoId: data.videoId,
      segments: STATE.ytSegments
    });
  } catch (e) {
    setStatus('오류: ' + e.message);
    toast('YouTube 처리 실패: ' + e.message, 4000);
  }
}

async function handleFile(file) {
  if (!file) return;
  setStatus('파일 처리 중...');
  try {
    const name = file.name.toLowerCase();
    let text = '';
    if (name.endsWith('.txt')) {
      text = await file.text();
    } else if (name.endsWith('.pdf')) {
      text = await extractPdfText(file);
    } else if (name.endsWith('.docx') || name.endsWith('.doc')) {
      text = await extractDocxText(file);
    } else if (file.type.startsWith('image/')) {
      text = await extractImageText(file);
    } else {
      throw new Error('지원하지 않는 형식');
    }
    if (!text || text.trim().length < 10) throw new Error('텍스트 추출 실패');
    await analyzeText(text, { title: file.name, sourceType: 'file' });
  } catch (e) {
    setStatus('오류: ' + e.message);
    toast('파일 처리 실패: ' + e.message, 4000);
  }
}

async function extractPdfText(file) {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

async function extractDocxText(file) {
  const buf = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer: buf });
  return result.value;
}

async function extractImageText(file) {
  setStatus('이미지 OCR 처리 중...');
  const { data } = await Tesseract.recognize(file, 'eng+kor');
  return data.text;
}

/* ============================================================
   문장 분석 파이프라인
   ============================================================ */
function splitSentences(text) {
  const clean = text.replace(/\s+/g, ' ').trim();
  const parts = clean.match(/[^.!?]+[.!?]+/g) || [clean];
  return parts.map(s => s.trim()).filter(s => s.length > 2);
}

async function analyzeText(text, meta) {
  // 기존 분석 큐 중단
  STATE.cancelled = true;
  STATE.chunkQueue = [];
  await sleep(50);
  STATE.cancelled = false;
  STATE.paused = false;

  // UI 초기화
  $('#sentenceList').innerHTML = '';
  $('#emptyHint').style.display = 'none';
  STATE.sentences = [];
  STATE.wordCache.clear();

  const all = splitSentences(text);
  if (all.length === 0) { toast('분석할 문장이 없습니다'); return; }

  // 문서 레코드 생성
  const docId = 'd_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  STATE.currentDoc = {
    id: docId,
    title: meta.title || '문서',
    sourceType: meta.sourceType || 'text',
    videoId: meta.videoId || null,
    segments: meta.segments || [],
    originalText: text,
    sentences: [],
    createdAt: Date.now(),
    lastViewedAt: Date.now()
  };
  await dbPut('documents', STATE.currentDoc);

  // 진행률 시작
  showProgress(all.length);

  // 10문장씩 청크
  const CHUNK = 10;
  for (let i = 0; i < all.length; i += CHUNK) {
    STATE.chunkQueue.push(all.slice(i, i + CHUNK));
  }

  STATE.analyzing = true;
  let done = 0;
  while (STATE.chunkQueue.length && !STATE.cancelled) {
    while (STATE.paused && !STATE.cancelled) await sleep(300);
    if (STATE.cancelled) break;
    const chunk = STATE.chunkQueue.shift();
    try {
      const results = await analyzeChunk(chunk);
      for (const r of results) {
        const sObj = {
          id: 's_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
          text: r.text,
          paraphrases: r.paraphrases || [],
          words: r.words || []
        };
        STATE.sentences.push(sObj);
        renderSentenceBlock(sObj);
        done++;
        updateProgress(done, all.length);
      }
      // 분석된 문장 저장
      STATE.currentDoc.sentences = STATE.sentences;
      STATE.currentDoc.lastViewedAt = Date.now();
      await dbPut('documents', STATE.currentDoc);
    } catch (e) {
      console.error('chunk error', e);
      setStatus('청크 오류: ' + e.message);
      toast('분석 일부 실패: ' + e.message, 3500);
      // 실패한 청크는 건너뜀
      done += chunk.length;
      updateProgress(done, all.length);
    }
  }

  STATE.analyzing = false;
  hideProgress();
  refreshDocList();
  setStatus(STATE.cancelled ? '분석 취소됨' : `분석 완료 (${STATE.sentences.length}/${all.length})`);
}

async function analyzeChunk(sentenceArr) {
  const prompt =
`You are an English learning assistant. For each sentence below, return a JSON array of objects with this exact shape:
[
  {
    "text": "original sentence",
    "paraphrases": ["paraphrase 1", "paraphrase 2"],
    "words": ["important word 1", "important word 2", ...]
  }
]
Output only valid JSON, no markdown fences, no extra text.

Sentences:
${sentenceArr.map((s, i) => `${i + 1}. ${s}`).join('\n')}`;

  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.6, maxOutputTokens: 4096, responseMimeType: 'application/json' }
  };
  const data = await callGemini(body);
  const raw = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '[]';
  let arr;
  try { arr = JSON.parse(raw); }
  catch { arr = sentenceArr.map(s => ({ text: s, paraphrases: [], words: [] })); }
  while (arr.length < sentenceArr.length) arr.push({ text: sentenceArr[arr.length], paraphrases: [], words: [] });
  return arr.slice(0, sentenceArr.length);
}

/* ============================================================
   진행률 UI
   ============================================================ */
function showProgress(total) {
  const card = $('#progressCard');
  if (card) card.classList.add('active');
  updateProgress(0, total);
}
function updateProgress(done, total) {
  const pct = total ? Math.round((done / total) * 100) : 0;
  const txt = $('#progressText'); if (txt) txt.textContent = `문장 분석 중 ${done} / ${total}`;
  const fill = $('#progressFill'); if (fill) fill.style.width = pct + '%';
  const pctEl = $('#progressPercent'); if (pctEl) pctEl.textContent = pct + '%';
}
function hideProgress() {
  setTimeout(() => {
    const card = $('#progressCard');
    if (card) card.classList.remove('active');
  }, 1500);
}

/* ============================================================
   문장 카드 렌더링
   ============================================================ */
function renderSentenceBlock(s) {
  const list = $('#sentenceList');
  if (!list) return;
  const block = document.createElement('div');
  block.className = 'sentence-block';
  block.dataset.id = s.id;

  const textDiv = document.createElement('div');
  textDiv.className = 'sentence-text';
  // 토큰화 — 단어별 클릭 가능
  const tokens = s.text.split(/(\s+|[.,!?;:"()])/);
  tokens.forEach(tok => {
    if (/^[A-Za-z][A-Za-z'-]*$/.test(tok)) {
      const span = document.createElement('span');
      span.className = 'word-token';
      span.textContent = tok;
      span.onclick = () => openWordModal(tok, s.text);
      textDiv.appendChild(span);
    } else {
      textDiv.appendChild(document.createTextNode(tok));
    }
  });
  block.appendChild(textDiv);

  const ctrl = document.createElement('div');
  ctrl.className = 'sentence-controls';
  ctrl.innerHTML = `
    <button data-act="play">▶ 재생</button>
    <button data-act="repeat">반복</button>
    <button data-act="paraphrase">다른 표현</button>
    <button data-act="follow">🎤 따라읽기</button>
    <button data-act="delete">삭제</button>
  `;
  block.appendChild(ctrl);

  const para = document.createElement('div');
  para.className = 'paraphrases';
  (s.paraphrases || []).forEach(p => {
    const item = document.createElement('div');
    item.className = 'paraphrase-item';
    const t = document.createElement('div'); t.className = 'text'; t.textContent = p;
    const b = document.createElement('button'); b.textContent = '▶';
    b.onclick = () => speak(p, { gender: STATE.voiceGender, speed: STATE.speed });
    item.appendChild(t); item.appendChild(b);
    para.appendChild(item);
  });
  block.appendChild(para);

  const follow = document.createElement('div');
  follow.className = 'followread-result';
  block.appendChild(follow);

  // 컨트롤 이벤트
  ctrl.querySelector('[data-act="play"]').onclick = () => playSentence(s);
  ctrl.querySelector('[data-act="repeat"]').onclick = async (e) => {
    const btn = e.currentTarget;
    if (btn.classList.contains('active')) { btn.classList.remove('active'); return; }
    btn.classList.add('active');
    while (btn.classList.contains('active')) {
      await playSentence(s);
      if (!btn.classList.contains('active')) break;
      await sleep(400);
    }
  };
  ctrl.querySelector('[data-act="paraphrase"]').onclick = () => para.classList.toggle('open');
  ctrl.querySelector('[data-act="follow"]').onclick = () => startFollowRead(s, follow);
  ctrl.querySelector('[data-act="delete"]').onclick = () => {
    STATE.sentences = STATE.sentences.filter(x => x.id !== s.id);
    block.remove();
    if (STATE.currentDoc) {
      STATE.currentDoc.sentences = STATE.sentences;
      dbPut('documents', STATE.currentDoc);
    }
  };

  list.appendChild(block);
}

async function playSentence(s) {
  if (STATE.voiceMode === 'original' && STATE.ytSegments.length > 0) {
    // 원음 모드 — 텍스트로 segment 찾기
    const idx = findSegmentIndex(s.text);
    if (idx >= 0) { await playOriginal(idx); return; }
    toast('해당 문장의 원음 위치를 찾을 수 없어 TTS로 재생합니다');
  }
  await speak(s.text, { gender: STATE.voiceGender, speed: STATE.speed, sentenceId: s.id });
}

function findSegmentIndex(text) {
  const norm = (x) => x.toLowerCase().replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
  const target = norm(text);
  for (let i = 0; i < STATE.ytSegments.length; i++) {
    if (norm(STATE.ytSegments[i].text).includes(target.slice(0, 30))) return i;
  }
  return -1;
}

/* ============================================================
   단어 모달
   ============================================================ */
async function openWordModal(word, context) {
  const modal = $('#wordModal');
  const body = $('#wordModalBody');
  if (!modal || !body) return;
  modal.classList.add('open');
  body.innerHTML = '<button class="modal-close" id="closeWordModal">×</button><div class="modal-spinner">불러오는 중...</div>';
  const closeBtn = body.querySelector('#closeWordModal');
  if (closeBtn) closeBtn.onclick = () => modal.classList.remove('open');

  try {
    const info = await getWordInfo(word, context);
    renderWordModal(info, body);
  } catch (e) {
    body.innerHTML = `<button class="modal-close">×</button><div class="empty">단어 정보 가져오기 실패: ${e.message}</div>`;
    body.querySelector('.modal-close').onclick = () => modal.classList.remove('open');
  }
}

async function getWordInfo(word, context) {
  const key = word.toLowerCase();
  if (STATE.wordCache.has(key)) {
    const cached = STATE.wordCache.get(key);
    if (cached && typeof cached.then === 'function') return cached;
    return cached;
  }
  const p = (async () => {
    const prompt =
`Provide JSON for the English word "${word}" used in context: "${context || ''}".
Always include the dictionary base form (lemma) — for verbs use infinitive, for nouns singular.
Output exactly this JSON shape with no markdown fences:
{
  "word": "${word}",
  "lemma": "base/dictionary form",
  "pronunciationUS": "IPA",
  "partOfSpeech": "noun/verb/adj/...",
  "meaningKR": "Korean meaning",
  "meaningEN": "English meaning",
  "morphemes": { "prefix": "...", "root": "...", "suffix": "..." },
  "verbForms": { "base": "...", "past": "...", "pastParticiple": "...", "presentParticiple": "...", "thirdPerson": "..." },
  "synonyms": [{ "word": "...", "meaning": "...", "example": "..." }],
  "antonyms": [{ "word": "...", "meaning": "...", "example": "..." }],
  "examples": { "simple": "...", "complex": "..." }
}
If a field is not applicable, use empty string or empty array.`;
    const body = {
      contents: [{ role: 'user', parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.5, maxOutputTokens: 1500, responseMimeType: 'application/json' }
    };
    const data = await callGemini(body, true);
    const raw = data?.candidates?.[0]?.content?.parts?.map(p => p.text).join('') || '{}';
    let parsed;
    try { parsed = JSON.parse(raw); }
    catch { parsed = { word, lemma: word, meaningKR: '', meaningEN: '' }; }
    if (parsed.lemma) STATE.wordCache.set(parsed.lemma.toLowerCase(), parsed);
    return parsed;
  })();
  STATE.wordCache.set(key, p);
  const result = await p;
  STATE.wordCache.set(key, result);
  return result;
}

function renderWordModal(info, body) {
  const safe = (s) => (s || '').toString();
  const morph = info.morphemes || {};
  const vf = info.verbForms || {};
  const ex = info.examples || {};
  const syn = info.synonyms || [];
  const ant = info.antonyms || [];
  const playBtn = (text) => `<button class="mini-play" onclick="speak('${text.replace(/'/g, "\\'")}', {gender: STATE.voiceGender, speed: STATE.speed})">▶</button>`;

  body.innerHTML = `
    <button class="modal-close" id="closeWordModal">×</button>
    <h2>${safe(info.word)} <span style="font-size:0.7em;color:var(--sub);font-weight:400">→ ${safe(info.lemma)}</span></h2>
    <div class="word-meta">${safe(info.partOfSpeech)} · ${safe(info.pronunciationUS)}</div>
    <section>
      <h4>의미</h4>
      <div>${safe(info.meaningKR)}</div>
      <div style="color:var(--sub);font-size:0.9em;margin-top:2px">${safe(info.meaningEN)}</div>
    </section>
    ${(morph.prefix || morph.root || morph.suffix) ? `
    <section>
      <h4>형태소</h4>
      ${morph.prefix ? `<div class="row-item">접두사: ${safe(morph.prefix)}</div>` : ''}
      ${morph.root ? `<div class="row-item">어근: ${safe(morph.root)}</div>` : ''}
      ${morph.suffix ? `<div class="row-item">접미사: ${safe(morph.suffix)}</div>` : ''}
    </section>` : ''}
    ${(vf.base || vf.past) ? `
    <section>
      <h4>동사 활용</h4>
      <div class="row-item">원형: ${safe(vf.base)}</div>
      <div class="row-item">과거: ${safe(vf.past)}</div>
      <div class="row-item">과거분사: ${safe(vf.pastParticiple)}</div>
      <div class="row-item">현재분사: ${safe(vf.presentParticiple)}</div>
      <div class="row-item">3인칭단수: ${safe(vf.thirdPerson)}</div>
    </section>` : ''}
    ${syn.length ? `
    <section>
      <h4>유의어</h4>
      ${syn.map(x => `<div class="row-item">${playBtn(safe(x.word))} <b>${safe(x.word)}</b> — ${safe(x.meaning)}<br><span style="color:var(--sub);font-size:0.85em">${safe(x.example)}</span></div>`).join('')}
    </section>` : ''}
    ${ant.length ? `
    <section>
      <h4>반의어</h4>
      ${ant.map(x => `<div class="row-item">${playBtn(safe(x.word))} <b>${safe(x.word)}</b> — ${safe(x.meaning)}<br><span style="color:var(--sub);font-size:0.85em">${safe(x.example)}</span></div>`).join('')}
    </section>` : ''}
    ${(ex.simple || ex.complex) ? `
    <section>
      <h4>예문</h4>
      ${ex.simple ? `<div class="row-item">${playBtn(safe(ex.simple))} ${safe(ex.simple)}</div>` : ''}
      ${ex.complex ? `<div class="row-item">${playBtn(safe(ex.complex))} ${safe(ex.complex)}</div>` : ''}
    </section>` : ''}
  `;
  const closeBtn = body.querySelector('#closeWordModal');
  if (closeBtn) closeBtn.onclick = () => $('#wordModal').classList.remove('open');
}

/* ============================================================
   따라읽기 (Web Speech Recognition)
   ============================================================ */
function startFollowRead(sentence, resultEl) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    toast('이 브라우저는 따라읽기를 지원하지 않습니다 (Chrome, Edge, Safari 권장)', 4000);
    return;
  }
  if (STATE.activeRecognition) {
    try { STATE.activeRecognition.stop(); } catch (e) {}
    STATE.activeRecognition = null;
    return;
  }
  const rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.continuous = false;

  if (resultEl) {
    resultEl.classList.add('show');
    resultEl.innerHTML = '<div class="label">🎤 듣는 중... 문장을 또박또박 읽어주세요</div>';
  }

  rec.onresult = (e) => {
    const said = e.results[0][0].transcript.trim();
    showFollowReadResult(sentence.text, said, resultEl);
  };
  rec.onerror = (e) => {
    let msg = '인식 오류';
    if (e.error === 'not-allowed') msg = '마이크 권한이 거부되었습니다. 주소창의 자물쇠 아이콘에서 마이크를 허용해 주세요.';
    else if (e.error === 'no-speech') msg = '음성이 감지되지 않았습니다. 다시 시도해 주세요.';
    else if (e.error === 'network') msg = '네트워크 오류 (HTTPS 환경 필요)';
    else if (e.error === 'aborted') msg = '인식이 중단되었습니다.';
    else msg = '인식 오류: ' + e.error;
    if (resultEl) resultEl.innerHTML = `<div class="label">${msg}</div>`;
  };
  rec.onend = () => { STATE.activeRecognition = null; };

  try { rec.start(); STATE.activeRecognition = rec; }
  catch (e) { toast('인식 시작 실패: ' + e.message); }
}

function showFollowReadResult(original, said, el) {
  if (!el) return;
  const norm = (x) => x.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(/\s+/).filter(Boolean);
  const orig = norm(original);
  const heard = norm(said);
  const heardSet = new Set(heard);
  let correctCount = 0;
  const html = orig.map(w => {
    if (heardSet.has(w)) { correctCount++; return `<span class="correct">${w}</span>`; }
    return `<span class="wrong">${w}</span>`;
  }).join(' ');
  const score = orig.length ? Math.round((correctCount / orig.length) * 100) : 0;
  el.innerHTML = `
    <div class="label">인식 결과: "${said}"</div>
    <div style="margin-top:6px">${html}</div>
    <div style="margin-top:6px;color:var(--sub);font-size:0.85em">정확도 ${score}% (${correctCount}/${orig.length})</div>
  `;
}

/* ============================================================
   저장 문서 목록
   ============================================================ */
async function refreshDocList() {
  const list = $('#docList');
  if (!list) return;
  const docs = await dbAll('documents');
  docs.sort((a, b) => b.createdAt - a.createdAt);
  list.innerHTML = '';
  if (docs.length === 0) {
    list.innerHTML = '<div class="empty" style="padding:12px;font-size:0.85em">저장된 문서가 없습니다</div>';
    return;
  }
  for (const d of docs) {
    const item = document.createElement('div');
    item.className = 'doc-item';
    const partial = d.sentences && d.originalText
      ? (d.sentences.length < (splitSentences(d.originalText).length))
      : false;
    item.innerHTML = `
      <div class="title">${escapeHtml(d.title || '문서')}</div>
      ${partial ? '<span class="badge">부분</span>' : ''}
      <button class="del">삭제</button>
    `;
    item.querySelector('.title').onclick = () => openDocument(d.id);
    item.querySelector('.del').onclick = (e) => {
      e.stopPropagation();
      if (confirm('이 문서를 삭제하시겠습니까?')) deleteDocument(d.id);
    };
    list.appendChild(item);
  }
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function openDocument(docId) {
  // 분석 중이면 강제 중단
  STATE.cancelled = true;
  STATE.chunkQueue = [];
  STATE.paused = false;
  STATE.analyzing = false;
  await sleep(100);

  const doc = await dbGet('documents', docId);
  if (!doc) { toast('문서를 찾을 수 없습니다'); return; }

  // 진행률 UI 안전 숨김
  const card = $('#progressCard'); if (card) card.classList.remove('active');
  const fill = $('#progressFill'); if (fill) fill.style.width = '0%';
  const pct = $('#progressPercent'); if (pct) pct.textContent = '0%';

  // 문장 리스트 초기화
  const list = $('#sentenceList'); if (list) list.innerHTML = '';
  const hint = $('#emptyHint'); if (hint) hint.style.display = 'none';

  STATE.currentDoc = doc;
  STATE.sentences = doc.sentences || [];
  STATE.wordCache.clear();

  // YouTube 정보 복원
  if (doc.sourceType === 'youtube' && doc.videoId && doc.segments && doc.segments.length > 0) {
    STATE.currentVideoId = doc.videoId;
    STATE.ytSegments = doc.segments;
    try { await initYouTubePlayer(doc.videoId); } catch (e) { console.warn('YT player init failed', e); }
  } else {
    STATE.currentVideoId = null;
    STATE.ytSegments = [];
    STATE.ytPlayer = null;
  }
  updateOriginalModeAvailability();

  STATE.sentences.forEach(s => renderSentenceBlock(s));
  doc.lastViewedAt = Date.now();
  await dbPut('documents', doc);

  // 사이드 패널 닫기
  const panel = $('#sidePanel'); if (panel) panel.classList.remove('open');
  setStatus(`문서 열기 완료 (${STATE.sentences.length}문장)`);
}

async function deleteDocument(docId) {
  await dbDelete('documents', docId);
  if (STATE.currentDoc?.id === docId) {
    STATE.currentDoc = null;
    STATE.sentences = [];
    const list = $('#sentenceList'); if (list) list.innerHTML = '';
    const hint = $('#emptyHint'); if (hint) hint.style.display = 'block';
  }
  refreshDocList();
  toast('삭제됨');
}

/* ============================================================
   UI 이벤트 바인딩
   ============================================================ */
function bindUI() {
  $('#analyzeBtn').onclick = handleAnalyze;
  $('#urlInput').addEventListener('keydown', e => { if (e.key === 'Enter') handleAnalyze(); });
  $('#fileBtn').onclick = () => $('#fileInput').click();
  $('#cameraBtn').onclick = () => $('#cameraInput').click();
  $('#fileInput').onchange = (e) => handleFile(e.target.files[0]);
  $('#cameraInput').onchange = (e) => handleFile(e.target.files[0]);

  $('#hamburger').onclick = () => { const p = $('#sidePanel'); if (p) p.classList.add('open'); refreshDocList(); };
  $('#closePanel').onclick = () => { const p = $('#sidePanel'); if (p) p.classList.remove('open'); };

  $('#pauseBtn').onclick = () => {
    STATE.paused = !STATE.paused;
    $('#pauseBtn').textContent = STATE.paused ? '재개' : '일시정지';
  };
  $('#cancelBtn').onclick = () => {
    STATE.cancelled = true;
    STATE.chunkQueue = [];
    STATE.paused = false;
    toast('분석 취소됨');
  };

  // 폰트 크기
  $('#fontMinus').onclick = () => setFontSize(STATE.fontSize - 1);
  $('#fontPlus').onclick = () => setFontSize(STATE.fontSize + 1);

  // 음성 모드

  $$('[data-voice-mode]').forEach(b => {
    b.onclick = () => {
      if (b.dataset.disabled === '1') {
        toast('이 문서에는 자막이 없어 원음을 사용할 수 없습니다. TTS 모드를 사용하세요.', 3500);
        return;
      }

      $$('[data-voice-mode]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      STATE.voiceMode = b.dataset.voiceMode;
      applyPlaybackChange();
    };
  });

  // 성별

  $$('[data-gender]').forEach(b => {
    b.onclick = () => {

      $$('[data-gender]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      STATE.voiceGender = b.dataset.gender;
      applyPlaybackChange();
    };
  });

  // 속도

  $$('[data-speed]').forEach(b => {
    b.onclick = () => {

      $$('[data-speed]').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      STATE.speed = parseFloat(b.dataset.speed);
      applyPlaybackChange();
    };
  });

  // 모달 외부 클릭으로 닫기
  $('#wordModal').onclick = (e) => { if (e.target.id === 'wordModal') $('#wordModal').classList.remove('open'); };
}

function setFontSize(n) {
  n = Math.max(12, Math.min(28, n));
  STATE.fontSize = n;
  document.documentElement.style.setProperty('--base', n + 'px');
  const v = $('#fontValue'); if (v) v.textContent = n;
  localStorage.setItem('fontSize', String(n));
}

/* ============================================================
   초기화
   ============================================================ */
async function init() {
  // 폰트 크기 복원
  const saved = parseInt(localStorage.getItem('fontSize') || '16', 10);
  setFontSize(saved);

  bindUI();
  setStatus('TTS 음성 준비 중...');

  // 서버 확인
  try {
    const r = await fetch('/api/health');
    if (r.ok) {
      const h = await r.json();
      setStatus(`서버 연결됨 (키 ${h.keyCount}개)`);
    } else setStatus('서버 응답 없음');
  } catch (e) { setStatus('서버 확인 실패'); }

  // TTS 워밍업
  await warmupTTS();
  setStatus('준비 완료');

  // 저장 문서 목록
  refreshDocList();

  // 원음 모드 초기 상태
  updateOriginalModeAvailability();
}

window.addEventListener('DOMContentLoaded', init);
window.speak = speak; // 모달 인라인 핸들러용
</script>

</body>
</html>
