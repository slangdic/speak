<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Thinking Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
  --base: 16px;
  --bg: #f5efe6;
  --bg-soft: #ede5d5;
  --card: #ffffff;
  --border: #e3dccf;
  --text: #3d4a3d;
  --text-soft: #6b7568;
  --muted: #9aa097;
  --sage: #a8c4a2;
  --sage-dark: #8aab83;
  --sage-soft: #d4e3ce;
  --cream: #f0e6d2;
  --warm: #e8d9b8;
  --yellow-soft: #faf3dc;
  --danger: #d68a8a;
  --danger-dark: #b56e6e;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: var(--base);
  line-height: 1.65;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 1rem; }

.app-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-title { font-size: 1.15rem; font-weight: 700; margin: 0; color: var(--text); letter-spacing: 0.5px; }
.hamburger-btn {
  background: var(--card); border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 18px;
  font-size: 0.88rem; color: var(--text-soft);
}

.app-container { max-width: 800px; margin: 0 auto; padding: 8px 16px 80px; }

.card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 14px; }

.input-card .url-input {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 12px;
  margin-bottom: 12px; background: var(--bg-soft); color: var(--text);
}
.url-input:focus { outline: none; border-color: var(--sage); background: white; }
.input-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-primary {
  background: var(--sage); color: white; border: none;
  padding: 11px 20px; border-radius: 20px; font-weight: 600; font-size: 0.92rem;
}
.btn-primary:hover { background: var(--sage-dark); }
.btn-secondary {
  background: var(--card); color: var(--text); border: 1px solid var(--border);
  padding: 11px 18px; border-radius: 20px; font-size: 0.92rem;
}
.btn-secondary:hover { background: var(--bg-soft); }
.btn-save {
  background: var(--warm); color: var(--text); border: none;
  padding: 11px 18px; border-radius: 20px; font-weight: 600; font-size: 0.92rem;
}
.btn-save:hover { background: #ddc89e; }
.btn-generate {
  background: var(--cream); color: var(--text); border: 1px solid var(--border);
  padding: 11px 18px; border-radius: 20px; font-weight: 600; font-size: 0.92rem;
}
.btn-generate:hover { background: var(--warm); }
.file-label {
  display: inline-block; background: var(--card); color: var(--text);
  border: 1px solid var(--border); padding: 11px 18px; border-radius: 20px;
  cursor: pointer; font-size: 0.92rem;
}
.file-label input { display: none; }

.kr-input-card { display: none; }
.kr-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.rec-bar-wrap { width: 100%; height: 8px; background: var(--bg-soft); border-radius: 4px; overflow: hidden; margin: 8px 0; }
.rec-bar { height: 100%; width: 0%; background: var(--danger); transition: width 0.2s; }
.rec-timer { font-family: monospace; color: var(--text-soft); }
.kr-result-block { background: var(--bg-soft); border-radius: 12px; padding: 14px; margin-top: 10px; }
.kr-label { font-size: 0.82rem; color: var(--text-soft); font-weight: 600; margin-bottom: 6px; }
.kr-text { word-break: keep-all; }

.progress-card { display: none; }
.progress-bar-wrap { width: 100%; height: 8px; background: var(--bg-soft); border-radius: 4px; overflow: hidden; }
.progress-bar { height: 100%; width: 0%; background: var(--sage); transition: width 0.3s; }
.progress-text { margin-top: 8px; font-size: 0.88rem; color: var(--text-soft); }

/* 워밍 진행 표시 줄 */
.warmup-bar {
  display: none;
  position: sticky; top: 58px; z-index: 50;
  background: var(--sage-soft); color: var(--text);
  padding: 6px 14px; border-radius: 12px;
  margin: 0 0 12px; font-size: 0.82rem;
  display: flex; align-items: center; gap: 8px;
}
.warmup-bar.hidden { display: none; }
.warmup-spinner {
  width: 10px; height: 10px;
  border: 2px solid var(--sage-dark);
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.sentence-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.sentence-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.sentence-num {
  font-size: 0.85rem; font-weight: 700; color: var(--sage-dark);
  background: var(--sage-soft); padding: 2px 10px; border-radius: 12px; flex-shrink: 0;
}
.sentence-text { font-size: 1.05rem; line-height: 1.75; word-break: keep-all; margin-bottom: 12px; }
.sentence-controls { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-ctrl {
  background: var(--bg-soft); border: none; padding: 7px 14px;
  border-radius: 16px; font-size: 0.85rem; color: var(--text);
  position: relative;
}
.btn-ctrl:hover { background: var(--sage-soft); }
.btn-ctrl[data-state="stop"] { background: var(--danger); color: white; }
.btn-ctrl[data-state="stop"]:hover { background: var(--danger-dark); }
.btn-ctrl.ready::after {
  content: ''; position: absolute; top: 4px; right: 6px;
  width: 5px; height: 5px; border-radius: 50%; background: var(--sage-dark);
}
.sentence-slot { margin-top: 10px; }

.translation-box, .hard-box, .follow-box {
  background: var(--bg-soft); border-radius: 12px; padding: 12px 14px; margin-top: 10px;
}
.trans-row { margin: 8px 0; word-break: keep-all; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.trans-label {
  display: inline-block; font-size: 0.75rem; font-weight: 700;
  color: var(--sage-dark); background: white; padding: 2px 10px;
  border-radius: 10px; flex-shrink: 0;
}
.hard-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.hard-item:last-child { border-bottom: none; }
.hard-type {
  display: inline-block; font-weight: 700; color: white;
  background: var(--sage); padding: 2px 10px; border-radius: 10px;
  font-size: 0.8rem; margin-right: 8px; margin-bottom: 4px;
}
.hard-target { font-weight: 700; color: var(--sage-dark); font-family: 'Georgia', serif; }
.hard-detail { margin-top: 4px; line-height: 1.65; }

.fr-score { font-weight: 700; color: var(--sage-dark); margin-bottom: 6px; font-size: 1rem; }
.fr-spoken { color: var(--text-soft); font-size: 0.9rem; margin-bottom: 6px; }
.fr-ok { color: var(--sage-dark); font-weight: 600; }
.fr-no { color: var(--danger-dark); text-decoration: line-through; }
.follow-err { color: var(--danger-dark); }

.word-token { cursor: pointer; border-bottom: 1px dotted transparent; transition: all 0.15s; }
.word-token:hover { background: var(--yellow-soft); border-bottom-color: var(--warm); }
.word-token.ready { border-bottom: 1px dotted var(--sage); }

.btn-mini {
  background: var(--card); border: 1px solid var(--border);
  padding: 3px 10px; border-radius: 10px; font-size: 0.75rem;
  margin-left: 4px; color: var(--text-soft); cursor: pointer;
}
.btn-mini:hover { background: var(--sage); color: white; border-color: var(--sage); }

.loading-mini { color: var(--text-soft); font-size: 0.9rem; padding: 8px 0; }

.side-panel {
  position: fixed; top: 0; right: -380px;
  width: 380px; max-width: 90vw; height: 100vh;
  background: var(--card); border-left: 1px solid var(--border);
  transition: right 0.3s; z-index: 200; overflow-y: auto; padding: 18px;
}
.side-panel.open { right: 0; }
.side-panel h3 { margin: 18px 0 10px; font-size: 1rem; color: var(--sage-dark); font-weight: 700; }
.side-close {
  position: sticky; top: 0; float: right;
  background: var(--bg-soft); border: none;
  width: 32px; height: 32px; border-radius: 50%;
  font-size: 1rem; font-weight: 700; color: var(--text-soft); z-index: 10;
}
.setting-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
.setting-row label { flex: 1; color: var(--text); }
.setting-row select {
  background: var(--bg-soft); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: 10px; color: var(--text);
}
.font-controls { display: flex; gap: 8px; align-items: center; }
.font-controls button {
  width: 34px; height: 34px; border: none;
  background: var(--bg-soft); border-radius: 10px;
  font-size: 1.1rem; color: var(--text);
}
.font-controls span { min-width: 40px; text-align: center; font-weight: 600; }

.gender-toggle { display: flex; gap: 0; background: var(--bg-soft); border-radius: 20px; padding: 4px; margin-top: 6px; }
.gender-toggle button {
  flex: 1; padding: 8px 14px; border: none; background: transparent;
  border-radius: 16px; font-weight: 600; color: var(--text-soft); font-size: 0.9rem;
}
.gender-toggle button.active { background: var(--sage); color: white; }

.speed-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.speed-btn {
  padding: 8px 0; border: 1px solid var(--border);
  background: var(--card); border-radius: 12px;
  font-size: 0.85rem; color: var(--text);
}
.speed-btn.active { background: var(--sage); color: white; border-color: var(--sage); }

.storage-info {
  background: var(--bg-soft); border-radius: 12px;
  padding: 10px 14px; font-size: 0.85rem; color: var(--text-soft);
}

.doc-toolbar { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.doc-toolbar input {
  flex: 1; min-width: 100px; padding: 8px 12px;
  border: 1px solid var(--border); border-radius: 14px;
  background: var(--bg-soft); font-size: 0.88rem;
}
.doc-toolbar select {
  padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 14px; background: var(--bg-soft); font-size: 0.85rem;
}
.doc-toolbar-actions { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
.doc-toolbar-actions button {
  padding: 6px 12px; border: 1px solid var(--border);
  background: var(--card); border-radius: 12px;
  font-size: 0.82rem; color: var(--text-soft);
}
.doc-toolbar-actions button:hover { background: var(--bg-soft); }
.doc-toolbar-actions .btn-danger { color: var(--danger-dark); border-color: var(--danger); }

.doc-item {
  padding: 12px; border: 1px solid var(--border);
  border-radius: 12px; margin-bottom: 8px;
  background: var(--card); display: flex; gap: 10px; align-items: flex-start;
}
.doc-item input[type="checkbox"] { margin-top: 4px; flex-shrink: 0; }
.doc-item-body { flex: 1; cursor: pointer; min-width: 0; }
.doc-title { font-weight: 600; word-break: keep-all; color: var(--text); margin-bottom: 4px; }
.doc-meta { font-size: 0.78rem; color: var(--text-soft); }
.doc-badge {
  display: inline-block; font-size: 0.7rem;
  background: var(--warm); color: var(--text);
  padding: 1px 8px; border-radius: 8px; margin-left: 4px;
}
.doc-badge.warm { background: var(--sage-soft); color: var(--sage-dark); }
.doc-actions { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; flex-basis: 100%; }
.doc-actions button {
  padding: 4px 10px; border: 1px solid var(--border);
  background: var(--card); border-radius: 10px;
  font-size: 0.75rem; color: var(--text-soft);
}
.doc-actions button:hover { background: var(--bg-soft); }

/* Word Modal */
.word-modal-root { position: fixed; inset: 0; z-index: 500; }
.word-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
.word-modal-panel {
  position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
  width: 92%; max-width: 600px; max-height: 90vh;
  background: var(--card); border-radius: 18px;
  padding: 20px; overflow-y: auto;
}
.word-modal-close {
  position: sticky; top: 0; float: right;
  background: rgba(61, 74, 61, 0.4); color: white;
  border: none; width: 34px; height: 34px; border-radius: 50%;
  font-weight: 700; font-size: 0.95rem; z-index: 10; backdrop-filter: blur(4px);
}
.word-modal-back {
  background: var(--bg-soft); border: none;
  padding: 6px 14px; border-radius: 14px;
  font-size: 0.85rem; color: var(--text); margin-bottom: 10px;
}
.word-modal-body { clear: both; }
.wm-header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.wm-word { font-size: 1.7rem; font-weight: 700; color: var(--text); }
.wm-ipa { color: var(--text-soft); font-family: 'Georgia', serif; font-style: italic; }
.wm-row { padding: 8px 0; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.wm-en-row { word-break: keep-all; }
.wm-label {
  font-size: 0.78rem; font-weight: 700; color: var(--sage-dark);
  background: var(--sage-soft); padding: 3px 10px; border-radius: 10px; flex-shrink: 0;
}
.wm-val { flex: 1; min-width: 0; }
.wm-section { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.wm-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 10px; color: var(--sage-dark); }
.wm-morpheme { padding: 6px 0; word-break: keep-all; }
.wm-mtype {
  display: inline-block; min-width: 60px; font-size: 0.78rem;
  color: white; background: var(--sage); padding: 1px 8px;
  border-radius: 8px; margin-right: 6px;
}
.wm-mtext { font-weight: 700; margin-right: 8px; font-family: 'Georgia', serif; }
.wm-mkr { color: var(--text-soft); }
.wm-vform { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.wm-vlabel { display: inline-block; min-width: 80px; font-size: 0.85rem; color: var(--text-soft); font-weight: 600; }
.wm-vval { font-weight: 600; }
.wm-related { padding: 10px 0; border-bottom: 1px solid var(--border); }
.wm-related:last-child { border-bottom: none; }
.wm-related-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.wm-related-word { font-weight: 700; color: var(--sage-dark); font-size: 1.05rem; }
.wm-related-mean, .wm-related-ex { margin: 6px 0 4px 8px; font-size: 0.92rem; word-break: keep-all; color: var(--text); }
.wm-related-ex { color: var(--text-soft); font-style: italic; }
.wm-example { padding: 10px 0; border-bottom: 1px solid var(--border); }
.wm-example:last-child { border-bottom: none; }
.wm-ex-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.wm-ex-label {
  font-size: 0.75rem; font-weight: 700; color: white;
  background: var(--sage); padding: 2px 10px; border-radius: 10px;
}
.wm-ex-en, .wm-ex-kr { margin: 4px 0; word-break: keep-all; }
.wm-ex-kr { color: var(--text-soft); margin-top: 6px; }
.word-err { color: var(--danger-dark); padding: 12px; }

/* Generate Modal */
.gen-modal-root { position: fixed; inset: 0; z-index: 600; display: none; }
.gen-modal-root.show { display: block; }
.gen-modal-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.45); }
.gen-modal-panel {
  position: absolute; top: 5%; left: 50%; transform: translateX(-50%);
  width: 92%; max-width: 540px; max-height: 90vh;
  background: var(--card); border-radius: 18px;
  padding: 22px; overflow-y: auto;
}
.gen-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.gen-title { font-size: 1.15rem; font-weight: 700; color: var(--text); }
.gen-close {
  background: var(--bg-soft); border: none;
  width: 34px; height: 34px; border-radius: 50%;
  font-weight: 700; color: var(--text-soft);
}
.gen-section { margin-bottom: 18px; }
.gen-section-label {
  font-size: 0.85rem; font-weight: 700;
  color: var(--sage-dark); margin-bottom: 8px;
}

/* Grade chips */
.grade-row {
  display: flex; gap: 6px; overflow-x: auto;
  padding: 4px 2px 10px; scrollbar-width: thin;
  -webkit-overflow-scrolling: touch;
}
.grade-chip {
  flex-shrink: 0; padding: 8px 14px;
  border: 1px solid var(--border);
  background: var(--card); border-radius: 16px;
  font-size: 0.88rem; color: var(--text);
  cursor: pointer; white-space: nowrap;
}
.grade-chip.active { background: var(--sage); color: white; border-color: var(--sage); font-weight: 600; }

/* Topic input */
.topic-wrap {
  display: flex; gap: 6px; align-items: center;
  background: var(--bg-soft); border-radius: 14px;
  padding: 4px 4px 4px 14px;
}
.topic-wrap input {
  flex: 1; border: none; background: transparent;
  padding: 10px 0; outline: none; color: var(--text);
}
.topic-wrap button {
  width: 38px; height: 38px; border: none;
  background: var(--card); border-radius: 50%;
  color: var(--text-soft); font-size: 0.85rem;
}
.topic-wrap button.recording { background: var(--danger); color: white; }
.topic-wrap button:hover { background: var(--sage-soft); }

/* Word count carousel */
.wc-carousel {
  display: flex; align-items: center; justify-content: center;
  gap: 8px; padding: 14px 0; user-select: none;
  background: var(--bg-soft); border-radius: 14px;
  position: relative;
}
.wc-arrow {
  width: 36px; height: 36px; border: none;
  background: var(--card); border-radius: 50%;
  color: var(--text); font-size: 1rem; font-weight: 700;
}
.wc-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
.wc-track {
  display: flex; gap: 0; align-items: center;
  flex: 1; max-width: 280px; overflow: hidden; justify-content: center;
}
.wc-item {
  flex: 1; text-align: center;
  font-weight: 600; color: var(--text-soft);
  font-size: 0.95rem; padding: 8px 0;
  transition: all 0.2s;
}
.wc-item.center {
  font-size: 1.4rem; font-weight: 700;
  color: var(--sage-dark);
  background: white; border-radius: 12px;
  padding: 12px 0;
}

/* Style / Format chips */
.chip-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-row button {
  padding: 8px 14px; border: 1px solid var(--border);
  background: var(--card); border-radius: 16px;
  font-size: 0.88rem; color: var(--text); cursor: pointer;
}
.chip-row button.active { background: var(--sage); color: white; border-color: var(--sage); font-weight: 600; }

.gen-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.gen-status { padding: 8px 0; font-size: 0.9rem; color: var(--text-soft); }

.toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%);
  background: rgba(61, 74, 61, 0.92); color: white;
  padding: 11px 20px; border-radius: 20px;
  z-index: 1000; display: none; font-size: 0.9rem; max-width: 90%;
}
.toast.show { display: block; }
.status-text { font-size: 0.85rem; color: var(--text-soft); padding: 4px 0; }

.scroll-top-btn {
  position: fixed; bottom: 24px; right: 24px;
  width: 50px; height: 50px; border-radius: 50%;
  background: rgba(168, 196, 162, 0.4); color: var(--text);
  border: none; display: flex; align-items: center; justify-content: center;
  z-index: 90; box-shadow: 0 2px 8px rgba(0,0,0,0.1); backdrop-filter: blur(6px);
}
.scroll-top-btn:hover { background: rgba(168, 196, 162, 0.7); }

#ytPlayerContainer { position: fixed; bottom: -200px; left: -200px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

@media (max-width: 600px) {
  .app-container { padding: 8px 12px 80px; }
  .card { padding: 14px; }
  .wm-word { font-size: 1.45rem; }
}
</style>
</head>
<body>

<header class="app-header">
  <h1 class="app-title">THINKING SKILLS</h1>
  <button id="hamburgerBtn" class="hamburger-btn">설정</button>
</header>

<main class="app-container">
  <div id="warmupBar" class="warmup-bar hidden">
    <span class="warmup-spinner"></span>
    <span id="warmupText"></span>
  </div>

  <div id="inputCard" class="card input-card">
    <input id="urlInput" type="text" class="url-input" placeholder="YouTube URL 또는 텍스트 입력">
    <div class="input-row">
      <button id="analyzeBtn" class="btn-primary">분석 시작</button>
      <button id="openGenBtn" class="btn-generate">문장 생성</button>
      <label class="file-label">
        파일 선택
        <input id="fileInput" type="file" accept=".txt,.pdf,.docx,.doc,image/*">
      </label>

<script>
/* ============================================================
   Part 1/2 : STATE / DB / Gemini 큐 / TTS / YouTube / 워밍
   ============================================================ */
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

const STATE = {
  fontSize: 16,
  speed: 1.0,
  voiceMode: 'tts',
  voiceGender: 'female',
  voices: { female: null, male: null },
  db: null,
  geminiQueue: [],
  geminiBusy: false,
  geminiLast: 0,
  sentences: [],
  analyzing: false,
  currentDocId: null,
  currentVideoId: null,
  ytSegments: [],
  ytPlayer: null,
  sourceType: null,
  currentFullText: '',
  currentRawFile: null,
  currentDoc: null,         // 현재 열린 doc 객체 (워밍용)
  wordCache: {},            // 전역 단어 캐시 (메모리)
  wordStack: [],
  koreanMode: false,
  docSearch: '',
  docSort: 'recent',
  docSelected: new Set(),
  activePlayBtn: null,
  // 워밍 시스템
  warmup: {
    active: false,
    docId: null,
    hardQueue: [],          // {sentenceIdx, priority}
    wordQueue: [],          // [{word}, ...] (배치 처리)
    pause: false,           // 사용자 액션 시 일시 정지
    hardDone: 0,
    hardTotal: 0,
    wordsDone: 0,
    wordsTotal: 0
  },
  io: null                  // IntersectionObserver
};

function toast(msg, ms = 2500) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}
function setStatus(msg) {
  const el = $('#statusText');
  if (el) el.textContent = msg || '';
}
function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function normalizeWord(w) {
  return String(w || '').toLowerCase().replace(/[.,!?;:"'()\[\]]/g, '').trim();
}

/* ---------- IndexedDB ---------- */
const DB_NAME = 'thinking_skills_db';
const DB_VERSION = 3;

function dbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('documents')) db.createObjectStore('documents', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('words')) db.createObjectStore('words', { keyPath: 'id' });
      if (!db.objectStoreNames.contains('files')) db.createObjectStore('files', { keyPath: 'docId' });
    };
    req.onsuccess = () => { STATE.db = req.result; resolve(req.result); };
    req.onerror = () => reject(req.error);
  });
}
function dbPut(store, value) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(value);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbAll(store) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ---------- Gemini 호출 (큐와 직접 호출 분리) ---------- */
const GEMINI_MIN_INTERVAL = 10000;

function callGemini(body) {
  return new Promise((resolve, reject) => {
    STATE.geminiQueue.push({ body, resolve, reject });
    processGeminiQueue();
  });
}
async function processGeminiQueue() {
  if (STATE.geminiBusy) return;
  if (STATE.geminiQueue.length === 0) return;
  STATE.geminiBusy = true;
  while (STATE.geminiQueue.length > 0) {
    const wait = Math.max(0, GEMINI_MIN_INTERVAL - (Date.now() - STATE.geminiLast));
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    const job = STATE.geminiQueue.shift();
    STATE.geminiLast = Date.now();
    try {
      const res = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(job.body)
      });
      if (res.status === 429 || res.status === 503) {
        STATE.geminiQueue.unshift(job);
        await new Promise(r => setTimeout(r, 15000));
        continue;
      }
      if (!res.ok) {
        const errTxt = await res.text();
        job.reject(new Error(`서버 ${res.status}: ${errTxt.slice(0, 150)}`));
        continue;
      }
      const data = await res.json();
      job.resolve(data);
    } catch (err) {
      job.reject(err);
    }
  }
  STATE.geminiBusy = false;
}
async function callGeminiDirect(body) {
  const res = await fetch('/api/gemini', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const errTxt = await res.text();
    throw new Error(`${res.status}: ${errTxt.slice(0, 120)}`);
  }
  return await res.json();
}
// 안전한 JSON 파싱 (빈/잘린 응답 방어)
function safeJsonParse(txt, fallback) {
  if (!txt || typeof txt !== 'string') return fallback;
  try { return JSON.parse(txt); } catch {}
  // 일부 모델이 ```json 으로 감싸는 경우
  const m = txt.match(/```(?:json)?\s*([\s\S]*?)```/);
  if (m) { try { return JSON.parse(m[1]); } catch {} }
  // 첫 [ 부터 마지막 ] 까지 / 첫 { 부터 마지막 } 까지
  const arrM = txt.match(/\[[\s\S]*\]/);
  if (arrM) { try { return JSON.parse(arrM[0]); } catch {} }
  const objM = txt.match(/\{[\s\S]*\}/);
  if (objM) { try { return JSON.parse(objM[0]); } catch {} }
  return fallback;
}

/* ---------- TTS ---------- */
const US_FEMALE_NAMES = [
  'Samantha', 'Allison', 'Ava', 'Susan',
  'Google US English',
  'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira', 'Microsoft Michelle',
  'Microsoft Ana', 'Microsoft Elizabeth',
  'en-US-AriaNeural', 'en-US-JennyNeural', 'en-US-MichelleNeural'
];
const US_MALE_NAMES = [
  'Alex', 'Fred', 'Aaron', 'Tom', 'Bruce',
  'Microsoft Guy', 'Microsoft Christopher', 'Microsoft Davis',
  'Microsoft Eric', 'Microsoft Roger', 'Microsoft Steffan',
  'en-US-GuyNeural', 'en-US-DavisNeural', 'en-US-ChristopherNeural'
];
const UK_BLOCKLIST = /Daniel|Oliver|Arthur|Kate|Serena|Moira|Tessa|Karen|Veena|Rishi|Sangeeta/i;

function pickVoice(genderPref) {
  const all = speechSynthesis.getVoices();
  if (!all.length) return null;
  const usVoices = all.filter(v => /en[-_]US/i.test(v.lang) || /US English/i.test(v.name));
  const names = genderPref === 'male' ? US_MALE_NAMES : US_FEMALE_NAMES;
  for (const wanted of names) {
    const v = usVoices.find(x => x.name === wanted || x.name.includes(wanted));
    if (v && !UK_BLOCKLIST.test(v.name)) return v;
  }
  const fallbackUS = usVoices.find(v => !UK_BLOCKLIST.test(v.name));
  if (fallbackUS) return fallbackUS;
  return all.find(v => /^en/i.test(v.lang) && !UK_BLOCKLIST.test(v.name)) || null;
}
function loadVoices() {
  STATE.voices.female = pickVoice('female');
  STATE.voices.male = pickVoice('male');
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function warmupTTS() {
  if (!('speechSynthesis' in window)) return;
  try { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } catch {}
}
function speak(text, opts = {}) {
  if (!('speechSynthesis' in window)) { toast('TTS 미지원 브라우저'); return; }
  if (!text) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const isEnglish = !opts.lang || opts.lang.startsWith('en');
  utter.lang = isEnglish ? 'en-US' : opts.lang;
  utter.rate = isEnglish ? STATE.speed : 1;
  if (isEnglish) {
    const v = STATE.voiceGender === 'male' ? STATE.voices.male : STATE.voices.female;
    if (v) utter.voice = v;
  }
  if (opts.onEnd) utter.onend = opts.onEnd;
  utter.onerror = () => { if (opts.onEnd) opts.onEnd(); };
  speechSynthesis.speak(utter);
}
function stopSpeaking() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function applyPlaybackChange() {
  if (STATE.ytPlayer && typeof STATE.ytPlayer.setPlaybackRate === 'function') {
    try { STATE.ytPlayer.setPlaybackRate(nearestYtRate(STATE.speed)); } catch {}
  }
}

/* ---------- YouTube ---------- */
let ytApiReady = false;
let ytApiQueue = [];
function loadYouTubeApi() {
  if (ytApiReady || window.YT?.Player) { ytApiReady = true; return; }
  if (window._ytApiLoading) return;
  window._ytApiLoading = true;
  window.onYouTubeIframeAPIReady = () => {
    ytApiReady = true;
    ytApiQueue.forEach(fn => fn()); ytApiQueue = [];
  };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}
function whenYtReady(fn) {
  if (ytApiReady && window.YT?.Player) fn();
  else { ytApiQueue.push(fn); loadYouTubeApi(); }
}
function initYouTubePlayer(videoId) {
  whenYtReady(() => {
    if (STATE.ytPlayer && typeof STATE.ytPlayer.cueVideoById === 'function') {
      try { STATE.ytPlayer.cueVideoById(videoId); return; } catch {}
    }
    STATE.ytPlayer = new YT.Player('ytPlayer', {
      videoId,
      playerVars: { controls: 0, disablekb: 1, fs: 0 },
      events: { onReady: () => updateOriginalModeAvailability() }
    });
  });
}
function nearestYtRate(rate) {
  const allowed = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
  let best = 1, diff = Infinity;
  for (const r of allowed) {
    const d = Math.abs(r - rate);
    if (d < diff) { diff = d; best = r; }
  }
  return best;
}
function playOriginal(start, end, onEnd) {
  if (!STATE.ytPlayer) { if (onEnd) onEnd(); return; }
  try {
    STATE.ytPlayer.setPlaybackRate(nearestYtRate(STATE.speed));
    STATE.ytPlayer.seekTo(start, true);
    STATE.ytPlayer.playVideo();
    const dur = (end - start) * 1000 / STATE.speed;
    setTimeout(() => { try { STATE.ytPlayer.pauseVideo(); } catch {} if (onEnd) onEnd(); }, dur);
  } catch { if (onEnd) onEnd(); }
}
function updateOriginalModeAvailability() {
  const select = $('#voiceModeSelect');
  if (!select) return;
  const opt = select.querySelector('option[value="original"]');
  if (!opt) return;
  const available = !!(STATE.ytPlayer && STATE.ytSegments?.length > 0);
  opt.disabled = !available;
  if (!available && STATE.voiceMode === 'original') {
    STATE.voiceMode = 'tts';
    select.value = 'tts';
  }
}

/* ============================================================
   워밍 시스템 (옵션 B)
   ============================================================ */
const WORD_BATCH_SIZE = 8;
const WARMUP_INTERVAL = 10000;     // 워밍 호출 간 최소 간격

function stopWarmup() {
  STATE.warmup.active = false;
  STATE.warmup.docId = null;
  STATE.warmup.hardQueue = [];
  STATE.warmup.wordQueue = [];
  STATE.warmup.pause = false;
  STATE.warmup.hardDone = 0;
  STATE.warmup.hardTotal = 0;
  STATE.warmup.wordsDone = 0;
  STATE.warmup.wordsTotal = 0;
  updateWarmupBar();
  if (STATE.io) { try { STATE.io.disconnect(); } catch {} STATE.io = null; }
}

function updateWarmupBar() {
  const bar = $('#warmupBar');
  const text = $('#warmupText');
  if (!bar || !text) return;
  const w = STATE.warmup;
  if (!w.active || (w.hardTotal === 0 && w.wordsTotal === 0)) {
    bar.classList.add('hidden');
    return;
  }
  const parts = [];
  if (w.hardTotal > 0) parts.push(`듣기 ${w.hardDone}/${w.hardTotal}`);
  if (w.wordsTotal > 0) parts.push(`단어 ${w.wordsDone}/${w.wordsTotal}`);
  text.textContent = parts.join(' · ') + ' 준비 중...';
  bar.classList.remove('hidden');
  if (w.hardDone >= w.hardTotal && w.wordsDone >= w.wordsTotal) {
    setTimeout(() => bar.classList.add('hidden'), 1500);
  }
}

async function startWarmupForDoc(doc) {
  stopWarmup();
  if (!doc || !doc.sentences || doc.sentences.length === 0) return;
  
  STATE.warmup.active = true;
  STATE.warmup.docId = doc.id;
  
  // hardQueue: hardListening이 없는 문장 인덱스
  doc.sentences.forEach((s, idx) => {
    if (!s.hardListening || !s.hardListening.ready) {
      STATE.warmup.hardQueue.push({ sentenceIdx: idx, priority: 100 + idx });
    }
  });
  STATE.warmup.hardTotal = STATE.warmup.hardQueue.length + 
    doc.sentences.filter(s => s.hardListening?.ready).length;
  STATE.warmup.hardDone = STATE.warmup.hardTotal - STATE.warmup.hardQueue.length;
  
  // wordQueue: unique 단어 중 wordData에 없고 글로벌 캐시에도 없는 것
  if (!doc.wordData) doc.wordData = {};
  const uniqueWords = new Set();
  doc.sentences.forEach(s => {
    (s.words || []).forEach(w => {
      const n = normalizeWord(w);
      if (n.length >= 2 && /[a-zA-Z]/.test(n)) uniqueWords.add(n);
    });
  });
  for (const w of uniqueWords) {
    if (doc.wordData[w]) continue;
    // 글로벌 캐시 확인
    if (STATE.wordCache[w]) {
      doc.wordData[w] = STATE.wordCache[w];
      continue;
    }
  }
  // IndexedDB에서도 확인
  for (const w of uniqueWords) {
    if (doc.wordData[w]) continue;
    try {
      const cached = await dbGet('words', w);
      if (cached?.data) {
        doc.wordData[w] = cached.data;
        STATE.wordCache[w] = cached.data;
      }
    } catch {}
  }
  // 큐 빌드
  for (const w of uniqueWords) {
    if (!doc.wordData[w]) STATE.warmup.wordQueue.push(w);
  }
  STATE.warmup.wordsTotal = uniqueWords.size;
  STATE.warmup.wordsDone = uniqueWords.size - STATE.warmup.wordQueue.length;
  
  // 즉시 저장 (캐시 hit 반영)
  try { await dbPut('documents', doc); } catch {}
  
  updateWarmupBar();
  refreshSentenceReadyMarks();
  
  // IntersectionObserver 설정: 보이는 문장의 hard 작업을 큐 앞으로
  setupSentenceObserver();
  
  // 워커 시작
  warmupLoop();
}

function setupSentenceObserver() {
  if (STATE.io) { try { STATE.io.disconnect(); } catch {} }
  if (!('IntersectionObserver' in window)) return;
  STATE.io = new IntersectionObserver((entries) => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      const sid = en.target.dataset.id;
      if (!sid || !STATE.currentDoc) return;
      const idx = STATE.currentDoc.sentences.findIndex(s => s.id === sid);
      if (idx < 0) return;
      // hardQueue에서 해당 인덱스를 앞으로
      const hi = STATE.warmup.hardQueue.findIndex(j => j.sentenceIdx === idx);
      if (hi > 0) {
        const item = STATE.warmup.hardQueue.splice(hi, 1)[0];
        item.priority = -1;
        STATE.warmup.hardQueue.unshift(item);
      }
      // wordQueue: 해당 문장 단어를 앞으로
      const s = STATE.currentDoc.sentences[idx];
      if (s && Array.isArray(s.words)) {
        const targetWords = new Set(s.words.map(normalizeWord).filter(w => w.length >= 2));
        const front = [];
        const back = [];
        for (const w of STATE.warmup.wordQueue) {
          if (targetWords.has(w)) front.push(w);
          else back.push(w);
        }
        if (front.length > 0) STATE.warmup.wordQueue = front.concat(back);
      }
    });
  }, { threshold: 0.1 });

  $$('.sentence-card').forEach(c => STATE.io.observe(c));
}

async function warmupLoop() {
  while (STATE.warmup.active) {
    if (STATE.warmup.pause) {
      await new Promise(r => setTimeout(r, 500));
      continue;
    }
    if (STATE.warmup.hardQueue.length === 0 && STATE.warmup.wordQueue.length === 0) {
      // 완료
      STATE.warmup.active = false;
      updateWarmupBar();
      break;
    }
    // 우선순위: hard가 있으면 hard 1개, 그다음 words 1배치 — 번갈아
    const doHard = STATE.warmup.hardQueue.length > 0;
    const doWord = STATE.warmup.wordQueue.length > 0;
    
    try {
      if (doHard) await processOneHard();
      if (!STATE.warmup.active) break;
      if (STATE.warmup.pause) continue;
      if (doWord) await processOneWordBatch();
    } catch (err) {
      console.warn('warmup error', err);
      await new Promise(r => setTimeout(r, 5000));
    }
    // 간격
    await new Promise(r => setTimeout(r, WARMUP_INTERVAL));
  }
}

async function processOneHard() {
  if (STATE.warmup.hardQueue.length === 0) return;
  const job = STATE.warmup.hardQueue.shift();
  const doc = STATE.currentDoc;
  if (!doc || doc.id !== STATE.warmup.docId) return;
  const s = doc.sentences[job.sentenceIdx];
  if (!s) return;
  try {
    const data = await fetchHardListening(s.text);
    s.hardListening = { ready: true, reasons: data.reasons || [] };
    STATE.warmup.hardDone++;
    await dbPut('documents', doc);
    refreshSentenceReadyMarks(s.id);
    updateWarmupBar();
  } catch (err) {
    // 실패 시 다시 큐 뒤로
    console.warn('hard warmup fail', err.message);
    STATE.warmup.hardQueue.push(job);
    await new Promise(r => setTimeout(r, 5000));
  }
}

async function processOneWordBatch() {
  if (STATE.warmup.wordQueue.length === 0) return;
  const batch = STATE.warmup.wordQueue.splice(0, WORD_BATCH_SIZE);
  const doc = STATE.currentDoc;
  if (!doc || doc.id !== STATE.warmup.docId) return;
  try {
    const results = await fetchWordBatch(batch);
    for (const w of batch) {
      const d = results[w];
      if (d) {
        doc.wordData[w] = d;
        STATE.wordCache[w] = d;
        try { await dbPut('words', { id: w, data: d, savedAt: Date.now() }); } catch {}
        STATE.warmup.wordsDone++;
      } else {
        // 응답에 없는 단어는 fallback: 큐 다시 추가
        STATE.warmup.wordQueue.push(w);
      }
    }
    await dbPut('documents', doc);
    refreshSentenceReadyMarks();
    updateWarmupBar();
  } catch (err) {
    console.warn('word warmup fail', err.message);
    STATE.warmup.wordQueue.unshift(...batch);
    await new Promise(r => setTimeout(r, 5000));
  }
}

// 사용자 액션 시 호출
function pauseWarmup() { STATE.warmup.pause = true; }
function resumeWarmup() { STATE.warmup.pause = false; }

function refreshSentenceReadyMarks(onlyId = null) {
  const doc = STATE.currentDoc;
  if (!doc) return;
  const cards = onlyId ? [$(`.sentence-card[data-id="${onlyId}"]`)].filter(Boolean) : $$('.sentence-card');
  cards.forEach(card => {
    const sid = card.dataset.id;
    const s = doc.sentences.find(x => x.id === sid);
    if (!s) return;
    const hardBtn = $$('.btn-ctrl', card).find(b => b.textContent === '왜 안들리지?');
    if (hardBtn) hardBtn.classList.toggle('ready', !!s.hardListening?.ready);
    // 단어 토큰 ready 표시

    $$('.word-token', card).forEach(tok => {
      const w = normalizeWord(tok.textContent);
      if (doc.wordData && doc.wordData[w]) tok.classList.add('ready');
      else tok.classList.remove('ready');
    });
  });
}

/* ---------- Gemini 호출 헬퍼: hardListening / word batch / translation ---------- */
async function fetchHardListening(sentenceText) {
  const prompt = `You are an American English pronunciation coach. Analyze the following sentence and explain in DETAIL why a Korean learner would struggle to hear it.

Quote SPECIFIC words/phrases from the sentence. Cover EVERY relevant aspect with separate items. Provide as many items as truly apply (no limit):

- linking/liaison (연음): e.g., "want it" → /wɑːnɪt/
- elision (탈락음): e.g., /t/ deletion in "next day"
- reduction/contractions (축약): "going to" → "gonna"
- weak forms (기능어 약화): "for", "to", "of", "and" pronounced as schwa
- stress shift (강세 이동)
- intonation (억양)
- rhythm (리듬)
- assimilation (동화): "did you" → "didja"
- T-flapping: "water" → "wadder"
- idiomatic expressions (관용 표현)
- phrasal verbs (구동사)
- colloquial patterns (구어체)

Return STRICT JSON only:
{"reasons":[{"type":"연음","target":"want it","detail":"/wɑːnt/의 /t/가 모음 /ɪt/과 연결되어 /wɑːnɪt/처럼 발음됩니다. 한국 학습자는 보통..."}]}

Rules:
- "type": Korean label (연음/탈락/축약/약화/강세이동/억양/리듬/동화/T-플랩/관용표현/구동사/구어체)
- "target": exact word/phrase from sentence
- "detail": detailed Korean explanation with IPA when helpful
- Each item references SPECIFIC words from the sentence

Sentence: ${sentenceText}`;
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.5, maxOutputTokens: 3072, responseMimeType: 'application/json' }
  };
  const result = await callGeminiDirect(body);
  const txt = result.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  const parsed = safeJsonParse(txt, { reasons: [] });
  return parsed;
}

async function fetchWordBatch(words) {
  const prompt = `Analyze the following English words. Return STRICT JSON only. Use AMERICAN English, AMERICAN IPA, natural usage (no slang).

Output format - an OBJECT keyed by lowercase word:
{
  "word1": {
    "word": "original",
    "lemma": "base form",
    "pronunciationUS": "/American IPA/",
    "partOfSpeech": "noun/verb/...",
    "meaningKR": "한국어 의미",
    "meaningEN": "Clear definition sentence",
    "morphemes": [{"type":"root","text":"...","meaningKR":"..."}],
    "verbForms": {"base":"","past":"","pastParticiple":"","presentParticiple":"","thirdPerson":""},
    "synonyms": [{"word":"","meaningEN":"","example":""}],
    "antonyms": [{"word":"","meaningEN":"","example":""}],
    "examples": [{"simple":"","simpleKR":"","complex":"","complexKR":""}]
  },
  ...
}

Rules:
- All ${words.length} words MUST be present as keys (lowercase)
- pronunciationUS: AMERICAN IPA only
- If not a verb, verbForms all empty strings
- synonyms/antonyms: 2-3 each
- examples: 1 object

Words: ${words.join(', ')}`;
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.4, maxOutputTokens: 8192, responseMimeType: 'application/json' }
  };
  const result = await callGeminiDirect(body);
  const txt = result.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  return safeJsonParse(txt, {});
}

async function fetchSingleWord(word) {
  // 단일 단어 즉시 조회 (사용자가 단어 클릭, 캐시 miss 시)
  const prompt = `Analyze the English word "${word}" in American English. Return STRICT JSON only:
{
  "word": "original",
  "lemma": "base form",
  "pronunciationUS": "/American IPA/",
  "partOfSpeech": "...",
  "meaningKR": "한국어 의미",
  "meaningEN": "Clear definition",
  "morphemes": [{"type":"root","text":"...","meaningKR":"..."}],
  "verbForms": {"base":"","past":"","pastParticiple":"","presentParticiple":"","thirdPerson":""},
  "synonyms": [{"word":"","meaningEN":"","example":""}],
  "antonyms": [{"word":"","meaningEN":"","example":""}],
  "examples": [{"simple":"","simpleKR":"","complex":"","complexKR":""}]
}

Rules: AMERICAN IPA only. If not verb, verbForms all empty. synonyms/antonyms 3 each.

Word: ${word}`;
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.4, maxOutputTokens: 2000, responseMimeType: 'application/json' }
  };
  const result = await callGeminiDirect(body);
  const txt = result.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  return safeJsonParse(txt, null);
}

async function fetchTranslationFor(englishText) {
  const prompt = `Translate the English sentence to Korean. Return STRICT JSON ONLY:
{"literal":"직역 한국어","natural":"자연스러운 의역 한국어"}

Sentence: ${englishText}`;
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.3, maxOutputTokens: 1024, responseMimeType: 'application/json' }
  };
  const res = await callGeminiDirect(body);
  const txt = res.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  return safeJsonParse(txt, { literal: '', natural: '' });
}
</script>
<script>
/* ============================================================
   Part 2/2 : 입력/분석 / 문장 카드 / 단어장 / 따라읽기 /
   한국어→영어 / 문서 목록 / 문장 생성 모달 / 초기화
   ============================================================ */

/* ---------- 입력 라우팅 ---------- */
async function handleAnalyze() {
  const input = $('#urlInput')?.value?.trim();
  if (!input) { toast('URL 또는 텍스트를 입력하세요'); return; }
  if (/youtube\.com|youtu\.be/.test(input)) {
    await handleYouTube(input);
  } else if (/^https?:\/\//.test(input)) {
    toast('YouTube URL 또는 텍스트를 입력하세요');
  } else {
    STATE.currentRawFile = null;
    await analyzeText(input, { sourceType: 'text', title: titleFromText(input) });
  }
}

async function handleYouTube(url) {
  setStatus('YouTube 자막 가져오는 중...');
  showProgress(0, '자막 추출 중');
  try {
    const res = await fetch(`/api/youtube?url=${encodeURIComponent(url)}`);
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`서버 오류 ${res.status}: ${errText.slice(0, 200)}`);
    }
    const data = await res.json();
    if (!data.fullText) throw new Error('자막/전사 결과가 비어있습니다');
    STATE.currentVideoId = data.videoId;
    STATE.ytSegments = data.segments || [];
    STATE.sourceType = 'youtube';
    STATE.currentRawFile = null;
    if (data.segments?.length > 0) initYouTubePlayer(data.videoId);
    const title = (data.title && titleFromText(data.title)) || titleFromText(data.fullText);
    await analyzeText(data.fullText, {
      sourceType: 'youtube',
      videoId: data.videoId,
      segments: data.segments || [],
      title
    });
  } catch (err) {
    hideProgress();
    setStatus('');
    toast('YouTube 처리 실패: ' + err.message);
  }
}

async function handleFile(file) {
  if (!file) return;
  const name = file.name.toLowerCase();
  setStatus(`${file.name} 처리 중...`);
  showProgress(0, '파일 분석 중');
  try {
    let text = '';
    if (name.endsWith('.txt')) text = await file.text();
    else if (name.endsWith('.pdf')) text = await extractPdfText(file);
    else if (name.endsWith('.docx') || name.endsWith('.doc')) {
      const buf = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: buf });
      text = result.value;
    } else if (file.type.startsWith('image/')) {
      const result = await Tesseract.recognize(file, 'eng+kor', {
        logger: m => { if (m.status === 'recognizing text') updateProgress(m.progress * 100, 'OCR 인식 중'); }
      });
      text = result.data.text;
    } else throw new Error('지원하지 않는 파일 형식');
    if (!text.trim()) throw new Error('텍스트를 추출하지 못했습니다');
    STATE.sourceType = 'file';
    STATE.currentRawFile = file;
    await analyzeText(text, {
      sourceType: 'file',
      title: titleFromText(file.name.replace(/\.[^.]+$/, '')),
      fileName: file.name, fileType: file.type
    });
  } catch (err) {
    hideProgress(); setStatus('');
    toast('파일 처리 실패: ' + err.message);
  }
}

async function extractPdfText(file) {
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    updateProgress((i / pdf.numPages) * 50, `PDF ${i}/${pdf.numPages} 페이지`);
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

function titleFromText(text) {
  if (!text) return '제목 없음';
  const words = text.trim().replace(/\s+/g, ' ').split(' ').slice(0, 3);
  return words.join(' ') || '제목 없음';
}
function splitSentences(text) {
  const cleaned = text.replace(/\s+/g, ' ').trim();
  const raw = cleaned.match(/[^.!?]+[.!?]+|\S+$/g) || [];
  return raw.map(s => s.trim()).filter(s => s.length > 2);
}

/* ---------- 분석 파이프라인 ---------- */
async function analyzeText(text, meta = {}) {
  // 기존 워밍 중단
  stopWarmup();
  STATE.sentences = [];
  STATE.analyzing = true;
  STATE.currentFullText = text;
  
  const container = $('#sentenceList');
  if (container) container.innerHTML = '';
  
  const sentences = splitSentences(text);
  if (sentences.length === 0) {
    hideProgress();
    toast('분석할 문장이 없습니다');
    return;
  }
  
  const docId = Date.now();
  STATE.currentDocId = docId;
  const docRecord = {
    id: docId,
    title: meta.title || titleFromText(text),
    sourceType: meta.sourceType || 'text',
    videoId: meta.videoId || null,
    segments: meta.segments || [],
    fullText: text,
    fileName: meta.fileName || null,
    fileType: meta.fileType || null,
    sentences: [],
    wordData: {},
    warmupComplete: false,
    createdAt: new Date().toISOString()
  };
  STATE.currentDoc = docRecord;
  await dbPut('documents', docRecord);
  
  if (STATE.currentRawFile) {
    try {
      await dbPut('files', { docId, blob: STATE.currentRawFile, name: STATE.currentRawFile.name, type: STATE.currentRawFile.type });
    } catch (e) { console.warn('파일 저장 실패', e); }
  }
  
  const saveBtn = $('#saveBtn');
  if (saveBtn) saveBtn.style.display = 'inline-block';
  
  const CHUNK = 8;
  const total = sentences.length;
  let done = 0;
  
  for (let i = 0; i < sentences.length; i += CHUNK) {
    if (!STATE.analyzing) break;
    const chunk = sentences.slice(i, i + CHUNK);
    updateProgress((done / total) * 100, `${done}/${total} 문장 분석 중`);
    try {
      const analyzed = await analyzeChunk(chunk);
      analyzed.forEach((s, idx) => {
        const sentenceObj = {
          id: `${docId}_${i + idx}`,
          index: i + idx,
          number: i + idx + 1,
          ...s,
          hardListening: null
        };
        STATE.sentences.push(sentenceObj);
        docRecord.sentences.push(sentenceObj);
        renderSentenceBlock(sentenceObj);
      });
      done += chunk.length;
      await dbPut('documents', docRecord);
    } catch (err) {
      console.error('chunk 분석 실패:', err);
      toast(`청크 분석 실패 (${i}~${i + CHUNK})`);
    }
  }
  
  STATE.analyzing = false;
  hideProgress();
  updateOriginalModeAvailability();
  setStatus(`분석 완료 (${STATE.sentences.length}문장)`);
  refreshDocList();
  
  // 백그라운드 워밍 시작
  startWarmupForDoc(docRecord);
}

async function analyzeChunk(sentences) {
  const prompt = `You are an English-Korean translator. For each English sentence below, return BOTH a literal translation AND a natural Korean translation. NEVER leave translations empty.

Return EXACTLY this JSON array (no other text):
[
  {
    "text": "exact original English sentence",
    "translationLiteral": "직역 (반드시 작성)",
    "translationNatural": "의역 (반드시 작성)",
    "words": ["meaningful","words","only"]
  }
]

Rules:
- Both translation fields MUST be non-empty Korean
- "words": exclude articles (a/an/the) and basic prepositions
- Array order MUST match input
- Number of objects: exactly ${sentences.length}

Sentences:
${sentences.map((s, i) => `${i + 1}. ${s}`).join('\n')}`;
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.4, maxOutputTokens: 4096, responseMimeType: 'application/json' }
  };
  const result = await callGemini(body);
  const textOut = result.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
  let parsed = safeJsonParse(textOut, []);
  if (!Array.isArray(parsed)) parsed = [];
  while (parsed.length < sentences.length) {
    parsed.push({
      text: sentences[parsed.length],
      translationLiteral: '', translationNatural: '',
      words: sentences[parsed.length].split(/\s+/).filter(w => w.length > 1)
    });
  }
  return parsed.slice(0, sentences.length);
}

function showProgress(pct, msg) { const card = $('#progressCard'); if (card) card.style.display = 'block'; updateProgress(pct, msg); }
function updateProgress(pct, msg) {
  const bar = $('#progressBar'), text = $('#progressText');
  if (bar) bar.style.width = `${Math.min(100, Math.max(0, pct))}%`;
  if (text) text.textContent = msg || '';
}
function hideProgress() { const card = $('#progressCard'); if (card) card.style.display = 'none'; }

/* ============================================================
   문장 카드
   ============================================================ */
function renderSentenceBlock(s) {
  const container = $('#sentenceList');
  if (!container) return;
  const card = document.createElement('div');
  card.className = 'sentence-card';
  card.dataset.id = s.id;
  
  const header = document.createElement('div');
  header.className = 'sentence-header';
  header.innerHTML = `<span class="sentence-num">${s.number}</span>`;
  card.appendChild(header);
  
  const textBox = document.createElement('div');
  textBox.className = 'sentence-text';
  textBox.appendChild(renderClickableWords(s.text));
  card.appendChild(textBox);
  
  const ctrl = document.createElement('div');
  ctrl.className = 'sentence-controls';
  
  const playBtn = document.createElement('button');
  playBtn.className = 'btn-ctrl';
  playBtn.textContent = '재생';
  playBtn.dataset.state = 'play';
  playBtn.onclick = () => toggleSentencePlay(s, playBtn);
  ctrl.appendChild(playBtn);
  
  const transBtn = document.createElement('button');
  transBtn.className = 'btn-ctrl';
  transBtn.textContent = '번역';
  transBtn.onclick = () => toggleTranslation(s, card, transBtn);
  ctrl.appendChild(transBtn);
  
  const followBtn = document.createElement('button');
  followBtn.className = 'btn-ctrl';
  followBtn.textContent = '따라읽기';
  followBtn.onclick = () => startFollowRead(s, card);
  ctrl.appendChild(followBtn);
  
  const hardBtn = document.createElement('button');
  hardBtn.className = 'btn-ctrl';
  hardBtn.textContent = '왜 안들리지?';
  if (s.hardListening?.ready) hardBtn.classList.add('ready');
  hardBtn.onclick = () => toggleHardListening(s, card, hardBtn);
  ctrl.appendChild(hardBtn);
  
  card.appendChild(ctrl);
  const slot = document.createElement('div');
  slot.className = 'sentence-slot';
  card.appendChild(slot);
  container.appendChild(card);
  
  // ready marks (단어)
  if (STATE.currentDoc?.wordData) {

    $$('.word-token', card).forEach(tok => {
      const w = normalizeWord(tok.textContent);
      if (STATE.currentDoc.wordData[w]) tok.classList.add('ready');
    });
  }
  
  // IntersectionObserver에 등록
  if (STATE.io) STATE.io.observe(card);
}

function resetActivePlayBtn() {
  if (STATE.activePlayBtn) {
    STATE.activePlayBtn.textContent = '재생';
    STATE.activePlayBtn.dataset.state = 'play';
    STATE.activePlayBtn = null;
  }
}

function toggleSentencePlay(s, btn) {
  if (btn.dataset.state === 'play') {
    resetActivePlayBtn();
    stopSpeaking();
    if (STATE.ytPlayer?.pauseVideo) { try { STATE.ytPlayer.pauseVideo(); } catch {} }
    btn.textContent = '정지';
    btn.dataset.state = 'stop';
    STATE.activePlayBtn = btn;
    playSentence(s, () => {
      btn.textContent = '재생';
      btn.dataset.state = 'play';
      if (STATE.activePlayBtn === btn) STATE.activePlayBtn = null;
    });
  } else {
    stopSpeaking();
    if (STATE.ytPlayer?.pauseVideo) { try { STATE.ytPlayer.pauseVideo(); } catch {} }
    btn.textContent = '재생';
    btn.dataset.state = 'play';
    if (STATE.activePlayBtn === btn) STATE.activePlayBtn = null;
  }
}

function playSentence(s, onEnd) {
  if (STATE.voiceMode === 'original' && STATE.ytSegments?.length > 0 && STATE.ytPlayer) {
    const seg = findSegmentForSentence(s);
    if (seg) { playOriginal(seg.start, seg.end, onEnd); return; }
  }
  speak(s.text, { onEnd });
}
function findSegmentForSentence(s) {
  if (!STATE.ytSegments) return null;
  const target = s.text.toLowerCase().slice(0, 30);
  for (const seg of STATE.ytSegments) {
    if (seg.text.toLowerCase().includes(target.slice(0, 15))) return seg;
  }
  return null;
}

/* 번역 - 즉시 표시 (캐시 우선) */
async function toggleTranslation(s, card, btn) {
  const slot = card.querySelector('.sentence-slot');
  if (!slot) return;
  const existing = slot.querySelector('.translation-box');
  if (existing) { existing.remove(); return; }
  
  const box = document.createElement('div');
  box.className = 'translation-box';
  slot.appendChild(box);
  
  // 캐시 있으면 즉시 그림
  if (s.translationLiteral && s.translationNatural) {
    renderTranslationBox(box, s);
    return;
  }
  // 없으면 즉시 호출
  box.innerHTML = '<div class="loading-mini">번역 중...</div>';
  pauseWarmup();
  try {
    const result = await fetchTranslationFor(s.text);
    s.translationLiteral = result.literal || s.translationLiteral || '';
    s.translationNatural = result.natural || s.translationNatural || '';
    updateSentenceInDoc(s);
    box.innerHTML = '';

function renderClickableWords(text) {
  const wrap = document.createElement('span');
  wrap.className = 'words-wrap';
  const tokens = (text || '').split(/(\s+)/);
  tokens.forEach(tok => {
    if (/^\s+$/.test(tok)) wrap.appendChild(document.createTextNode(tok));
    else {
      const clean = tok.replace(/[.,!?;:"'()\[\]]/g, '');
      if (/[a-zA-Z]/.test(clean) && clean.length > 0) {
        const span = document.createElement('span');
        span.className = 'word-token';
        span.textContent = tok;
        span.onclick = (e) => { e.stopPropagation(); openWordModal(clean); };
        wrap.appendChild(span);
      } else wrap.appendChild(document.createTextNode(tok));
    }
  });
  return wrap;
}

const POS_KR = {
  'noun': '명사', 'verb': '동사', 'adjective': '형용사', 'adverb': '부사',
  'pronoun': '대명사', 'preposition': '전치사', 'conjunction': '접속사',
  'interjection': '감탄사', 'determiner': '한정사', 'article': '관사',
  'auxiliary verb': '조동사', 'modal verb': '조동사', 'phrasal verb': '구동사', 'idiom': '관용구'
};
function posLabel(en) {
  if (!en) return '';
  const lower = en.toLowerCase().trim();
  const kr = POS_KR[lower] || POS_KR[lower.split(/[\s,/]/)[0]] || '';
  return kr ? `${en} (${kr})` : en;
}

const MODAL_MAX = 10;
function ensureModalRoot() {
  let root = $('#wordModal');
  if (!root) {
    root = document.createElement('div');
    root.id = 'wordModal';
    root.className = 'word-modal-root';
    root.style.display = 'none';
    root.innerHTML = `
      <div class="word-modal-backdrop"></div>
      <div class="word-modal-panel">
        <button class="word-modal-close" type="button" aria-label="닫기">X</button>
        <button class="word-modal-back" type="button" style="display:none">← 이전</button>
        <div class="word-modal-body"></div>
      </div>`;
    document.body.appendChild(root);
    root.querySelector('.word-modal-backdrop').onclick = closeWordModal;
    root.querySelector('.word-modal-close').onclick = closeWordModal;
    root.querySelector('.word-modal-back').onclick = popWordModal;
  }
  return root;
}

function openWordModal(word) {
  if (!word) return;
  const root = ensureModalRoot();
  root.style.display = 'block';
  if (STATE.wordStack.length >= MODAL_MAX) STATE.wordStack.shift();
  STATE.wordStack.push(normalizeWord(word));
  const backBtn = root.querySelector('.word-modal-back');
  backBtn.style.display = STATE.wordStack.length > 1 ? 'inline-block' : 'none';
  renderWordModalContent(normalizeWord(word));
}
function popWordModal() {
  if (STATE.wordStack.length <= 1) { closeWordModal(); return; }
  STATE.wordStack.pop();
  const prev = STATE.wordStack[STATE.wordStack.length - 1];
  const root = ensureModalRoot();
  const backBtn = root.querySelector('.word-modal-back');
  backBtn.style.display = STATE.wordStack.length > 1 ? 'inline-block' : 'none';
  renderWordModalContent(prev);
}
function closeWordModal() {
  const root = $('#wordModal');
  if (root) root.style.display = 'none';
  STATE.wordStack = [];
  stopSpeaking();
}

async function renderWordModalContent(word) {
  const root = ensureModalRoot();
  const body = root.querySelector('.word-modal-body');
  
  // 즉시 캐시 조회 (3단계)
  let data = null;
  // 1. 현재 문서 wordData
  if (STATE.currentDoc?.wordData?.[word]) data = STATE.currentDoc.wordData[word];
  // 2. 메모리 캐시
  else if (STATE.wordCache[word]) data = STATE.wordCache[word];
  // 3. IndexedDB
  else {
    try {
      const cached = await dbGet('words', word);
      if (cached?.data) {
        data = cached.data;
        STATE.wordCache[word] = data;
      }
    } catch {}
  }
  
  if (data) {
    renderWordData(body, data);
    return;
  }
  
  // 캐시 없음 → 즉시 호출
  body.innerHTML = '<div class="loading-mini">불러오는 중...</div>';
  pauseWarmup();
  try {
    const fetched = await fetchSingleWord(word);
    if (fetched) {
      STATE.wordCache[word] = fetched;
      try { await dbPut('words', { id: word, data: fetched, savedAt: Date.now() }); } catch {}
      if (STATE.currentDoc) {
        if (!STATE.currentDoc.wordData) STATE.currentDoc.wordData = {};
        STATE.currentDoc.wordData[word] = fetched;
        try { await dbPut('documents', STATE.currentDoc); } catch {}
      }
      renderWordData(body, fetched);
      refreshSentenceReadyMarks();
    } else {
      body.innerHTML = '<div class="word-err">단어 정보를 불러오지 못했습니다</div>';
    }
  } catch (err) {
    body.innerHTML = `<div class="word-err">조회 실패: ${escapeHtml(err.message)}</div>`;
  } finally {
    resumeWarmup();
  }
}

function startFollowRead(s, card) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('이 브라우저는 음성 인식을 지원하지 않습니다'); return; }
  const slot = card.querySelector('.sentence-slot');
  let resultBox = slot.querySelector('.follow-box');
  if (resultBox) resultBox.remove();
  resultBox = document.createElement('div');
  resultBox.className = 'follow-box';
  resultBox.innerHTML = '<div class="loading-mini">듣는 중... 문장을 읽으세요</div>';
  slot.appendChild(resultBox);
  const rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = (e) => {
    const spoken = e.results[0][0].transcript;
    showFollowReadResult(resultBox, s.text, spoken);
  };
  rec.onerror = (e) => {
    let msg = e.error;
    if (e.error === 'not-allowed') msg = '마이크 권한이 거부되었습니다. 주소창 자물쇠 → 마이크 → 허용';
    resultBox.innerHTML = `<div class="follow-err">${escapeHtml(msg)}</div>`;
  };
  try { rec.start(); }
  catch (err) { resultBox.innerHTML = `<div class="follow-err">${escapeHtml(err.message)}</div>`; }
}
function showFollowReadResult(box, original, spoken) {
  const origTokens = original.toLowerCase().replace(/[.,!?;:"'()]/g, '').split(/\s+/).filter(Boolean);
  const spokenTokens = spoken.toLowerCase().replace(/[.,!?;:"'()]/g, '').split(/\s+/).filter(Boolean);
  const spokenSet = new Set(spokenTokens);
  let correct = 0;
  const html = origTokens.map(t => {
    const ok = spokenSet.has(t);
    if (ok) correct++;
    return `<span class="${ok ? 'fr-ok' : 'fr-no'}">${escapeHtml(t)}</span>`;
  }).join(' ');
  const pct = origTokens.length > 0 ? Math.round((correct / origTokens.length) * 100) : 0;
  box.innerHTML = `<div class="fr-score">정확도 ${pct}%</div>
    <div class="fr-spoken">인식: ${escapeHtml(spoken)}</div>
    <div class="fr-compare">${html}</div>`;
}

async function handleKoreanAudioUpload(file) {
  if (!file) return;
  setStatus('한국어 음성 분석 중...');
  showProgress(10, '음성 → 텍스트 변환 중');
  try {
    const base64 = await fileToBase64(file);
    const mimeType = file.type || 'audio/mp4';
    const koreanText = await transcribeKoreanAudio(base64, mimeType);
    if (!koreanText) throw new Error('음성에서 텍스트를 추출하지 못했습니다');
    updateProgress(40, '영어로 번역 중');
    await translateAndAnalyzeKorean(koreanText);
  } catch (err) {
    hideProgress(); setStatus('');
    toast('음성 처리 실패: ' + err.message);
  }
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function transcribeKoreanAudio(base64Data, mimeType) {
  const body = {
    contents: [{
      role: 'user',
      parts: [
        { text: '이 오디오를 한국어로 정확히 받아쓰기 해주세요. 받아쓴 텍스트만 출력.' },
        { inline_data: { mime_type: mimeType, data: base64Data } }
      ]
    }],
    generationConfig: { temperature: 0.2, maxOutputTokens: 4096 }
  };
  const result = await callGemini(body);
  return result.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
}
async function translateAndAnalyzeKorean(koreanText) {
  const prompt = `Translate the Korean text to American English (natural, no slang). Return strict JSON:
{"korean":"원문","literal":"literal English","natural":"natural English"}

Korean:
${koreanText}`;
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.4, maxOutputTokens: 4096, responseMimeType: 'application/json' }
  };
  updateProgress(60, '영어 번역 중');
  const result = await callGemini(body);
  const txt = result.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
  const parsed = safeJsonParse(txt, {});
  renderKoreanResult(parsed);
  const target = parsed.natural || parsed.literal;
  if (target) await analyzeText(target, { sourceType: 'korean', title: titleFromText(parsed.korean || koreanText) });
}
function renderKoreanResult(data) {
