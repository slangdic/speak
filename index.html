<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Thinking Skills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root {
  --base: 16px;
  --bg: #f5efe6;
  --bg-soft: #ede5d5;
  --card: #ffffff;
  --border: #e3dccf;
  --text: #3d4a3d;
  --text-soft: #6b7568;
  --muted: #9aa097;
  --sage: #a8c4a2;
  --sage-dark: #8aab83;
  --sage-soft: #d4e3ce;
  --cream: #f0e6d2;
  --warm: #e8d9b8;
  --yellow-soft: #faf3dc;
  --danger: #d68a8a;
  --danger-dark: #b56e6e;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: var(--base);
  line-height: 1.65;
}
button { font-family: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 1rem; }

/* Header */
.app-header {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg);
  padding: 14px 18px;
  display: flex; align-items: center; justify-content: space-between;
}
.app-title { 
  font-size: 1.15rem; font-weight: 700; margin: 0; 
  color: var(--text); letter-spacing: 0.5px;
}
.hamburger-btn {
  background: var(--card); border: 1px solid var(--border);
  padding: 8px 14px; border-radius: 18px;
  font-size: 0.88rem; color: var(--text-soft);
}

/* Container */
.app-container {
  max-width: 800px; margin: 0 auto;
  padding: 8px 16px 80px;
}

/* Cards */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 14px;
}

/* Input Card */
.input-card .url-input {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 12px;
  background: var(--bg-soft);
  color: var(--text);
}
.url-input:focus { outline: none; border-color: var(--sage); background: white; }
.input-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-primary {
  background: var(--sage); color: white;
  border: none; padding: 11px 20px;
  border-radius: 20px; font-weight: 600;
  font-size: 0.92rem;
}
.btn-primary:hover { background: var(--sage-dark); }
.btn-secondary {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border);
  padding: 11px 18px; border-radius: 20px;
  font-size: 0.92rem;
}
.btn-secondary:hover { background: var(--bg-soft); }
.btn-save {
  background: var(--warm); color: var(--text);
  border: none; padding: 11px 18px;
  border-radius: 20px; font-weight: 600;
  font-size: 0.92rem;
}
.btn-save:hover { background: #ddc89e; }
.file-label {
  display: inline-block;
  background: var(--card); color: var(--text);
  border: 1px solid var(--border);
  padding: 11px 18px; border-radius: 20px;
  cursor: pointer; font-size: 0.92rem;
}
.file-label input { display: none; }

/* Korean Input Card */
.kr-input-card { display: none; }
.kr-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
.rec-bar-wrap {
  width: 100%; height: 8px;
  background: var(--bg-soft); border-radius: 4px;
  overflow: hidden; margin: 8px 0;
}
.rec-bar { height: 100%; width: 0%; background: var(--danger); transition: width 0.2s; }
.rec-timer { font-family: monospace; color: var(--text-soft); }
.kr-result-block {
  background: var(--bg-soft);
  border-radius: 12px;
  padding: 14px;
  margin-top: 10px;
}
.kr-label {
  font-size: 0.82rem; color: var(--text-soft);
  font-weight: 600; margin-bottom: 6px;
}
.kr-text { word-break: keep-all; }

/* Progress */
.progress-card { display: none; }
.progress-bar-wrap {
  width: 100%; height: 8px;
  background: var(--bg-soft); border-radius: 4px;
  overflow: hidden;
}
.progress-bar {
  height: 100%; width: 0%;
  background: var(--sage);
  transition: width 0.3s;
}
.progress-text { margin-top: 8px; font-size: 0.88rem; color: var(--text-soft); }

/* Sentence Card */
.sentence-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 12px;
}
.sentence-header {
  display: flex; align-items: baseline; gap: 8px;
  margin-bottom: 8px;
}
.sentence-num {
  font-size: 0.85rem; font-weight: 700;
  color: var(--sage-dark);
  background: var(--sage-soft);
  padding: 2px 10px;
  border-radius: 12px;
  flex-shrink: 0;
}
.sentence-text {
  font-size: 1.05rem;
  line-height: 1.75;
  word-break: keep-all;
  margin-bottom: 12px;
}
.sentence-controls {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.btn-ctrl {
  background: var(--bg-soft);
  border: none;
  padding: 7px 14px;
  border-radius: 16px;
  font-size: 0.85rem;
  color: var(--text);
}
.btn-ctrl:hover { background: var(--sage-soft); }
.btn-ctrl[data-state="stop"] {
  background: var(--danger); color: white;
}
.btn-ctrl[data-state="stop"]:hover { background: var(--danger-dark); }
.sentence-slot { margin-top: 10px; }

.translation-box, .hard-box, .follow-box {
  background: var(--bg-soft);
  border-radius: 12px;
  padding: 12px 14px;
  margin-top: 10px;
}
.trans-row {
  margin: 8px 0;
  word-break: keep-all;
  display: flex; align-items: baseline; gap: 8px;
  flex-wrap: wrap;
}
.trans-label {
  display: inline-block;
  font-size: 0.75rem; font-weight: 700;
  color: var(--sage-dark);
  background: white;
  padding: 2px 10px; border-radius: 10px;
  flex-shrink: 0;
}
.hard-item {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.hard-item:last-child { border-bottom: none; }
.hard-type {
  display: inline-block;
  font-weight: 700;
  color: white;
  background: var(--sage);
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 0.8rem;
  margin-right: 8px;
  margin-bottom: 4px;
}
.hard-target {
  font-weight: 700;
  color: var(--sage-dark);
  font-family: 'Georgia', serif;
}
.hard-detail { margin-top: 4px; line-height: 1.65; }

.fr-score {
  font-weight: 700;
  color: var(--sage-dark);
  margin-bottom: 6px;
  font-size: 1rem;
}
.fr-spoken { color: var(--text-soft); font-size: 0.9rem; margin-bottom: 6px; }
.fr-ok { color: var(--sage-dark); font-weight: 600; }
.fr-no { color: var(--danger-dark); text-decoration: line-through; }
.follow-err { color: var(--danger-dark); }

/* Words */
.word-token {
  cursor: pointer;
  border-bottom: 1px dotted transparent;
  transition: all 0.15s;
}
.word-token:hover {
  background: var(--yellow-soft);
  border-bottom-color: var(--warm);
}

/* Buttons mini */
.btn-mini {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 0.75rem;
  margin-left: 4px;
  color: var(--text-soft);
  cursor: pointer;
}
.btn-mini:hover { background: var(--sage); color: white; border-color: var(--sage); }

.loading-mini { color: var(--text-soft); font-size: 0.9rem; padding: 8px 0; }

/* Side Panel */
.side-panel {
  position: fixed; top: 0; right: -360px;
  width: 360px; max-width: 88vw;
  height: 100vh;
  background: var(--card);
  border-left: 1px solid var(--border);
  transition: right 0.3s;
  z-index: 200;
  overflow-y: auto;
  padding: 18px;
}
.side-panel.open { right: 0; }
.side-panel h3 {
  margin: 18px 0 10px;
  font-size: 1rem;
  color: var(--sage-dark);
  font-weight: 700;
}
.side-close {
  position: sticky; top: 0; float: right;
  background: var(--bg-soft); border: none;
  width: 32px; height: 32px;
  border-radius: 50%;
  font-size: 1rem; font-weight: 700;
  color: var(--text-soft);
  z-index: 10;
}
.setting-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.setting-row label { flex: 1; color: var(--text); }
.setting-row select {
  background: var(--bg-soft); border: 1px solid var(--border);
  padding: 6px 10px; border-radius: 10px; color: var(--text);
}
.font-controls { display: flex; gap: 8px; align-items: center; }
.font-controls button {
  width: 34px; height: 34px;
  border: none;
  background: var(--bg-soft);
  border-radius: 10px; font-size: 1.1rem;
  color: var(--text);
}
.font-controls span { min-width: 40px; text-align: center; font-weight: 600; }

/* Voice gender selector */
.gender-toggle {
  display: flex; gap: 0;
  background: var(--bg-soft);
  border-radius: 20px;
  padding: 4px;
  margin-top: 6px;
}
.gender-toggle button {
  flex: 1; padding: 8px 14px;
  border: none; background: transparent;
  border-radius: 16px;
  font-weight: 600; color: var(--text-soft);
  font-size: 0.9rem;
}
.gender-toggle button.active {
  background: var(--sage); color: white;
}

/* Speed grid */
.speed-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
  margin-top: 8px;
}
.speed-btn {
  padding: 8px 0;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 12px;
  font-size: 0.85rem;
  color: var(--text);
}
.speed-btn.active {
  background: var(--sage); color: white; border-color: var(--sage);
}

/* Document list (side panel) */
.doc-toolbar {
  display: flex; gap: 6px; margin: 8px 0;
  flex-wrap: wrap;
}
.doc-toolbar input {
  flex: 1; min-width: 100px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--bg-soft);
  font-size: 0.88rem;
}
.doc-toolbar select {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--bg-soft);
  font-size: 0.85rem;
}
.doc-toolbar-actions {
  display: flex; gap: 6px; margin-bottom: 8px;
  flex-wrap: wrap;
}
.doc-toolbar-actions button {
  padding: 6px 12px;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 12px;
  font-size: 0.82rem;
  color: var(--text-soft);
}
.doc-toolbar-actions button:hover { background: var(--bg-soft); }
.doc-toolbar-actions .btn-danger {
  color: var(--danger-dark);
  border-color: var(--danger);
}

.doc-item {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 8px;
  position: relative;
  background: var(--card);
  display: flex; gap: 10px;
  align-items: flex-start;
}
.doc-item input[type="checkbox"] {
  margin-top: 4px;
  flex-shrink: 0;
}
.doc-item-body { flex: 1; cursor: pointer; min-width: 0; }
.doc-title {
  font-weight: 600; word-break: keep-all;
  color: var(--text); margin-bottom: 4px;
}
.doc-meta {
  font-size: 0.78rem;
  color: var(--text-soft);
}
.doc-badge {
  display: inline-block;
  font-size: 0.7rem;
  background: var(--warm); color: var(--text);
  padding: 1px 8px; border-radius: 8px;
  margin-left: 4px;
}
.doc-actions {
  display: flex; gap: 4px; margin-top: 8px;
  flex-wrap: wrap;
}
.doc-actions button {
  padding: 4px 10px;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 10px;
  font-size: 0.75rem;
  color: var(--text-soft);
}
.doc-actions button:hover { background: var(--bg-soft); }

/* Word Modal */
.word-modal-root {
  position: fixed; inset: 0;
  z-index: 500;
}
.word-modal-backdrop {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.45);
}
.word-modal-panel {
  position: absolute;
  top: 5%; left: 50%;
  transform: translateX(-50%);
  width: 92%; max-width: 600px;
  max-height: 90vh;
  background: var(--card);
  border-radius: 18px;
  padding: 20px;
  overflow-y: auto;
}
.word-modal-close {
  position: sticky; top: 0; float: right;
  background: rgba(61, 74, 61, 0.4);
  color: white;
  border: none; width: 34px; height: 34px;
  border-radius: 50%;
  font-weight: 700; font-size: 0.95rem;
  z-index: 10;
  backdrop-filter: blur(4px);
}
.word-modal-back {
  background: var(--bg-soft);
  border: none;
  padding: 6px 14px; border-radius: 14px;
  font-size: 0.85rem;
  color: var(--text);
  margin-bottom: 10px;
}
.word-modal-body { clear: both; }
.wm-header {
  display: flex; align-items: center; gap: 10px;
  flex-wrap: wrap;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.wm-word {
  font-size: 1.7rem; font-weight: 700;
  color: var(--text);
}
.wm-ipa {
  color: var(--text-soft);
  font-family: 'Georgia', serif;
  font-style: italic;
}
.wm-row {
  padding: 8px 0;
  display: flex; gap: 10px; align-items: baseline;
  flex-wrap: wrap;
}
.wm-en-row { word-break: keep-all; }
.wm-label {
  font-size: 0.78rem; font-weight: 700;
  color: var(--sage-dark);
  background: var(--sage-soft);
  padding: 3px 10px; border-radius: 10px;
  flex-shrink: 0;
}
.wm-val { flex: 1; min-width: 0; }
.wm-section {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}
.wm-title {
  font-weight: 700; font-size: 0.95rem;
  margin-bottom: 10px; color: var(--sage-dark);
}
.wm-morpheme { padding: 6px 0; word-break: keep-all; }
.wm-mtype {
  display: inline-block; min-width: 60px;
  font-size: 0.78rem;
  color: white;
  background: var(--sage);
  padding: 1px 8px;
  border-radius: 8px;
  margin-right: 6px;
}
.wm-mtext {
  font-weight: 700;
  margin-right: 8px;
  font-family: 'Georgia', serif;
}
.wm-mkr { color: var(--text-soft); }
.wm-vform {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 0;
}
.wm-vlabel {
  display: inline-block; min-width: 80px;
  font-size: 0.85rem;
  color: var(--text-soft);
  font-weight: 600;
}
.wm-vval { font-weight: 600; }
.wm-related {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.wm-related:last-child { border-bottom: none; }
.wm-related-head {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 4px;
}
.wm-related-word {
  font-weight: 700;
  color: var(--sage-dark);
  font-size: 1.05rem;
}
.wm-related-mean, .wm-related-ex {
  margin: 6px 0 4px 8px;
  font-size: 0.92rem;
  word-break: keep-all;
  color: var(--text);
}
.wm-related-ex { color: var(--text-soft); font-style: italic; }
.wm-example {
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.wm-example:last-child { border-bottom: none; }
.wm-ex-head {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 6px;
}
.wm-ex-label {
  font-size: 0.75rem; font-weight: 700;
  color: white;
  background: var(--sage);
  padding: 2px 10px; border-radius: 10px;
}
.wm-ex-en, .wm-ex-kr { margin: 4px 0; word-break: keep-all; }
.wm-ex-kr { color: var(--text-soft); margin-top: 6px; }
.word-err { color: var(--danger-dark); padding: 12px; }

/* Toast */
.toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%);
  background: rgba(61, 74, 61, 0.92);
  color: white;
  padding: 11px 20px;
  border-radius: 20px;
  z-index: 1000;
  display: none;
  font-size: 0.9rem;
  max-width: 90%;
}
.toast.show { display: block; }

/* Status */
.status-text {
  font-size: 0.85rem; color: var(--text-soft);
  padding: 4px 0;
}

/* Scroll Top Button (40% opacity) */
.scroll-top-btn {
  position: fixed;
  bottom: 24px; right: 24px;
  width: 50px; height: 50px;
  border-radius: 50%;
  background: rgba(168, 196, 162, 0.4);
  color: var(--text);
  border: none;
  display: flex; align-items: center; justify-content: center;
  z-index: 90;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  backdrop-filter: blur(6px);
}
.scroll-top-btn:hover { background: rgba(168, 196, 162, 0.7); }

/* Hidden YouTube Player */
#ytPlayerContainer {
  position: fixed;
  bottom: -200px; left: -200px;
  width: 1px; height: 1px;
  opacity: 0; pointer-events: none;
}

/* Responsive */
@media (max-width: 600px) {
  .app-container { padding: 8px 12px 80px; }
  .card { padding: 14px; }
  .wm-word { font-size: 1.45rem; }
  .speed-grid { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>

<header class="app-header">
  <h1 class="app-title">THINKING SKILLS</h1>
  <button id="hamburgerBtn" class="hamburger-btn">설정</button>
</header>

<main class="app-container">
  <div id="inputCard" class="card input-card">
    <input id="urlInput" type="text" class="url-input" placeholder="YouTube URL 또는 텍스트 입력">
    <div class="input-row">
      <button id="analyzeBtn" class="btn-primary">분석 시작</button>
      <label class="file-label">
        파일 선택
        <input id="fileInput" type="file" accept=".txt,.pdf,.docx,.doc,image/*">
      </label>
      <button id="saveBtn" class="btn-save" style="display:none">저장</button>
    </div>
    <div id="statusText" class="status-text"></div>
  </div>
  
  <div id="koreanInputCard" class="card kr-input-card">
    <h3 style="margin-top:0">한국어 → 영어</h3>
    <div class="kr-row">
      <label class="file-label">
        음성 파일 업로드
        <input id="koreanAudioInput" type="file" accept="audio/*">
      </label>
    </div>
    <div class="kr-row">
      <button id="recStartBtn" class="btn-primary">녹음 시작</button>
      <button id="recStopBtn" class="btn-secondary" style="display:none; background:var(--danger); color:white;">녹음 정지</button>
      <span id="recTimer" class="rec-timer">00:00 / 05:00</span>
    </div>
    <div class="rec-bar-wrap"><div id="recBar" class="rec-bar"></div></div>
    <div id="koreanResultBox" style="display:none"></div>
  </div>
  
  <div id="progressCard" class="card progress-card">
    <div class="progress-bar-wrap"><div id="progressBar" class="progress-bar"></div></div>
    <div id="progressText" class="progress-text"></div>
    <button id="cancelBtn" class="btn-secondary" style="margin-top:10px;">취소</button>
  </div>
  
  <div id="sentenceList"></div>
</main>

<aside id="sidePanel" class="side-panel">
  <button id="sidePanelClose" class="side-close" aria-label="닫기">X</button>
  
  <h3>글자 크기</h3>
  <div class="setting-row">
    <label>크기</label>
    <div class="font-controls">
      <button id="fontMinus">−</button>
      <span id="fontSizeLabel">16</span>
      <button id="fontPlus">+</button>
    </div>
  </div>
  
  <h3>목소리 설정</h3>
  <div class="gender-toggle" id="genderToggle">
    <button data-gender="female" class="active">여성</button>
    <button data-gender="male">남성</button>
  </div>
  
  <h3 id="speedTitle">재생 속도: 1.0x</h3>
  <div class="speed-grid" id="speedGrid"></div>
  
  <h3>재생 모드</h3>
  <div class="setting-row">
    <label for="voiceModeSelect">소스</label>
    <select id="voiceModeSelect">
      <option value="tts">TTS</option>
      <option value="original">원음</option>
    </select>
  </div>
  
  <h3>한국어 → 영어 모드</h3>
  <div class="setting-row">
    <label for="koreanModeToggle">활성화</label>
    <input id="koreanModeToggle" type="checkbox">
  </div>

<script>
/* ============================================================
   STATE / 유틸
   ============================================================ */
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));

const STATE = {
  fontSize: 16,
  speed: 1.0,
  voiceMode: 'tts',
  voiceGender: 'female',
  voices: { female: null, male: null },
  db: null,
  geminiQueue: [],
  geminiBusy: false,
  geminiLast: 0,
  sentences: [],
  analyzing: false,
  currentDocId: null,
  currentVideoId: null,
  ytSegments: [],
  ytPlayer: null,
  sourceType: null,
  currentFullText: '',
  currentRawFile: null,
  wordCache: {},
  wordStack: [],
  koreanMode: false,
  docSearch: '',
  docSort: 'recent',
  docSelected: new Set(),
  activePlayBtn: null
};

function toast(msg, ms = 2500) {
  const el = $('#toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), ms);
}
function setStatus(msg) {
  const el = $('#statusText');
  if (el) el.textContent = msg || '';
}
function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ============================================================
   IndexedDB
   ============================================================ */
const DB_NAME = 'thinking_skills_db';
const DB_VERSION = 3;

function dbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('documents')) {
        db.createObjectStore('documents', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('words')) {
        db.createObjectStore('words', { keyPath: 'id' });
      }
      if (!db.objectStoreNames.contains('files')) {
        db.createObjectStore('files', { keyPath: 'docId' });
      }
    };
    req.onsuccess = () => { STATE.db = req.result; resolve(req.result); };
    req.onerror = () => reject(req.error);
  });
}
function dbPut(store, value) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(value);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}
function dbGet(store, key) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function dbAll(store) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((resolve, reject) => {
    if (!STATE.db) return reject(new Error('DB not opened'));
    const tx = STATE.db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).delete(key);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

/* ============================================================
   Gemini 큐
   ============================================================ */
const GEMINI_MIN_INTERVAL = 10000;

function callGemini(body) {
  return new Promise((resolve, reject) => {
    STATE.geminiQueue.push({ body, resolve, reject });
    processGeminiQueue();
  });
}
async function processGeminiQueue() {
  if (STATE.geminiBusy) return;
  if (STATE.geminiQueue.length === 0) return;
  STATE.geminiBusy = true;
  while (STATE.geminiQueue.length > 0) {
    const wait = Math.max(0, GEMINI_MIN_INTERVAL - (Date.now() - STATE.geminiLast));
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    const job = STATE.geminiQueue.shift();
    STATE.geminiLast = Date.now();
    try {
      const res = await fetch('/api/gemini', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(job.body)
      });
      if (res.status === 429 || res.status === 503) {
        STATE.geminiQueue.unshift(job);
        await new Promise(r => setTimeout(r, 15000));
        continue;
      }
      if (!res.ok) {
        const errTxt = await res.text();
        job.reject(new Error(`서버 ${res.status}: ${errTxt.slice(0, 150)}`));
        continue;
      }
      const data = await res.json();
      job.resolve(data);
    } catch (err) {
      job.reject(err);
    }
  }
  STATE.geminiBusy = false;
}

// 즉시 호출 (큐 우회) - 단어장/번역/안들리지/예문번역용
async function callGeminiDirect(body) {
  const res = await fetch('/api/gemini', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const errTxt = await res.text();
    throw new Error(`${res.status}: ${errTxt.slice(0, 120)}`);
  }
  return await res.json();
}

/* ============================================================
   TTS - 미국식 영어 강제 + 성별 명확화
   ============================================================ */
const US_FEMALE_NAMES = [
  'Samantha', 'Allison', 'Ava', 'Susan',
  'Google US English',
  'Microsoft Aria', 'Microsoft Jenny', 'Microsoft Zira', 'Microsoft Michelle',
  'Microsoft Ana', 'Microsoft Elizabeth',
  'en-US-AriaNeural', 'en-US-JennyNeural', 'en-US-MichelleNeural'
];
const US_MALE_NAMES = [
  'Alex', 'Fred', 'Aaron', 'Tom', 'Bruce',
  'Microsoft Guy', 'Microsoft Christopher', 'Microsoft Davis',
  'Microsoft Eric', 'Microsoft Roger', 'Microsoft Steffan',
  'en-US-GuyNeural', 'en-US-DavisNeural', 'en-US-ChristopherNeural'
];
// 영국식 - 명시 제외
const UK_BLOCKLIST = /Daniel|Oliver|Arthur|Kate|Serena|Moira|Tessa|Karen|Veena|Rishi|Sangeeta/i;

function pickVoice(genderPref) {
  const all = speechSynthesis.getVoices();
  if (!all.length) return null;
  
  const usVoices = all.filter(v =>
    /en[-_]US/i.test(v.lang) || /US English/i.test(v.name)
  );
  const names = genderPref === 'male' ? US_MALE_NAMES : US_FEMALE_NAMES;
  
  // 1. 정확한 이름 매칭 (en-US 중)
  for (const wanted of names) {
    const v = usVoices.find(x => x.name === wanted || x.name.includes(wanted));
    if (v && !UK_BLOCKLIST.test(v.name)) return v;
  }
  // 2. en-US 중 영국식 제외하고 첫 번째
  const fallbackUS = usVoices.find(v => !UK_BLOCKLIST.test(v.name));
  if (fallbackUS) return fallbackUS;
  // 3. 전체에서 en으로 시작, 영국식 제외
  const enAny = all.find(v => /^en/i.test(v.lang) && !UK_BLOCKLIST.test(v.name));
  return enAny || null;
}

function loadVoices() {
  STATE.voices.female = pickVoice('female');
  STATE.voices.male = pickVoice('male');
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function warmupTTS() {
  if (!('speechSynthesis' in window)) return;
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
  } catch {}
}

function speak(text, opts = {}) {
  if (!('speechSynthesis' in window)) { toast('TTS 미지원 브라우저'); return; }
  if (!text) return;
  speechSynthesis.cancel();
  
  const utter = new SpeechSynthesisUtterance(text);
  const isEnglish = !opts.lang || opts.lang.startsWith('en');
  utter.lang = isEnglish ? 'en-US' : opts.lang;
  utter.rate = isEnglish ? STATE.speed : 1;
  
  if (isEnglish) {
    const v = STATE.voiceGender === 'male' ? STATE.voices.male : STATE.voices.female;
    if (v) utter.voice = v;
  }
  
  if (opts.onEnd) utter.onend = opts.onEnd;
  utter.onerror = () => { if (opts.onEnd) opts.onEnd(); };
  speechSynthesis.speak(utter);
}
function stopSpeaking() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function applyPlaybackChange() {
  if (STATE.ytPlayer && typeof STATE.ytPlayer.setPlaybackRate === 'function') {
    try { STATE.ytPlayer.setPlaybackRate(nearestYtRate(STATE.speed)); } catch {}
  }
}

/* ============================================================
   YouTube
   ============================================================ */
let ytApiReady = false;
let ytApiQueue = [];
function loadYouTubeApi() {
  if (ytApiReady || window.YT?.Player) { ytApiReady = true; return; }
  if (window._ytApiLoading) return;
  window._ytApiLoading = true;
  window.onYouTubeIframeAPIReady = () => {
    ytApiReady = true;
    ytApiQueue.forEach(fn => fn()); ytApiQueue = [];
  };
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(s);
}
function whenYtReady(fn) {
  if (ytApiReady && window.YT?.Player) fn();
  else { ytApiQueue.push(fn); loadYouTubeApi(); }
}
function initYouTubePlayer(videoId) {
  whenYtReady(() => {
    if (STATE.ytPlayer && typeof STATE.ytPlayer.cueVideoById === 'function') {
      try { STATE.ytPlayer.cueVideoById(videoId); return; } catch {}
    }
    STATE.ytPlayer = new YT.Player('ytPlayer', {
      videoId,
      playerVars: { controls: 0, disablekb: 1, fs: 0 },
      events: { onReady: () => updateOriginalModeAvailability() }
    });
  });
}
function nearestYtRate(rate) {
  const allowed = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
  let best = 1, diff = Infinity;
  for (const r of allowed) {
    const d = Math.abs(r - rate);
    if (d < diff) { diff = d; best = r; }
  }
  return best;
}
function playOriginal(start, end, onEnd) {
  if (!STATE.ytPlayer) { if (onEnd) onEnd(); return; }
  try {
    STATE.ytPlayer.setPlaybackRate(nearestYtRate(STATE.speed));
    STATE.ytPlayer.seekTo(start, true);
    STATE.ytPlayer.playVideo();
    const dur = (end - start) * 1000 / STATE.speed;
    setTimeout(() => {
      try { STATE.ytPlayer.pauseVideo(); } catch {}
      if (onEnd) onEnd();
    }, dur);
  } catch (err) {
    if (onEnd) onEnd();
  }
}
function updateOriginalModeAvailability() {
  const select = $('#voiceModeSelect');
  if (!select) return;
  const opt = select.querySelector('option[value="original"]');
  if (!opt) return;
  const available = !!(STATE.ytPlayer && STATE.ytSegments?.length > 0);
  opt.disabled = !available;
  if (!available && STATE.voiceMode === 'original') {
    STATE.voiceMode = 'tts';
    select.value = 'tts';
  }
}

/* ============================================================
   입력 처리
   ============================================================ */
async function handleAnalyze() {
  const input = $('#urlInput')?.value?.trim();
  if (!input) { toast('URL 또는 텍스트를 입력하세요'); return; }
  if (/youtube\.com|youtu\.be/.test(input)) {
    await handleYouTube(input);
  } else if (/^https?:\/\//.test(input)) {
    toast('YouTube URL 또는 텍스트를 입력하세요');
  } else {
    STATE.currentRawFile = null;
    await analyzeText(input, { sourceType: 'text', title: titleFromText(input) });
  }
}

async function handleYouTube(url) {
  setStatus('YouTube 자막 가져오는 중...');
  showProgress(0, '자막 추출 중');
  try {
    const res = await fetch(`/api/youtube?url=${encodeURIComponent(url)}`);
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`서버 오류 ${res.status}: ${errText.slice(0, 200)}`);
    }
    const data = await res.json();
    if (!data.fullText) throw new Error('자막/전사 결과가 비어있습니다');
    STATE.currentVideoId = data.videoId;
    STATE.ytSegments = data.segments || [];
    STATE.sourceType = 'youtube';
    STATE.currentRawFile = null;
    if (data.segments?.length > 0) initYouTubePlayer(data.videoId);
    const title = (data.title && titleFromText(data.title)) || titleFromText(data.fullText);
    await analyzeText(data.fullText, {
      sourceType: 'youtube',
      videoId: data.videoId,
      segments: data.segments || [],
      title
    });
  } catch (err) {
    hideProgress();
    setStatus('');
    toast('YouTube 처리 실패: ' + err.message);
  }
}

async function handleFile(file) {
  if (!file) return;
  const name = file.name.toLowerCase();
  setStatus(`${file.name} 처리 중...`);
  showProgress(0, '파일 분석 중');
  try {
    let text = '';
    if (name.endsWith('.txt')) {
      text = await file.text();
    } else if (name.endsWith('.pdf')) {
      text = await extractPdfText(file);
    } else if (name.endsWith('.docx') || name.endsWith('.doc')) {
      const buf = await file.arrayBuffer();
      const result = await mammoth.extractRawText({ arrayBuffer: buf });
      text = result.value;
    } else if (file.type.startsWith('image/')) {
      const result = await Tesseract.recognize(file, 'eng+kor', {
        logger: m => {
          if (m.status === 'recognizing text') {
            updateProgress(m.progress * 100, 'OCR 인식 중');
          }
        }
      });
      text = result.data.text;
    } else {
      throw new Error('지원하지 않는 파일 형식');
    }
    if (!text.trim()) throw new Error('텍스트를 추출하지 못했습니다');
    STATE.sourceType = 'file';
    STATE.currentRawFile = file;
    await analyzeText(text, {
      sourceType: 'file',
      title: titleFromText(file.name.replace(/\.[^.]+$/, '')),
      fileName: file.name,
      fileType: file.type
    });
  } catch (err) {
    hideProgress();
    setStatus('');
    toast('파일 처리 실패: ' + err.message);
  }
}

async function extractPdfText(file) {
  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    updateProgress((i / pdf.numPages) * 50, `PDF ${i}/${pdf.numPages} 페이지`);
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it => it.str).join(' ') + '\n';
  }
  return text;
}

function titleFromText(text) {
  if (!text) return '제목 없음';
  const words = text.trim().replace(/\s+/g, ' ').split(' ').slice(0, 3);
  return words.join(' ') || '제목 없음';
}

function splitSentences(text) {
  const cleaned = text.replace(/\s+/g, ' ').trim();
  const raw = cleaned.match(/[^.!?]+[.!?]+|\S+$/g) || [];
  return raw.map(s => s.trim()).filter(s => s.length > 2);
}

/* ============================================================
   분석
   ============================================================ */
async function analyzeText(text, meta = {}) {
  STATE.sentences = [];
  STATE.analyzing = true;
  STATE.currentFullText = text;
  
  const container = $('#sentenceList');
  if (container) container.innerHTML = '';
  
  const sentences = splitSentences(text);
  if (sentences.length === 0) {
    hideProgress();
    toast('분석할 문장이 없습니다');
    return;
  }
  
  const docId = Date.now();
  STATE.currentDocId = docId;
  const docRecord = {
    id: docId,
    title: meta.title || titleFromText(text),
    sourceType: meta.sourceType || 'text',
    videoId: meta.videoId || null,
    segments: meta.segments || [],
    fullText: text,
    fileName: meta.fileName || null,
    fileType: meta.fileType || null,
    sentences: [],
    createdAt: new Date().toISOString()
  };
  await dbPut('documents', docRecord);
  
  // 원본 파일 저장
  if (STATE.currentRawFile) {
    try {
      await dbPut('files', {
        docId,
        blob: STATE.currentRawFile,
        name: STATE.currentRawFile.name,
        type: STATE.currentRawFile.type
      });
    } catch (e) { console.warn('파일 저장 실패', e); }
  }
  
  // 저장 버튼 노출
  const saveBtn = $('#saveBtn');
  if (saveBtn) saveBtn.style.display = 'inline-block';
  
  const CHUNK = 8;
  const total = sentences.length;
  let done = 0;
  
  for (let i = 0; i < sentences.length; i += CHUNK) {
    if (!STATE.analyzing) break;
    const chunk = sentences.slice(i, i + CHUNK);
    updateProgress((done / total) * 100, `${done}/${total} 문장 분석 중`);
    try {
      const analyzed = await analyzeChunk(chunk);
      analyzed.forEach((s, idx) => {
        const sentenceObj = {
          id: `${docId}_${i + idx}`,
          index: i + idx,
          number: i + idx + 1,
          ...s
        };
        STATE.sentences.push(sentenceObj);
        renderSentenceBlock(sentenceObj);
      });
      done += chunk.length;
      docRecord.sentences = STATE.sentences;
      await dbPut('documents', docRecord);
    } catch (err) {
      console.error('chunk 분석 실패:', err);
      toast(`청크 분석 실패 (${i}~${i + CHUNK})`);
    }
  }
  
  STATE.analyzing = false;
  hideProgress();
  updateOriginalModeAvailability();
  setStatus(`분석 완료 (${STATE.sentences.length}문장)`);
  refreshDocList();
}

async function analyzeChunk(sentences) {
  const prompt = `You are an English-Korean translator. For each English sentence below, return BOTH a literal translation AND a natural translation in Korean. NEVER leave translations empty.

Return EXACTLY this JSON array structure (no other text):
[
  {
    "text": "exact original English sentence",
    "translationLiteral": "직역 한국어 번역 (반드시 작성)",
    "translationNatural": "자연스러운 한국어 의역 (반드시 작성)",
    "words": ["meaningful", "words", "only"]
  }
]

Rules:
- Both translation fields MUST be non-empty Korean text
- "words" excludes articles (a, an, the) and basic prepositions
- Array order MUST match input order
- Number of objects: exactly ${sentences.length}

Sentences:
${sentences.map((s, i) => `${i + 1}. ${s}`).join('\n')}`;
  
  const body = {
    contents: [{ role: 'user', parts: [{ text: prompt }] }],
    generationConfig: {
      temperature: 0.4,
      maxOutputTokens: 4096,
      responseMimeType: 'application/json'
    }
  };
  
  const result = await callGemini(body);
  const textOut = result.candidates?.[0]?.content?.parts?.[0]?.text || '[]';
  let parsed;
  try { parsed = JSON.parse(textOut); } catch { parsed = []; }
  if (!Array.isArray(parsed)) parsed = [];
  while (parsed.length < sentences.length) {
    parsed.push({
      text: sentences[parsed.length],
      translationLiteral: '',
      translationNatural: '',
      words: sentences[parsed.length].split(/\s+/).filter(w => w.length > 1)
    });
  }
  return parsed.slice(0, sentences.length);
}

function showProgress(pct, msg) {
  const card = $('#progressCard');
  if (card) card.style.display = 'block';
  updateProgress(pct, msg);
}
function updateProgress(pct, msg) {
  const bar = $('#progressBar');
  const text = $('#progressText');
  if (bar) bar.style.width = `${Math.min(100, Math.max(0, pct))}%`;
  if (text) text.textContent = msg || '';
}
function hideProgress() {
  const card = $('#progressCard');
  if (card) card.style.display = 'none';
}

/* ============================================================
   한국어 → 영어
   ============================================================ */
function toggleKoreanMode(on) {
  STATE.koreanMode = on;
  const card = $('#koreanInputCard');
  const normalCard = $('#inputCard');
  if (card) card.style.display = on ? 'block' : 'none';
  if (normalCard) normalCard.style.display = on ? 'none' : 'block';
}

async function handleKoreanAudioUpload(file) {
  if (!file) return;
  setStatus('한국어 음성 분석 중...');
  showProgress(10, '음성 → 텍스트 변환 중');
  try {
    const base64 = await fileToBase64(file);
    const mimeType = file.type || 'audio/mp4';
    const koreanText = await transcribeKoreanAudio(base64, mimeType);
    if (!koreanText) throw new Error('음성에서 텍스트를 추출하지 못했습니다');
    updateProgress(40, '영어로 번역 중');
    await translateAndAnalyzeKorean(koreanText);
  } catch (err) {
    hideProgress();
    setStatus('');
    toast('음성 처리 실패: ' + err.message);
  }
}
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function transcribeKoreanAudio(base64Data, mimeType) {
  const body = {
    contents: [{
      role: 'user',
      parts: [
        { text: '이 오디오를 한국어로 정확히 받아쓰기 해주세요. 문장부호 포함, 받아쓴 텍스트만 출력.' },
        { inline_data: { mime_type: mimeType, data: base64Data } }
      ]
    }],
    generationConfig: { temperature: 0.2, maxOutputTokens: 4096 }
  };
  const result = await callGemini(body);
  return result.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
}

let recState = { recorder: null, chunks: [], startTime: 0, timerId: null };
const REC_MAX_SEC = 300;
async function startRecording() {
  if (recState.recorder) { toast('이미 녹음 중'); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
    recState.recorder = recorder;
    recState.chunks = [];
    recState.startTime = Date.now();
    recorder.ondataavailable = e => { if (e.data.size > 0) recState.chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(recState.chunks, { type: mime || 'audio/webm' });
      clearInterval(recState.timerId);
      resetRecUI();
      recState.recorder = null;
      const file = new File([blob], 'recording.webm', { type: blob.type });
      await handleKoreanAudioUpload(file);
    };
    recorder.start();
    const startBtn = $('#recStartBtn'), stopBtn = $('#recStopBtn');
    if (startBtn) startBtn.style.display = 'none';
    if (stopBtn) stopBtn.style.display = 'inline-block';
    recState.timerId = setInterval(() => {
      const elapsed = (Date.now() - recState.startTime) / 1000;
      const timer = $('#recTimer'), bar = $('#recBar');
      if (timer) timer.textContent = `${formatTime(elapsed)} / ${formatTime(REC_MAX_SEC)}`;
      if (bar) bar.style.width = `${(elapsed / REC_MAX_SEC) * 100}%`;
      if (elapsed >= REC_MAX_SEC) stopRecording();
    }, 200);
  } catch (err) {
    toast('마이크 권한 필요: ' + err.message);
  }
}
function stopRecording() {
  if (recState.recorder && recState.recorder.state !== 'inactive') {
    recState.recorder.stop();
  }
}
function resetRecUI() {
  const startBtn = $('#recStartBtn'), stopBtn = $('#recStopBtn');
  const timer = $('#recTimer'), bar = $('#recBar');
  if (startBtn) startBtn.style.display = 'inline-block';
  if (stopBtn) stopBtn.style.display = 'none';
  if (timer) timer.textContent = '00:00 / 05:00';
  if (bar) bar.style.width = '0%';
}
function formatTime(sec) {
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

    STATE.activePlayBtn = null;
  }

function toggleSentencePlay(s, btn) {
  if (btn.dataset.state === 'play') {
    // 다른 재생 중인 것 중지
    resetActivePlayBtn();
    stopSpeaking();
    if (STATE.ytPlayer?.pauseVideo) { try { STATE.ytPlayer.pauseVideo(); } catch {} }
    
    btn.textContent = '정지';
    btn.dataset.state = 'stop';
    STATE.activePlayBtn = btn;
    playSentence(s, () => {
      btn.textContent = '재생';
      btn.dataset.state = 'play';
      if (STATE.activePlayBtn === btn) STATE.activePlayBtn = null;
    });
  } else {
    stopSpeaking();
    if (STATE.ytPlayer?.pauseVideo) { try { STATE.ytPlayer.pauseVideo(); } catch {} }
    btn.textContent = '재생';
    btn.dataset.state = 'play';
    if (STATE.activePlayBtn === btn) STATE.activePlayBtn = null;
  }

function playSentence(s, onEnd) {
  if (STATE.voiceMode === 'original' && STATE.ytSegments?.length > 0 && STATE.ytPlayer) {
    const seg = findSegmentForSentence(s);
    if (seg) { playOriginal(seg.start, seg.end, onEnd); return; }
  }
  speak(s.text, { onEnd });
}
function findSegmentForSentence(s) {
  if (!STATE.ytSegments) return null;
  const target = s.text.toLowerCase().slice(0, 30);
  for (const seg of STATE.ytSegments) {
    if (seg.text.toLowerCase().includes(target.slice(0, 15))) return seg;
  }
  return null;
}

async function fetchTranslationFor(englishText) {

Sentence: ${s.text}`;

function renderClickableWords(text) {

      wrap.appendChild(document.createTextNode(tok));
    } else {
      const clean = tok.replace(/[.,!?;:"'()\[\]]/g, '');
      if (/[a-zA-Z]/.test(clean) && clean.length > 0) {
        const span = document.createElement('span');
        span.className = 'word-token';
        span.textContent = tok;
        span.onclick = (e) => { e.stopPropagation(); openWordModal(clean); };
        wrap.appendChild(span);
      } else {
        wrap.appendChild(document.createTextNode(tok));
      }
    }
  });
  return wrap;
}

const POS_KR = {
  'noun': '명사', 'verb': '동사', 'adjective': '형용사', 'adverb': '부사',
  'pronoun': '대명사', 'preposition': '전치사', 'conjunction': '접속사',
  'interjection': '감탄사', 'determiner': '한정사', 'article': '관사',
  'auxiliary verb': '조동사', 'modal verb': '조동사', 'phrasal verb': '구동사',
  'idiom': '관용구'
};
function posLabel(en) {
  if (!en) return '';
  const lower = en.toLowerCase().trim();
  const kr = POS_KR[lower] || POS_KR[lower.split(/[\s,/]/)[0]] || '';
  return kr ? `${en} (${kr})` : en;
}

async function openWordModal(word) {
  if (!word) return;
  const root = ensureModalRoot();
  root.style.display = 'block';
  if (STATE.wordStack.length >= MODAL_MAX) STATE.wordStack.shift();
  STATE.wordStack.push(word.toLowerCase());
  const backBtn = root.querySelector('.word-modal-back');
  backBtn.style.display = STATE.wordStack.length > 1 ? 'inline-block' : 'none';
  await renderWordModalContent(word.toLowerCase());

function popWordModal() {
  if (STATE.wordStack.length <= 1) { closeWordModal(); return; }
  STATE.wordStack.pop();

  const root = ensureModalRoot();
  const backBtn = root.querySelector('.word-modal-back');
  backBtn.style.display = STATE.wordStack.length > 1 ? 'inline-block' : 'none';

    const labels = {
      base: '원형', past: '과거', pastParticiple: '과거분사',
      presentParticiple: '현재분사', thirdPerson: '3인칭단수'
    };
    Object.entries(labels).forEach(([k, label]) => {
      const v = d.verbForms[k];
      if (!v) return;
      const row = document.createElement('div');
      row.className = 'wm-vform';
      row.innerHTML = `<span class="wm-vlabel">${label}</span> <span class="wm-vval">${escapeHtml(v)}</span>`;
      row.appendChild(makePlayBtn(v, 'en-US'));
      sec.appendChild(row);
    });
    body.appendChild(sec);
  }
  if (Array.isArray(d.synonyms) && d.synonyms.length) {
    body.appendChild(renderRelatedSection('유의어', d.synonyms));
  }
  if (Array.isArray(d.antonyms) && d.antonyms.length) {
    body.appendChild(renderRelatedSection('반의어', d.antonyms));
  }
  if (Array.isArray(d.examples) && d.examples.length) {
    const sec = document.createElement('div');
    sec.className = 'wm-section';
    sec.innerHTML = '<div class="wm-title">예문</div>';
    d.examples.forEach(ex => {
      if (ex.simple) sec.appendChild(renderExampleBlock('일반', ex.simple, ex.simpleKR));
      if (ex.complex) sec.appendChild(renderExampleBlock('심화', ex.complex, ex.complexKR));
    });
    body.appendChild(sec);
  }
}

function renderRelatedSection(title, items) {
  const sec = document.createElement('div');
  sec.className = 'wm-section';
  sec.innerHTML = `<div class="wm-title">${title}</div>`;
  items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'wm-related';
    const head = document.createElement('div');
    head.className = 'wm-related-head';
    const wSpan = document.createElement('span');
    wSpan.className = 'word-token wm-related-word';
    wSpan.textContent = it.word || '';
    wSpan.onclick = () => openWordModal(it.word);
    head.appendChild(wSpan);
    head.appendChild(makePlayBtn(it.word || '', 'en-US'));
    row.appendChild(head);
    if (it.meaningEN) {
      const meanLine = document.createElement('div');
      meanLine.className = 'wm-related-mean';
      meanLine.appendChild(renderClickableWords(it.meaningEN));
      meanLine.appendChild(makePlayBtn(it.meaningEN, 'en-US'));
      row.appendChild(meanLine);
    }
    if (it.example) {
      const exLine = document.createElement('div');
      exLine.className = 'wm-related-ex';
      exLine.appendChild(renderClickableWords(it.example));
      exLine.appendChild(makePlayBtn(it.example, 'en-US'));
      row.appendChild(exLine);
    }
    sec.appendChild(row);
  });
  return sec;
}

function renderExampleBlock(label, en, kr) {
  const block = document.createElement('div');
  block.className = 'wm-example';
  const head = document.createElement('div');
  head.className = 'wm-ex-head';
  head.innerHTML = `<span class="wm-ex-label">${label}</span>`;
  block.appendChild(head);
  const enLine = document.createElement('div');
  enLine.className = 'wm-ex-en';
  enLine.appendChild(renderClickableWords(en));
  enLine.appendChild(makePlayBtn(en, 'en-US'));
  block.appendChild(enLine);
  const transBtn = document.createElement('button');
  transBtn.className = 'btn-mini';
  transBtn.textContent = '한국어';
  let krLine = null;
  transBtn.onclick = async () => {
    if (krLine) { krLine.remove(); krLine = null; return; }
    krLine = document.createElement('div');
    krLine.className = 'wm-ex-kr';
    if (kr) krLine.textContent = kr;
    else {
      krLine.textContent = '번역 중...';
      try { krLine.textContent = await quickTranslate(en); }
      catch { krLine.textContent = '번역 실패'; }
    }
    block.appendChild(krLine);
  };
  head.appendChild(transBtn);
  return block;
}

async function quickTranslate(en) {
  const body = {
    contents: [{ role: 'user', parts: [{ text: `Translate to natural Korean only (no other text):\n${en}` }] }],
    generationConfig: { temperature: 0.3, maxOutputTokens: 512 }
  };
  const r = await callGeminiDirect(body);
  return r.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
}

/* ============================================================
   따라읽기
   ============================================================ */
function startFollowRead(s, card) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('이 브라우저는 음성 인식을 지원하지 않습니다'); return; }
  const slot = card.querySelector('.sentence-slot');
  let resultBox = slot.querySelector('.follow-box');
  if (resultBox) resultBox.remove();
  resultBox = document.createElement('div');
  resultBox.className = 'follow-box';
  resultBox.innerHTML = '<div class="loading-mini">듣는 중... 문장을 읽으세요</div>';
  slot.appendChild(resultBox);
  const rec = new SR();
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  rec.onresult = (e) => {
    const spoken = e.results[0][0].transcript;
    showFollowReadResult(resultBox, s.text, spoken);
  };
  rec.onerror = (e) => {
    resultBox.innerHTML = `<div class="follow-err">인식 오류: ${e.error}</div>`;
  };
  try { rec.start(); }
  catch (err) { resultBox.innerHTML = `<div class="follow-err">${err.message}</div>`; }
}
function showFollowReadResult(box, original, spoken) {
  const origTokens = original.toLowerCase().replace(/[.,!?;:"'()]/g, '').split(/\s+/).filter(Boolean);
  const spokenTokens = spoken.toLowerCase().replace(/[.,!?;:"'()]/g, '').split(/\s+/).filter(Boolean);
  const spokenSet = new Set(spokenTokens);
  let correct = 0;
  const html = origTokens.map(t => {
    const ok = spokenSet.has(t);
    if (ok) correct++;
    return `<span class="${ok ? 'fr-ok' : 'fr-no'}">${escapeHtml(t)}</span>`;
  }).join(' ');
  const pct = origTokens.length > 0 ? Math.round((correct / origTokens.length) * 100) : 0;
  box.innerHTML = `<div class="fr-score">정확도 ${pct}%</div>
    <div class="fr-spoken">인식: ${escapeHtml(spoken)}</div>
    <div class="fr-compare">${html}</div>`;
}

/* ============================================================
   문서 목록 (검색/정렬/선택삭제/일괄삭제/원본보기)
   ============================================================ */
async function refreshDocList() {
  const list = $('#docList');
  if (!list) return;
  list.innerHTML = '';
  try {
    let docs = await dbAll('documents');
    // 검색 필터
    if (STATE.docSearch) {
      const q = STATE.docSearch.toLowerCase();
      docs = docs.filter(d =>
        (d.title || '').toLowerCase().includes(q) ||
        (d.fullText || '').toLowerCase().includes(q)
      );
    }
    // 정렬
    if (STATE.docSort === 'name') {
      docs.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
    } else {
      docs.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    }
    if (docs.length === 0) {
      list.innerHTML = '<div class="loading-mini">저장된 문서가 없습니다</div>';
      return;
    }
    docs.forEach(doc => list.appendChild(renderDocItem(doc)));
  } catch (err) {
    console.error('doc list', err);
  }
}

function renderDocItem(doc) {
  const item = document.createElement('div');
  item.className = 'doc-item';
  
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = STATE.docSelected.has(doc.id);
  cb.onchange = () => {
    if (cb.checked) STATE.docSelected.add(doc.id);
    else STATE.docSelected.delete(doc.id);
  };
  item.appendChild(cb);
  
  const body = document.createElement('div');
  body.className = 'doc-item-body';
  const isPartial = !doc.sentences || doc.sentences.length === 0;
  body.innerHTML = `
    <div class="doc-title">${escapeHtml(doc.title || '제목 없음')}${isPartial ? ' <span class="doc-badge">부분</span>' : ''}</div>
    <div class="doc-meta">${escapeHtml(doc.sourceType || '')} · ${(doc.sentences || []).length}문장 · ${new Date(doc.createdAt || 0).toLocaleDateString('ko-KR')}</div>
  `;
  body.onclick = () => openDocument(doc.id);
  item.appendChild(body);
  
  const actions = document.createElement('div');
  actions.className = 'doc-actions';
  actions.style.flexBasis = '100%';
  
  const playAllBtn = document.createElement('button');
  playAllBtn.textContent = '전체재생';
  playAllBtn.onclick = (e) => { e.stopPropagation(); playAllSentences(doc); };
  actions.appendChild(playAllBtn);
  
  if (doc.fileName) {
    const fileBtn = document.createElement('button');
    fileBtn.textContent = '원본보기';
    fileBtn.onclick = (e) => { e.stopPropagation(); viewOriginalFile(doc.id); };
    actions.appendChild(fileBtn);
  }
  
  const delBtn = document.createElement('button');
  delBtn.textContent = '삭제';
  delBtn.onclick = (e) => { e.stopPropagation(); deleteDocument(doc.id); };
  actions.appendChild(delBtn);
  
  item.appendChild(actions);
  return item;
}

let playAllState = { active: false, cancel: null };
async function playAllSentences(doc) {
  if (playAllState.active) {
    playAllState.active = false;
    stopSpeaking();
    toast('재생 중지');
    return;
  }
  const sentences = doc.sentences || [];
  if (sentences.length === 0) { toast('재생할 문장이 없습니다'); return; }
  playAllState.active = true;
  const useOriginal = doc.videoId && doc.segments?.length > 0;
  if (useOriginal) initYouTubePlayer(doc.videoId);
  
  for (const s of sentences) {
    if (!playAllState.active) break;
    await new Promise(resolve => {
      let seg = null;
      if (useOriginal && doc.segments) {
        const target = s.text.toLowerCase().slice(0, 15);
        seg = doc.segments.find(sg => sg.text.toLowerCase().includes(target));
      }
      if (seg && STATE.ytPlayer) {
        playOriginal(seg.start, seg.end, resolve);
      } else {
        speak(s.text, { onEnd: resolve });
      }
    });
  }
  playAllState.active = false;
}

async function viewOriginalFile(docId) {
  try {
    const fileRec = await dbGet('files', docId);
    if (!fileRec || !fileRec.blob) {
      toast('원본 파일이 저장되어 있지 않습니다');
      return;
    }
    const url = URL.createObjectURL(fileRec.blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (err) {
    toast('파일 열기 실패: ' + err.message);
  }
}

async function openDocument(docId) {
  const doc = await dbGet('documents', docId);
  if (!doc) return;
  STATE.analyzing = false;
  stopSpeaking();
  resetActivePlayBtn();
  const progressCard = $('#progressCard'); if (progressCard) progressCard.style.display = 'none';
  const container = $('#sentenceList'); if (container) container.innerHTML = '';
  STATE.sentences = doc.sentences || [];
  STATE.currentDocId = doc.id;
  STATE.currentVideoId = doc.videoId || null;
  STATE.ytSegments = doc.segments || [];
  STATE.sourceType = doc.sourceType || 'text';
  STATE.currentFullText = doc.fullText || '';
  if (doc.videoId && doc.segments?.length) initYouTubePlayer(doc.videoId);
  STATE.sentences.forEach(s => {
    if (!s.number) s.number = s.index + 1;
    renderSentenceBlock(s);
  });
  const side = $('#sidePanel'); if (side) side.classList.remove('open');
  updateOriginalModeAvailability();
  const saveBtn = $('#saveBtn');
  if (saveBtn) saveBtn.style.display = 'inline-block';
  setStatus(`문서 열기 완료 (${STATE.sentences.length}문장)`);
}

async function deleteDocument(docId) {
  if (!confirm('이 문서를 삭제하시겠습니까?')) return;
  await dbDelete('documents', docId);
  try { await dbDelete('files', docId); } catch {}
  STATE.docSelected.delete(docId);
  if (STATE.currentDocId === docId) {
    const container = $('#sentenceList'); if (container) container.innerHTML = '';
    STATE.sentences = [];
    STATE.currentDocId = null;
  }
  refreshDocList();
}
async function deleteSelectedDocs() {
  if (STATE.docSelected.size === 0) { toast('선택된 문서가 없습니다'); return; }
  if (!confirm(`선택된 ${STATE.docSelected.size}개 문서를 삭제하시겠습니까?`)) return;
  for (const id of Array.from(STATE.docSelected)) {
    await dbDelete('documents', id);
    try { await dbDelete('files', id); } catch {}
  }
  STATE.docSelected.clear();
  refreshDocList();
}
async function deleteAllDocs() {
  if (!confirm('모든 문서를 삭제하시겠습니까?')) return;
  const all = await dbAll('documents');
  for (const d of all) {
    await dbDelete('documents', d.id);
    try { await dbDelete('files', d.id); } catch {}
  }
  STATE.docSelected.clear();
  if (STATE.currentDocId) {
    const container = $('#sentenceList'); if (container) container.innerHTML = '';
    STATE.sentences = [];
    STATE.currentDocId = null;
  }
  refreshDocList();
}
async function selectAllVisible() {
  const docs = await dbAll('documents');
  let filtered = docs;
  if (STATE.docSearch) {
    const q = STATE.docSearch.toLowerCase();
    filtered = filtered.filter(d => (d.title || '').toLowerCase().includes(q));
  }
  filtered.forEach(d => STATE.docSelected.add(d.id));
  refreshDocList();
}

/* ============================================================
   저장 / 맨위로 / 폰트 / 속도 / 성별
   ============================================================ */
async function manualSave() {
  if (!STATE.currentDocId) { toast('저장할 문서가 없습니다'); return; }
  const doc = await dbGet('documents', STATE.currentDocId);
  if (!doc) { toast('문서를 찾을 수 없습니다'); return; }
  const newTitle = prompt('저장할 제목', doc.title || '');
  if (newTitle === null) return;
  doc.title = newTitle.trim() || doc.title;
  doc.sentences = STATE.sentences;
  doc.updatedAt = new Date().toISOString();
  await dbPut('documents', doc);
  toast('저장되었습니다');
  refreshDocList();
}

function setupScrollTop() {
  let btn = $('#scrollTopBtn');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'scrollTopBtn';
    btn.className = 'scroll-top-btn';
    btn.setAttribute('aria-label', '맨 위로');
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 12 L10 6 L16 12" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    btn.style.display = 'none';
    btn.onclick = () => window.scrollTo({ top: 0, behavior: 'smooth' });
    document.body.appendChild(btn);
  }
  window.addEventListener('scroll', () => {
    btn.style.display = window.scrollY > 50 ? 'flex' : 'none';
  });
}

function setFontSize(n) {
  const size = Math.min(28, Math.max(12, n));
  STATE.fontSize = size;
  document.documentElement.style.setProperty('--base', `${size}px`);
  try { localStorage.setItem('fontSize', String(size)); } catch {}
  const label = $('#fontSizeLabel');
  if (label) label.textContent = String(size);
}

const SPEED_OPTIONS = [0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2];
function renderSpeedGrid() {
  const grid = $('#speedGrid');
  if (!grid) return;
  grid.innerHTML = '';
  SPEED_OPTIONS.forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'speed-btn' + (Math.abs(v - STATE.speed) < 0.01 ? ' active' : '');
    btn.textContent = `${v.toFixed(1)}x`;
    btn.onclick = () => {
      STATE.speed = v;
      try { localStorage.setItem('speed', String(v)); } catch {}
      const t = $('#speedTitle'); if (t) t.textContent = `재생 속도: ${v.toFixed(1)}x`;
      renderSpeedGrid();
      applyPlaybackChange();
    };
    grid.appendChild(btn);
  });
}

function setGender(g) {
  STATE.voiceGender = g;
  try { localStorage.setItem('voiceGender', g); } catch {}

  $$('#genderToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.gender === g);
  });
  // 즉시 보이스 재선택 후 샘플 재생
  loadVoices();
  speak('Hello, this is your selected voice.', { lang: 'en-US' });
}

/* ============================================================
   UI 바인딩
   ============================================================ */
function bindUI() {
  $('#analyzeBtn')?.addEventListener('click', handleAnalyze);
  $('#fileInput')?.addEventListener('change', e => handleFile(e.target.files[0]));
  $('#hamburgerBtn')?.addEventListener('click', () => $('#sidePanel')?.classList.toggle('open'));
  $('#sidePanelClose')?.addEventListener('click', () => $('#sidePanel')?.classList.remove('open'));
  $('#cancelBtn')?.addEventListener('click', () => {
    STATE.analyzing = false;
    hideProgress();
    setStatus('분석 취소됨');
  });
  $('#saveBtn')?.addEventListener('click', manualSave);
  $('#fontPlus')?.addEventListener('click', () => setFontSize(STATE.fontSize + 2));
  $('#fontMinus')?.addEventListener('click', () => setFontSize(STATE.fontSize - 2));
  $('#voiceModeSelect')?.addEventListener('change', e => {
    STATE.voiceMode = e.target.value;
    updateOriginalModeAvailability();
  });

  $$('#genderToggle button').forEach(b => {
    b.addEventListener('click', () => setGender(b.dataset.gender));
  });
  $('#koreanModeToggle')?.addEventListener('change', e => toggleKoreanMode(e.target.checked));
  $('#koreanAudioInput')?.addEventListener('change', e => handleKoreanAudioUpload(e.target.files[0]));
  $('#recStartBtn')?.addEventListener('click', startRecording);
  $('#recStopBtn')?.addEventListener('click', stopRecording);
  
  $('#docSearch')?.addEventListener('input', e => {
    STATE.docSearch = e.target.value;
    refreshDocList();
  });
  $('#docSort')?.addEventListener('change', e => {
    STATE.docSort = e.target.value;
    refreshDocList();
  });
  $('#docSelectAll')?.addEventListener('click', selectAllVisible);
  $('#docDeleteSelected')?.addEventListener('click', deleteSelectedDocs);
  $('#docDeleteAll')?.addEventListener('click', deleteAllDocs);
  
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const modal = $('#wordModal');
      if (modal && modal.style.display !== 'none') closeWordModal();
      else $('#sidePanel')?.classList.remove('open');
    }
  });
}

/* ============================================================
   초기화
   ============================================================ */
async function init() {
  try {
    const saved = parseInt(localStorage.getItem('fontSize') || '16', 10);
    setFontSize(saved);
  } catch { setFontSize(16); }
  try {
    const sp = parseFloat(localStorage.getItem('speed') || '1.0');
    if (SPEED_OPTIONS.some(v => Math.abs(v - sp) < 0.01)) STATE.speed = sp;
  } catch {}
  try {
    const g = localStorage.getItem('voiceGender') || 'female';
    STATE.voiceGender = g;
  } catch {}
  
  bindUI();
  setupScrollTop();
  ensureModalRoot();
  renderSpeedGrid();
  $('#speedTitle').textContent = `재생 속도: ${STATE.speed.toFixed(1)}x`;

  $$('#genderToggle button').forEach(b => b.classList.toggle('active', b.dataset.gender === STATE.voiceGender));
  
  try { await dbOpen(); } catch (err) { console.error('DB open:', err); }
  try {
    const res = await fetch('/api/health');
    const data = await res.json();
    setStatus(`서버 연결됨 (키 ${data.keyCount}개)`);
  } catch {
    setStatus('서버 연결 실패');
  }
  try { warmupTTS(); loadVoices(); } catch {}
  // 보이스 로딩이 늦을 수 있어 한 번 더 시도
  setTimeout(() => loadVoices(), 500);
  setTimeout(() => loadVoices(), 1500);
  
  refreshDocList();
  updateOriginalModeAvailability();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
